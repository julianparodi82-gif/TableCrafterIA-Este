<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta charset="UTF-8">
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 12px;
        background-color: #F9FAFB;
        color: #111827;
        line-height: 1.4;
      }
      h2 {
        margin-top: 0;
        margin-bottom: 12px;
        font-size: 20px;
        font-weight: 600;
        color: #2563EB;
      }
      .container {
        background: transparent;
      }
      .tab-nav {
        display: flex;
        gap: 8px;
        margin-bottom: 16px;
      }
      .tab-btn {
        flex: 1;
        border: 1px solid #D1D5DB;
        background-color: #FFFFFF;
        color: #111827;
        padding: 10px 12px;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 600;
        transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
      }
      .tab-btn:hover {
        background-color: #EFF6FF;
        border-color: #2563EB;
        color: #1E40AF;
      }
      .tab-btn.active {
        background-color: #2563EB;
        border-color: #2563EB;
        color: #FFFFFF;
      }
      .tab-content {
        display: none;
      }
      .tab-content.active {
        display: block;
      }
      .section {
        margin-bottom: 20px;
        padding-bottom: 12px;
        border-bottom: 1px solid #E5E7EB;
      }
      .section:last-child {
        border-bottom: none;
        margin-bottom: 0;
      }
      label {
        display: block;
        margin-top: 8px;
        margin-bottom: 4px;
        font-weight: 600;
      }
      input[type="text"], textarea, select {
        width: 100%;
        padding: 8px;
        border: 1px solid #E5E7EB;
        border-radius: 4px;
        background-color: #FFFFFF;
        color: #111827;
        box-sizing: border-box;
        min-height: 36px;
      }
      textarea {
        min-height: 60px;
        resize: vertical;
      }
      input[type="color"] {
        width: 100%;
        padding: 0;
        height: 36px;
        border: 1px solid #E5E7EB;
        border-radius: 4px;
        cursor: pointer;
        background-color: #FFFFFF;
      }
      .header-list {
        list-style-type: none;
        padding: 0;
        margin: 0;
        border: 1px solid #E5E7EB;
        border-radius: 4px;
        background-color: #FFFFFF;
        max-height: 180px;
        overflow-y: auto;
      }
      .header-item {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 4px;
        border-bottom: 1px solid #E5E7EB;
      }
      .header-item:last-child {
        border-bottom: none;
      }
      .header-item input[type="text"] {
        flex-grow: 1;
        margin-right: 4px;
        min-height: 32px;
      }
      .header-item button {
        border: none;
        background-color: #E5E7EB;
        color: #111827;
        padding: 4px 8px;
        border-radius: 4px;
        cursor: pointer;
        min-width: 32px;
        height: 32px;
        font-size: 16px;
        line-height: 1;
      }
      .header-item button:hover {
        background-color: #D1D5DB;
      }
      .toggle-group {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 8px;
        margin-bottom: 8px;
      }
      .btn-primary {
        background-color: #2563EB;
        color: #FFFFFF;
        border: none;
        border-radius: 4px;
        padding: 12px;
        width: 100%;
        cursor: pointer;
        font-weight: 600;
        min-height: 44px;
        margin-top: 12px;
      }
      .btn-primary:hover {
        background-color: #1E4DB7;
      }
      .btn-secondary {
        background-color: #10B981;
        color: #FFFFFF;
        border: none;
        border-radius: 4px;
        padding: 8px 12px;
        cursor: pointer;
        font-weight: 600;
        min-height: 36px;
      }
      .btn-secondary:hover {
        background-color: #0E8F6B;
      }
      .btn-danger {
        background-color: #EF4444;
        color: #FFFFFF;
        border: none;
        border-radius: 4px;
        padding: 8px 12px;
        cursor: pointer;
        font-weight: 600;
        min-height: 36px;
      }
      .btn-danger:hover {
        background-color: #DC2626;
      }
      .range-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
      }
      .range-row strong {
        flex-grow: 1;
      }
      .action-buttons {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-top: 12px;
      }
      .action-buttons button {
        flex: 1 1 160px;
      }
      pre.answer-box {
        background-color: #FFFFFF;
        border: 1px solid #E5E7EB;
        border-radius: 4px;
        padding: 8px;
        max-height: 220px;
        overflow: auto;
        white-space: pre-wrap;
      }
      .small-text {
        font-size: 12px;
        color: #6B7280;
      }
      .tc-modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(15, 23, 42, 0.45);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 16px;
        z-index: 9999;
      }
      .tc-modal-overlay.show {
        display: flex;
      }
      .tc-modal {
        background: #FFFFFF;
        border-radius: 16px;
        padding: 24px;
        width: 100%;
        max-width: 360px;
        text-align: center;
        box-shadow: 0 20px 45px rgba(15, 23, 42, 0.25);
      }
      .tc-modal-icon {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 16px;
        font-size: 28px;
        font-weight: 700;
      }
      .tc-modal-title {
        margin: 0 0 8px;
        font-size: 18px;
        font-weight: 700;
        color: #111827;
      }
      .tc-modal-message {
        margin: 0 0 24px;
        color: #4B5563;
        font-size: 14px;
        white-space: pre-wrap;
      }
      .tc-modal-actions {
        display: flex;
        justify-content: center;
        gap: 12px;
        flex-wrap: wrap;
      }
      .tc-modal-btn {
        border: none;
        border-radius: 8px;
        padding: 10px 18px;
        font-weight: 600;
        cursor: pointer;
        min-width: 120px;
        font-size: 14px;
      }
      .tc-modal-btn.primary {
        background-color: #2563EB;
        color: #FFFFFF;
      }
      .tc-modal-btn.primary:hover {
        background-color: #1E4DB7;
      }
      .tc-modal-btn.secondary {
        background-color: #E5E7EB;
        color: #111827;
      }
      .tc-modal-btn.secondary:hover {
        background-color: #D1D5DB;
      }
      .tc-modal-overlay[data-variant="info"] .tc-modal-icon {
        background: #DBEAFE;
        color: #1D4ED8;
      }
      .tc-modal-overlay[data-variant="success"] .tc-modal-icon {
        background: #DCFCE7;
        color: #15803D;
      }
      .tc-modal-overlay[data-variant="error"] .tc-modal-icon {
        background: #FEE2E2;
        color: #B91C1C;
      }
      .tc-modal-overlay[data-variant="warning"] .tc-modal-icon {
        background: #FEF3C7;
        color: #B45309;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>TableCrafter AI</h2>
      <div class="tab-nav">
        <button class="tab-btn active" data-tab="createTab">Crear tabla</button>
        <button class="tab-btn" data-tab="editTab">Editar tabla</button>
        <button class="tab-btn" data-tab="aiTab">Consultas IA</button>
      </div>

      <div id="createTab" class="tab-content active">
        <div class="section">
          <div class="range-row">
            <div>
              <strong>Rango activo:</strong> <span id="rangeLabel">—</span>
            </div>
            <button id="refreshRangeBtn" class="btn-secondary" title="Actualizar rango activo">Actualizar</button>
          </div>
          <label for="rangeInput" style="margin-top:12px;">Rango a utilizar</label>
          <input type="text" id="rangeInput" placeholder="Ej: Hoja1!A1:D10" />
          <div class="small-text" style="margin-top:4px;">
            Puede escribir el rango manualmente o usar "Actualizar" para tomar la selección activa.
          </div>
        </div>
        <div class="section">
          <label for="tableName">Nombre de la tabla</label>
          <input type="text" id="tableName" placeholder="Ingrese un nombre..." />
          <label for="tableDesc">Descripción</label>
          <textarea id="tableDesc" placeholder="Descripción de la tabla..."></textarea>
          <label>Encabezados (puede editar y reordenar)</label>
          <ul id="headersList" class="header-list"></ul>
          <div class="toggle-group">
            <label for="colorHeader">Color encabezado</label>
            <input type="color" id="colorHeader" />
          </div>
          <div class="toggle-group">
            <label for="colorAlt1">Color filas alternas 1</label>
            <input type="color" id="colorAlt1" />
          </div>
          <div class="toggle-group">
            <label for="colorAlt2">Color filas alternas 2</label>
            <input type="color" id="colorAlt2" />
          </div>
          <div class="toggle-group">
            <label><input type="checkbox" id="toggleBorder" checked /> Bordes negros</label>
            <label><input type="checkbox" id="toggleBold" checked /> Encabezado en negrita</label>
          </div>
          <div class="action-buttons">
            <button id="applyFormatBtn" class="btn-primary">Aplicar formato</button>
            <button id="saveTableBtn" class="btn-secondary">Guardar tabla</button>
          </div>
        </div>
      </div>

      <div id="editTab" class="tab-content">
        <div class="section">
          <label for="editSavedTables">Tablas guardadas</label>
          <select id="editSavedTables"></select>
          <div class="toggle-group" style="margin-top:8px;">
            <button id="editTableBtn" class="btn-secondary" title="Editar tabla seleccionada">Editar</button>
            <button id="clearTableBtn" class="btn-danger" title="Limpiar rango de la tabla">Limpiar rango</button>
          </div>
        </div>
      </div>

      <div id="aiTab" class="tab-content">
        <div class="section">
          <label for="aiSavedTables">Tablas disponibles</label>
          <select id="aiSavedTables"></select>
          <label for="questionInput" style="margin-top:12px;">Pregunta a IA</label>
          <input type="text" id="questionInput" placeholder="Escribe tu pregunta..." />
          <button id="askBtn" class="btn-secondary" style="margin-top:8px;">Preguntar</button>
          <div id="apiWarning" class="small-text" style="margin-top:8px;"></div>
          <pre id="answerBox" class="answer-box" style="display:none;"></pre>
        </div>
      </div>
    </div>

    <div id="tcModalOverlay" class="tc-modal-overlay" aria-hidden="true" data-variant="info">
      <div class="tc-modal" role="dialog" aria-modal="true" aria-labelledby="tcModalTitle" aria-describedby="tcModalMessage">
        <div id="tcModalIcon" class="tc-modal-icon">ℹ️</div>
        <h3 id="tcModalTitle" class="tc-modal-title">Aviso</h3>
        <p id="tcModalMessage" class="tc-modal-message"></p>
        <div class="tc-modal-actions">
          <button type="button" id="tcModalSecondary" class="tc-modal-btn secondary">Cancelar</button>
          <button type="button" id="tcModalPrimary" class="tc-modal-btn primary">Aceptar</button>
        </div>
      </div>
    </div>

    <script>
      let currentHeaders = [];
      let rangeInfo = null;
      let editingId = '';
      let currentTab = '';

      function defaultTitleForVariant(variant) {
        switch (variant) {
          case 'error':
            return 'Ocurrió un problema';
          case 'success':
            return 'Operación completada';
          case 'warning':
            return 'Atención';
          default:
            return 'Aviso';
        }
      }

      function openModal(options) {
        const overlay = document.getElementById('tcModalOverlay');
        const icon = document.getElementById('tcModalIcon');
        const titleEl = document.getElementById('tcModalTitle');
        const messageEl = document.getElementById('tcModalMessage');
        const primaryBtn = document.getElementById('tcModalPrimary');
        const secondaryBtn = document.getElementById('tcModalSecondary');
        const variant = options.variant || 'info';
        const allowEscape = options.allowEscape !== false;

        if (!overlay || !icon || !titleEl || !messageEl || !primaryBtn || !secondaryBtn) {
          return Promise.resolve('dismissed');
        }

        overlay.dataset.variant = variant;
        icon.textContent = options.icon || (variant === 'error' ? '⚠️' : variant === 'success' ? '✅' : variant === 'warning' ? '⚠️' : 'ℹ️');
        titleEl.textContent = options.title || defaultTitleForVariant(variant);
        messageEl.textContent = options.message || '';

        primaryBtn.textContent = options.primaryText || 'Aceptar';
        secondaryBtn.textContent = options.secondaryText || 'Cancelar';

        if (options.secondaryText) {
          secondaryBtn.style.display = 'inline-flex';
        } else {
          secondaryBtn.style.display = 'none';
        }

        const previouslyFocused = document.activeElement;

        return new Promise(function(resolve) {
          function cleanup(result) {
            overlay.classList.remove('show');
            overlay.setAttribute('aria-hidden', 'true');
            document.removeEventListener('keydown', keyListener, true);
            primaryBtn.removeEventListener('click', primaryHandler);
            secondaryBtn.removeEventListener('click', secondaryHandler);
            if (previouslyFocused && typeof previouslyFocused.focus === 'function') {
              previouslyFocused.focus();
            }
            resolve(result);
          }

          function primaryHandler() {
            cleanup('primary');
          }

          function secondaryHandler() {
            cleanup('secondary');
          }

          function keyListener(evt) {
            if (evt.key === 'Escape' && allowEscape) {
              evt.preventDefault();
              cleanup('escape');
            } else if (evt.key === 'Tab') {
              const focusables = Array.prototype.filter.call(overlay.querySelectorAll('button'), function(btn) {
                return btn.offsetParent !== null;
              });
              if (focusables.length === 0) {
                return;
              }
              const first = focusables[0];
              const last = focusables[focusables.length - 1];
              if (evt.shiftKey) {
                if (document.activeElement === first) {
                  evt.preventDefault();
                  last.focus();
                }
              } else if (document.activeElement === last) {
                evt.preventDefault();
                first.focus();
              }
            }
          }

          overlay.setAttribute('aria-hidden', 'false');
          overlay.classList.add('show');

          document.addEventListener('keydown', keyListener, true);
          primaryBtn.addEventListener('click', primaryHandler);
          secondaryBtn.addEventListener('click', secondaryHandler);

          requestAnimationFrame(function() {
            primaryBtn.focus();
          });
        });
      }

      function showMessageModal(message, opts) {
        const options = Object.assign({ message: message }, opts || {});
        if (!options.title) {
          options.title = defaultTitleForVariant(options.variant || 'info');
        }
        options.primaryText = options.primaryText || 'Aceptar';
        options.allowEscape = options.allowEscape !== false;
        return openModal(options);
      }

      function showConfirmModal(message, opts) {
        const options = Object.assign({ message: message }, opts || {});
        options.primaryText = options.confirmText || 'Aceptar';
        options.secondaryText = options.cancelText || 'Cancelar';
        options.variant = options.variant || 'warning';
        if (!options.title) {
          options.title = defaultTitleForVariant(options.variant);
        }
        options.allowEscape = options.allowEscape !== false;
        return openModal(options).then(function(result) {
          return result === 'primary';
        });
      }

      function clearRangeUI() {
        const label = document.getElementById('rangeLabel');
        if (label) {
          label.textContent = '—';
        }
        const input = document.getElementById('rangeInput');
        if (input) {
          input.value = '';
          input.dataset.manual = 'false';
        }
        rangeInfo = null;
      }

      function setRangeUI(info, options) {
        options = options || {};
        if (!info || !info.sheetName || !info.a1Notation) {
          clearRangeUI();
          return;
        }
        const rows = typeof info.rows === 'number' ? info.rows : (info.rows || 0);
        const cols = typeof info.cols === 'number' ? info.cols : (info.cols || 0);
        const label = document.getElementById('rangeLabel');
        const input = document.getElementById('rangeInput');
        const fullA1 = info.sheetName + '!' + info.a1Notation;
        if (label) {
          const dims = rows && cols ? ' (' + cols + '×' + rows + ')' : '';
          label.textContent = fullA1 + dims;
        }
        if (input && (options.force || input.dataset.manual !== 'true')) {
          input.value = fullA1;
          input.dataset.manual = 'false';
        }
        rangeInfo = {
          sheetName: info.sheetName,
          a1Notation: info.a1Notation,
          rows: rows,
          cols: cols,
          headers: Array.isArray(info.headers) ? info.headers.slice() : currentHeaders.slice()
        };
        rangeInfo.fullA1 = fullA1;
      }

      function getRangeInputValue() {
        const input = document.getElementById('rangeInput');
        if (input) {
          const text = input.value.trim();
          if (text) {
            return text;
          }
        }
        if (rangeInfo && rangeInfo.sheetName && rangeInfo.a1Notation) {
          return rangeInfo.sheetName + '!' + rangeInfo.a1Notation;
        }
        return '';
      }

      function renderHeaders() {
        const list = document.getElementById('headersList');
        list.innerHTML = '';
        currentHeaders.forEach((header, index) => {
          const li = document.createElement('li');
          li.className = 'header-item';

          const inp = document.createElement('input');
          inp.type = 'text';
          inp.value = header;
          inp.addEventListener('input', function() {
            currentHeaders[index] = this.value;
          });
          li.appendChild(inp);

          const upBtn = document.createElement('button');
          upBtn.textContent = '↑';
          upBtn.title = 'Subir';
          upBtn.addEventListener('click', function() {
            if (index > 0) {
              const tmp = currentHeaders[index - 1];
              currentHeaders[index - 1] = currentHeaders[index];
              currentHeaders[index] = tmp;
              renderHeaders();
            }
          });
          li.appendChild(upBtn);

          const downBtn = document.createElement('button');
          downBtn.textContent = '↓';
          downBtn.title = 'Bajar';
          downBtn.addEventListener('click', function() {
            if (index < currentHeaders.length - 1) {
              const tmp = currentHeaders[index + 1];
              currentHeaders[index + 1] = currentHeaders[index];
              currentHeaders[index] = tmp;
              renderHeaders();
            }
          });
          li.appendChild(downBtn);

          list.appendChild(li);
        });
      }

      function setDefaultStyles() {
        const colorHeader = document.getElementById('colorHeader');
        const colorAlt1 = document.getElementById('colorAlt1');
        const colorAlt2 = document.getElementById('colorAlt2');
        if (colorHeader) colorHeader.value = '#CFE8FC';
        if (colorAlt1) colorAlt1.value = '#FFFFFF';
        if (colorAlt2) colorAlt2.value = '#F3F4F6';
      }

      function loadActiveRange(updateHeaders = true) {
        google.script.run.withSuccessHandler(function(info) {
          const label = document.getElementById('rangeLabel');
          if (info.error) {
            clearRangeUI();
            if (label) {
              label.textContent = '—';
            }
            showMessageModal(info.error, {
              title: 'Rango no disponible',
              variant: 'error'
            });
            return;
          }
          const infoForUi = Object.assign({}, info);
          if (!updateHeaders) {
            infoForUi.headers = currentHeaders.slice();
          }
          setRangeUI(infoForUi, { force: editingId === '' || !document.getElementById('rangeInput') || document.getElementById('rangeInput').value === '' });
          if (updateHeaders) {
            currentHeaders = Array.isArray(info.headers) ? info.headers : [];
          }
          renderHeaders();
        }).getActiveRangeInfo();
      }

      function refreshSavedTables(targetIds) {
        const ids = Array.isArray(targetIds) ? targetIds : [targetIds];
        google.script.run.withSuccessHandler(function(tables) {
          ids.forEach(function(id) {
            const select = document.getElementById(id);
            if (!select) {
              return;
            }
            const previousValue = select.value;
            select.innerHTML = '';
            const defaultOption = document.createElement('option');
            defaultOption.value = '';
            defaultOption.textContent = '-- Seleccione --';
            select.appendChild(defaultOption);
            tables.forEach(function(t) {
              const opt = document.createElement('option');
              opt.value = t.id;
              opt.textContent = t.name || t.id;
              select.appendChild(opt);
            });
            if (id === 'editSavedTables' && editingId) {
              select.value = editingId;
            } else if (previousValue) {
              select.value = previousValue;
            }
          });
        }).listSavedTables();
      }

      function checkApiKey() {
        google.script.run.withSuccessHandler(function(res) {
          const warn = document.getElementById('apiWarning');
          if (!warn) return;
          if (!res || !res.key) {
            warn.innerHTML = 'Configure su API Key para usar la IA (menú Configurar API).';
          } else {
            warn.innerHTML = '';
          }
        }).getApiKey();
      }

      function showTab(tabId) {
        if (currentTab === tabId) {
          return;
        }
        currentTab = tabId;
        document.querySelectorAll('.tab-btn').forEach(function(btn) {
          if (btn.dataset.tab === tabId) {
            btn.classList.add('active');
          } else {
            btn.classList.remove('active');
          }
        });
        document.querySelectorAll('.tab-content').forEach(function(content) {
          if (content.id === tabId) {
            content.classList.add('active');
          } else {
            content.classList.remove('active');
          }
        });

        if (tabId === 'createTab') {
          loadActiveRange(editingId === '');
        } else if (tabId === 'editTab') {
          refreshSavedTables('editSavedTables');
        } else if (tabId === 'aiTab') {
          refreshSavedTables('aiSavedTables');
          checkApiKey();
        }
      }

      document.querySelectorAll('.tab-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
          showTab(btn.dataset.tab);
        });
      });

      document.getElementById('refreshRangeBtn').addEventListener('click', function() {
        const input = document.getElementById('rangeInput');
        if (input) {
          input.dataset.manual = 'false';
        }
        loadActiveRange(editingId === '');
      });

      document.getElementById('applyFormatBtn').addEventListener('click', function() {
        const rangeA1 = getRangeInputValue();
        if (!rangeA1) {
          showMessageModal('Indique un rango válido antes de aplicar el formato.', {
            title: 'Rango requerido',
            variant: 'error'
          });
          return;
        }
        const headerColor = document.getElementById('colorHeader').value;
        const alt1 = document.getElementById('colorAlt1').value;
        const alt2 = document.getElementById('colorAlt2').value;
        const border = document.getElementById('toggleBorder').checked;
        const bold = document.getElementById('toggleBold').checked;
        const style = { headerColor: headerColor, altColor1: alt1, altColor2: alt2, border: border, bold: bold };
        const tableId = editingId;
        google.script.run.withSuccessHandler(function(res) {
          if (res && res.error) {
            showMessageModal(res.error, {
              title: 'No se pudo aplicar',
              variant: 'error'
            });
            return;
          }
          if (res && res.rangeInfo) {
            setRangeUI(res.rangeInfo, { force: true });
            if (Array.isArray(res.rangeInfo.headers)) {
              currentHeaders = res.rangeInfo.headers.slice();
              renderHeaders();
            }
          }
          showMessageModal((res && res.message) || 'Formato aplicado correctamente.', {
            title: 'Formato aplicado',
            variant: 'success'
          });
        }).applyTableFormatting(tableId, rangeA1, document.getElementById('tableName').value.trim(), document.getElementById('tableDesc').value.trim(), currentHeaders, style, { skipSaving: true });
      });

      document.getElementById('saveTableBtn').addEventListener('click', async function() {
        const rangeA1 = getRangeInputValue();
        if (!rangeA1) {
          showMessageModal('Indique un rango válido antes de guardar la tabla.', {
            title: 'Rango requerido',
            variant: 'error'
          });
          return;
        }
        const name = document.getElementById('tableName').value.trim();
        if (!name) {
          const continueWithoutName = await showConfirmModal('Guardar sin nombre hará que la tabla sea difícil de identificar. ¿Desea continuar?', {
            title: 'Guardar sin nombre',
            variant: 'warning',
            confirmText: 'Continuar',
            cancelText: 'Cancelar'
          });
          if (!continueWithoutName) {
            return;
          }
        }
        const desc = document.getElementById('tableDesc').value.trim();
        const headerColor = document.getElementById('colorHeader').value;
        const alt1 = document.getElementById('colorAlt1').value;
        const alt2 = document.getElementById('colorAlt2').value;
        const border = document.getElementById('toggleBorder').checked;
        const bold = document.getElementById('toggleBold').checked;
        const style = { headerColor: headerColor, altColor1: alt1, altColor2: alt2, border: border, bold: bold };
        const tableId = editingId;
        google.script.run.withSuccessHandler(function(res) {
          if (res && res.error) {
            showMessageModal(res.error, {
              title: 'No se pudo guardar',
              variant: 'error'
            });
            return;
          }
          if (res && res.rangeInfo) {
            setRangeUI(res.rangeInfo, { force: true });
            if (Array.isArray(res.rangeInfo.headers)) {
              currentHeaders = res.rangeInfo.headers.slice();
              renderHeaders();
            }
          }
          if (res && res.isNew) {
            editingId = '';
            clearRangeUI();
            currentHeaders = [];
            renderHeaders();
          } else if (res && res.id) {
            editingId = res.id;
          }
          refreshSavedTables(['editSavedTables', 'aiSavedTables']);
          showMessageModal((res && res.message) || 'Tabla guardada correctamente.', {
            title: 'Tabla guardada',
            variant: 'success'
          });
        }).applyTableFormatting(tableId, rangeA1, name, desc, currentHeaders, style, { skipFormatting: true });
      });

      document.getElementById('editSavedTables').addEventListener('change', function() {
        const val = this.value;
        editingId = '';
        if (val) {
          google.script.run.withSuccessHandler(function(meta) {
            if (meta) {
              document.getElementById('tableName').value = meta.name || '';
              document.getElementById('tableDesc').value = meta.description || '';
              if (meta.rangeA1 && meta.sheetName) {
                const parts = meta.rangeA1.split('!');
                let rangeNotation = meta.rangeA1;
                if (parts.length === 2) {
                  rangeNotation = parts[1];
                }
                setRangeUI({
                  sheetName: meta.sheetName,
                  a1Notation: rangeNotation,
                  rows: meta.rows || 0,
                  cols: meta.cols || 0,
                  headers: currentHeaders.slice()
                }, { force: true });
              }
            }
          }).getTableMeta(val);
          google.script.run.withSuccessHandler(function(res) {
            if (res && res.headers) {
              currentHeaders = res.headers;
              renderHeaders();
            }
          }).getTableHeaders(val);
          editingId = val;
        }
      });

      document.getElementById('editTableBtn').addEventListener('click', function() {
        const select = document.getElementById('editSavedTables');
        const val = select.value;
        if (val) {
          editingId = val;
          showMessageModal('Tabla lista para actualizar. Ajuste los datos en "Crear tabla" y aplique el formato.', {
            title: 'Edición habilitada',
            variant: 'info'
          });
          showTab('createTab');
        } else {
          showMessageModal('Seleccione una tabla para editar.', {
            title: 'Seleccione una tabla',
            variant: 'error'
          });
        }
      });

      document.getElementById('clearTableBtn').addEventListener('click', async function() {
        const select = document.getElementById('editSavedTables');
        const val = select.value;
        if (!val) {
          showMessageModal('Seleccione una tabla para limpiar.', {
            title: 'Seleccione una tabla',
            variant: 'error'
          });
          return;
        }
        const confirmed = await showConfirmModal('¿Seguro que desea limpiar el rango y formato de la tabla seleccionada?', {
          title: 'Confirmar limpieza',
          variant: 'warning',
          confirmText: 'Sí, limpiar',
          cancelText: 'Cancelar'
        });
        if (!confirmed) {
          return;
        }
        google.script.run.withSuccessHandler(function(res) {
          if (res && res.error) {
            showMessageModal(res.error, {
              title: 'No se pudo limpiar',
              variant: 'error'
            });
          } else {
            showMessageModal('Rango limpiado.', {
              title: 'Limpieza completada',
              variant: 'success'
            });
          }
          refreshSavedTables(['editSavedTables', 'aiSavedTables']);
        }).clearTable(val);
      });

      document.getElementById('askBtn').addEventListener('click', function() {
        const select = document.getElementById('aiSavedTables');
        const val = select.value;
        const question = document.getElementById('questionInput').value.trim();
        if (!val) {
          showMessageModal('Seleccione una tabla para realizar la consulta.', {
            title: 'Seleccione una tabla',
            variant: 'error'
          });
          return;
        }
        if (!question) {
          showMessageModal('Escriba una pregunta.', {
            title: 'Pregunta requerida',
            variant: 'error'
          });
          return;
        }
        const pre = document.getElementById('answerBox');
        pre.style.display = 'none';
        pre.textContent = '';
        google.script.run.withSuccessHandler(function(res) {
          if (res && res.error) {
            showMessageModal(res.error, {
              title: 'Consulta no disponible',
              variant: 'error'
            });
          } else {
            pre.textContent = res.answer || '';
            pre.style.display = 'block';
          }
        }).askQuestion(val, question);
      });

      document.addEventListener('DOMContentLoaded', function() {
        setDefaultStyles();
        const rangeInput = document.getElementById('rangeInput');
        if (rangeInput) {
          rangeInput.dataset.manual = 'false';
          rangeInput.addEventListener('input', function() {
            this.dataset.manual = this.value.trim() ? 'true' : 'false';
            if (this.dataset.manual === 'true') {
              rangeInfo = null;
            }
          });
        }
        showTab('createTab');
      });
    </script>
  </body>
</html>
