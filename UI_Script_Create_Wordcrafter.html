<script>
/* -------------------------------------------------------------------------- */
/*  WordCrafter Create Tab UI                                                 */
/* -------------------------------------------------------------------------- */
const WORD_TITLE_AUTO_PLACEHOLDER = 'Título generado automáticamente';
const WORD_WEB_SOURCE_LIMIT = 10;
const WORD_SECTION_WEB_LIMIT = 3;

const WORD_CONTEXT_SECTION_CONFIG = [
      {
        toggleId: null,
        wrapperId: 'wordContextDetailsWrapper',
        fieldsId: 'wordContextDetailsFields',
        controlIds: ['wordBodyContext']
      },
      {
        wrapperId: 'wordLanguageSection',
        fieldsId: 'wordLanguageFields',
        controlIds: ['wordBodyLanguage']
      },
      {
        wrapperId: 'wordToneSection',
        fieldsId: 'wordToneFields',
        controlIds: ['wordBodyTone']
      },
      {
        wrapperId: 'wordProfileSection',
        fieldsId: 'wordProfileFields',
        controlIds: ['wordBodyProfile']
      }
    ];

const WORD_STRUCTURE_SECTION_CONFIG = [
      {
        toggleId: 'wordIntroToggle',
        wrapperId: 'wordIntroSection',
        fieldsId: 'wordIntroFields',
        controlIds: ['wordIntroFocus'],
        webConfig: {
          toggleId: 'wordIntroWebToggle',
          bodyId: 'wordIntroWebBody',
          listId: 'wordIntroWebList',
          addId: 'wordIntroWebAdd',
          stateKey: 'intro'
        }
      },
      {
        toggleId: 'wordConclusionToggle',
        wrapperId: 'wordConclusionSection',
        fieldsId: 'wordConclusionFields',
        controlIds: ['wordConclusionFocus'],
        webConfig: {
          toggleId: 'wordConclusionWebToggle',
          bodyId: 'wordConclusionWebBody',
          listId: 'wordConclusionWebList',
          addId: 'wordConclusionWebAdd',
          stateKey: 'conclusion'
        }
      }
    ];

let wordWebSourcesState = [];
let wordWebSourcesCollapsed = false;
let wordStructureSectionLinksState = { intro: [], conclusion: [] };

function isWordThemeActiveForCreate() {
        return document.body && document.body.classList.contains('theme-wordcrafter');
      }

function isWordRangeSelectionEnabled() {
        if (!isWordThemeActiveForCreate()) {
          return true;
        }
        const toggle = document.getElementById('wordUseRangeToggle');
        return !toggle || toggle.checked;
      }

function resetWordFormatInputs(containerId) {
        const container = document.getElementById(containerId);
        if (!container) {
          return;
        }
        const inputs = container.querySelectorAll('input, select, textarea');
        inputs.forEach(function(control) {
          if (control.type === 'checkbox') {
            control.checked = control.defaultChecked;
            return;
          }
          const fallback = control.dataset && control.dataset.defaultValue !== undefined ? control.dataset.defaultValue : control.defaultValue;
          if (fallback !== undefined) {
            control.value = fallback;
          } else {
            control.value = '';
          }
        });
      }

function resetWordTextOptions() {
        const autoToggle = document.getElementById('wordAutoTitleToggle');
        const manualTitleToggle = document.getElementById('wordManualTitleFormatToggle');
        const manualBodyToggle = document.getElementById('wordManualBodyFormatToggle');
        const titleInput = document.getElementById('tableName');
        wordStructureSectionLinksState = { intro: [], conclusion: [] };
        if (autoToggle) {
          autoToggle.checked = false;
        }
        if (manualTitleToggle) {
          manualTitleToggle.checked = false;
        }
        if (manualBodyToggle) {
          manualBodyToggle.checked = false;
        }
        if (titleInput) {
          if (titleInput.dataset && titleInput.dataset.autoFilled === 'true') {
            titleInput.value = titleInput.dataset.prevManualValue || '';
            delete titleInput.dataset.autoFilled;
            delete titleInput.dataset.prevManualValue;
          }
          titleInput.disabled = false;
          titleInput.removeAttribute('aria-disabled');
        }
        resetWordFormatInputs('wordTitleFormatOptions');
        resetWordFormatInputs('wordBodyFormatOptions');
        const extraFields = [
          'wordBodyContext',
          'wordBodyLanguage',
          'wordBodyProfile'
        ];
        extraFields.forEach(function(fieldId) {
          const el = document.getElementById(fieldId);
          if (el) {
            const fallback = el.dataset && el.dataset.defaultValue !== undefined ? el.dataset.defaultValue : el.defaultValue;
            if (fallback !== undefined) {
              el.value = fallback;
            } else {
              el.value = '';
            }
          }
        });
        const toneSelect = document.getElementById('wordBodyTone');
        if (toneSelect) {
          const fallback = toneSelect.dataset && toneSelect.dataset.defaultValue !== undefined ? toneSelect.dataset.defaultValue : toneSelect.defaultValue;
          toneSelect.value = fallback !== undefined ? fallback : '';
        }
        WORD_CONTEXT_SECTION_CONFIG.forEach(function(section) {
          const toggle = section.toggleId ? document.getElementById(section.toggleId) : null;
          if (toggle) {
            toggle.checked = toggle.defaultChecked;
          }
          syncWordContextSection(section);
        });
        WORD_STRUCTURE_SECTION_CONFIG.forEach(function(section) {
          const toggle = section.toggleId ? document.getElementById(section.toggleId) : null;
          if (toggle) {
            toggle.checked = toggle.defaultChecked;
          }
          syncWordContextSection(section);
          if (section.webConfig) {
            const webToggleControl = document.getElementById(section.webConfig.toggleId);
            if (webToggleControl) {
              webToggleControl.checked = webToggleControl.defaultChecked;
            }
            setWordSectionLinksState(section.webConfig.stateKey, []);
            renderWordSectionLinksList(section);
          }
        });
        const webToggle = document.getElementById('wordWebSourcesToggle');
        if (webToggle) {
          webToggle.checked = webToggle.defaultChecked;
        }
        wordWebSourcesState = [];
        wordWebSourcesCollapsed = false;
        renderWordWebSourcesList();
        refreshWordPreviews();
        syncWordWebSourcesCard();
        syncWordStructureCard();
      }

function updateWordFormatFlagClasses(container) {
        if (!container) {
          return;
        }
        const flagLabels = container.querySelectorAll('.word-format-flag');
        flagLabels.forEach(function(label) {
          const control = label.querySelector('input');
          label.classList.toggle('is-active', Boolean(control && control.checked));
        });
      }

function updateWordPreview(kind) {
        const previewId = kind === 'body' ? 'wordBodyPreview' : 'wordTitlePreview';
        const preview = document.getElementById(previewId);
        if (!preview) {
          return;
        }
        const prefix = kind === 'body' ? 'wordBody' : 'wordTitle';
        const colorInput = document.getElementById(prefix + 'Color');
        const sizeInput = document.getElementById(prefix + 'FontSize');
        const alignSelect = document.getElementById(prefix + 'Alignment');
        const fontFamilySelect = document.getElementById(prefix + 'FontFamily');
        const boldToggle = document.getElementById(prefix + 'Bold');
        const underlineToggle = document.getElementById(prefix + 'Underline');
        const italicsToggle = document.getElementById(prefix + 'Italics');
        const uppercaseToggle = kind === 'title' ? document.getElementById('wordTitleUppercase') : null;
        const highlightToggle = kind === 'body' ? document.getElementById('wordBodyHighlight') : null;
        const lineSpacingSelect = kind === 'body' ? document.getElementById('wordBodyLineSpacing') : null;
        const formatContainer = document.getElementById(prefix + 'FormatOptions');

        preview.dataset.baseText = 'Ejemplo';
        const baseText = preview.dataset.baseText;
        let displayText = baseText;
        if (kind === 'title' && uppercaseToggle && uppercaseToggle.checked) {
          displayText = baseText.toUpperCase();
        }
        preview.textContent = displayText;

        if (colorInput) {
          preview.style.color = colorInput.value || '';
        }
        preview.style.fontSize = '';
        if (alignSelect) {
          preview.style.textAlign = alignSelect.value || '';
        }
        if (fontFamilySelect && fontFamilySelect.value) {
          preview.style.fontFamily = fontFamilySelect.value;
        }
        if (boldToggle) {
          preview.style.fontWeight = boldToggle.checked ? '700' : (kind === 'title' ? '600' : '500');
        }
        const decorations = [];
        if (underlineToggle && underlineToggle.checked) {
          decorations.push('underline');
        }
        if (italicsToggle) {
          preview.style.fontStyle = italicsToggle.checked ? 'italic' : 'normal';
        }
        if (uppercaseToggle) {
          preview.style.textTransform = uppercaseToggle.checked ? 'uppercase' : 'none';
        }
        preview.classList.toggle('word-preview-highlighted', Boolean(kind === 'body' && highlightToggle && highlightToggle.checked));
        if (lineSpacingSelect && lineSpacingSelect.value) {
          preview.style.lineHeight = lineSpacingSelect.value;
        }
        preview.style.textDecoration = decorations.join(' ');
        updateWordFormatFlagClasses(formatContainer);
      }

function refreshWordPreviews() {
        updateWordPreview('title');
        updateWordPreview('body');
      }

function syncWordTitleControls() {
        const isWordTheme = isWordThemeActiveForCreate();
        const container = document.getElementById('wordTitleOptions');
        const autoToggle = document.getElementById('wordAutoTitleToggle');
        const manualToggle = document.getElementById('wordManualTitleFormatToggle');
        const formatOptions = document.getElementById('wordTitleFormatOptions');
        const titleInput = document.getElementById('tableName');
        if (container) {
          container.style.display = isWordTheme ? 'block' : 'none';
        }
        if (!isWordTheme) {
          if (autoToggle) {
            autoToggle.checked = false;
          }
          if (manualToggle) {
            manualToggle.checked = false;
          }
        }
        const autoActive = Boolean(isWordTheme && autoToggle && autoToggle.checked);
        if (titleInput) {
          if (autoActive) {
            if (titleInput.dataset.autoFilled !== 'true') {
              titleInput.dataset.prevManualValue = titleInput.value;
              if (!titleInput.value) {
                titleInput.value = WORD_TITLE_AUTO_PLACEHOLDER;
              }
              titleInput.dataset.autoFilled = 'true';
            }
            titleInput.disabled = true;
            titleInput.setAttribute('aria-disabled', 'true');
          } else {
            if (titleInput.dataset && titleInput.dataset.autoFilled === 'true') {
              titleInput.value = titleInput.dataset.prevManualValue || '';
              delete titleInput.dataset.autoFilled;
              delete titleInput.dataset.prevManualValue;
            }
            titleInput.disabled = false;
            titleInput.removeAttribute('aria-disabled');
          }
        }
        if (manualToggle) {
          const shouldDisable = !isWordTheme;
          manualToggle.disabled = shouldDisable;
          if (shouldDisable) {
            manualToggle.setAttribute('aria-disabled', 'true');
          } else {
            manualToggle.removeAttribute('aria-disabled');
          }
        }
        const manualActive = Boolean(isWordTheme && manualToggle && manualToggle.checked);
        if (formatOptions) {
          formatOptions.style.display = manualActive ? 'block' : 'none';
        }
        updateWordPreview('title');
      }

function syncWordBodyControls() {
        const isWordTheme = isWordThemeActiveForCreate();
        const container = document.getElementById('wordBodyOptions');
        const manualToggle = document.getElementById('wordManualBodyFormatToggle');
        const formatOptions = document.getElementById('wordBodyFormatOptions');
        if (container) {
          container.style.display = isWordTheme ? 'block' : 'none';
        }
        if (!isWordTheme && manualToggle) {
          manualToggle.checked = false;
        }
        const manualActive = Boolean(isWordTheme && manualToggle && manualToggle.checked);
        if (manualToggle) {
          manualToggle.disabled = !isWordTheme;
          if (manualToggle.disabled) {
            manualToggle.setAttribute('aria-disabled', 'true');
          } else {
            manualToggle.removeAttribute('aria-disabled');
          }
        }
        if (formatOptions) {
          formatOptions.style.display = manualActive ? 'block' : 'none';
        }
        updateWordPreview('body');
      }

function syncWordContextCard() {
        const contextCard = document.getElementById('wordContextCard');
        const personalizationCard = document.getElementById('wordPersonalizationCard');
        const isWordTheme = isWordThemeActiveForCreate();
        if (contextCard) {
          contextCard.style.display = isWordTheme ? 'block' : 'none';
        }
        if (personalizationCard) {
          personalizationCard.style.display = isWordTheme ? 'block' : 'none';
        }
        if (isWordTheme) {
          syncWordContextSections();
        }
      }

function syncWordContextSection(section) {
        if (!section) {
          return;
        }
        const toggle = document.getElementById(section.toggleId);
        const wrapper = document.getElementById(section.wrapperId);
        const fields = document.getElementById(section.fieldsId);
        const isActive = Boolean(!toggle || toggle.checked);
        if (wrapper) {
          wrapper.classList.toggle('is-disabled', !isActive);
        }
        if (fields) {
          fields.classList.toggle('is-hidden', !isActive);
          fields.setAttribute('aria-hidden', String(!isActive));
        }
        if (Array.isArray(section.controlIds)) {
          section.controlIds.forEach(function(controlId) {
            const control = document.getElementById(controlId);
            if (!control) {
              return;
            }
            control.disabled = !isActive;
            if (!isActive) {
              control.setAttribute('aria-disabled', 'true');
            } else {
              control.removeAttribute('aria-disabled');
            }
          });
        }
      }

function syncWordContextSections() {
        WORD_CONTEXT_SECTION_CONFIG.forEach(function(section) {
          syncWordContextSection(section);
        });
      }

function bindWordContextToggles() {
        WORD_CONTEXT_SECTION_CONFIG.forEach(function(section) {
          const toggle = document.getElementById(section.toggleId);
          if (toggle && toggle.dataset.wordContextBound !== 'true') {
            toggle.addEventListener('change', function() {
              syncWordContextSection(section);
            });
            toggle.dataset.wordContextBound = 'true';
          }
        });
      }

function syncWordStructureSections() {
        WORD_STRUCTURE_SECTION_CONFIG.forEach(function(section) {
          syncWordContextSection(section);
          syncWordSectionWebControls(section);
        });
      }

function bindWordStructureSectionToggles() {
        WORD_STRUCTURE_SECTION_CONFIG.forEach(function(section) {
          const toggle = document.getElementById(section.toggleId);
          if (toggle && toggle.dataset.wordStructureBound !== 'true') {
            toggle.addEventListener('change', function() {
              syncWordContextSection(section);
              syncWordSectionWebControls(section);
            });
            toggle.dataset.wordStructureBound = 'true';
          }
        });
      }

function ensureWordSectionLinksState(sectionKey) {
        if (!sectionKey) {
          return [];
        }
        if (!wordStructureSectionLinksState || typeof wordStructureSectionLinksState !== 'object') {
          wordStructureSectionLinksState = {};
        }
        if (!Array.isArray(wordStructureSectionLinksState[sectionKey])) {
          wordStructureSectionLinksState[sectionKey] = [];
        }
        return wordStructureSectionLinksState[sectionKey];
      }

function setWordSectionLinksState(sectionKey, newState) {
        if (!sectionKey) {
          return;
        }
        if (!wordStructureSectionLinksState || typeof wordStructureSectionLinksState !== 'object') {
          wordStructureSectionLinksState = {};
        }
        wordStructureSectionLinksState[sectionKey] = Array.isArray(newState) ? newState : [];
      }

function renderWordSectionLinksList(section) {
        if (!section || !section.webConfig) {
          return;
        }
        const config = section.webConfig;
        const list = document.getElementById(config.listId);
        if (!list) {
          return;
        }
        const stateKey = config.stateKey;
        const currentState = ensureWordSectionLinksState(stateKey);
        if (currentState.length > WORD_SECTION_WEB_LIMIT) {
          setWordSectionLinksState(stateKey, currentState.slice(0, WORD_SECTION_WEB_LIMIT));
        }
        list.innerHTML = '';
        ensureWordSectionLinksState(stateKey).forEach(function(entry, index) {
          const normalized = entry && typeof entry === 'object' ? entry : {};
          const row = document.createElement('div');
          row.className = 'word-web-row';
          row.dataset.wordSection = stateKey;
          row.dataset.wordIndex = String(index);

          const removeBtn = document.createElement('button');
          removeBtn.type = 'button';
          removeBtn.className = 'word-web-remove';
          removeBtn.dataset.wordSection = stateKey;
          removeBtn.dataset.wordWebRemove = String(index);
          removeBtn.setAttribute('aria-label', 'Eliminar referencia ' + (index + 1));
          removeBtn.title = 'Eliminar';
          removeBtn.textContent = '×';
          row.appendChild(removeBtn);

          const urlInput = document.createElement('input');
          urlInput.type = 'url';
          urlInput.className = 'word-web-input';
          urlInput.placeholder = 'https://ejemplo.com';
          urlInput.value = normalized.url ? normalized.url : '';
          urlInput.dataset.wordSection = stateKey;
          urlInput.dataset.wordWebIndex = String(index);
          urlInput.dataset.wordWebField = 'url';
          urlInput.autocomplete = 'off';
          urlInput.spellcheck = false;
          row.appendChild(urlInput);

          const descInput = document.createElement('input');
          descInput.type = 'text';
          descInput.className = 'word-web-input';
          descInput.placeholder = 'Descripción breve de la referencia';
          descInput.value = normalized.description ? normalized.description : '';
          descInput.dataset.wordSection = stateKey;
          descInput.dataset.wordWebIndex = String(index);
          descInput.dataset.wordWebField = 'description';
          descInput.autocomplete = 'off';
          row.appendChild(descInput);

          list.appendChild(row);
        });
      }

function syncWordSectionWebControls(section) {
        if (!section || !section.webConfig) {
          return;
        }
        const config = section.webConfig;
        const mainToggle = section.toggleId ? document.getElementById(section.toggleId) : null;
        const sectionActive = Boolean(!section.toggleId || (mainToggle && mainToggle.checked));
        const webToggle = document.getElementById(config.toggleId);
        const body = document.getElementById(config.bodyId);
        const list = document.getElementById(config.listId);
        const addBtn = document.getElementById(config.addId);

        if (webToggle) {
          webToggle.disabled = !sectionActive;
          if (!sectionActive) {
            webToggle.checked = false;
          }
          if (webToggle.disabled) {
            webToggle.setAttribute('aria-disabled', 'true');
          } else {
            webToggle.removeAttribute('aria-disabled');
          }
        }

        if (!sectionActive) {
          if (body) {
            body.classList.add('is-hidden');
            body.setAttribute('aria-hidden', 'true');
          }
          if (list) {
            const inputs = list.querySelectorAll('.word-web-input');
            inputs.forEach(function(input) {
              input.disabled = true;
              input.setAttribute('aria-disabled', 'true');
            });
            const removeButtons = list.querySelectorAll('.word-web-remove');
            removeButtons.forEach(function(button) {
              button.disabled = true;
              button.setAttribute('aria-disabled', 'true');
            });
          }
          if (addBtn) {
            addBtn.disabled = true;
          }
          return;
        }

        const isWebActive = Boolean(webToggle && webToggle.checked);
        if (isWebActive) {
          const state = ensureWordSectionLinksState(config.stateKey);
          if (state.length === 0) {
            state.push({ url: '', description: '' });
            setWordSectionLinksState(config.stateKey, state);
          }
        }
        renderWordSectionLinksList(section);

        if (body) {
          body.classList.toggle('is-hidden', !isWebActive);
          body.setAttribute('aria-hidden', String(!isWebActive));
        }
        if (list) {
          const inputs = list.querySelectorAll('.word-web-input');
          inputs.forEach(function(input) {
            input.disabled = !isWebActive;
            if (!isWebActive) {
              input.setAttribute('aria-disabled', 'true');
            } else {
              input.removeAttribute('aria-disabled');
            }
          });
          const removeButtons = list.querySelectorAll('.word-web-remove');
          removeButtons.forEach(function(button) {
            button.disabled = !isWebActive;
            if (!isWebActive) {
              button.setAttribute('aria-disabled', 'true');
            } else {
              button.removeAttribute('aria-disabled');
            }
          });
        }
        if (addBtn) {
          const state = ensureWordSectionLinksState(config.stateKey);
          addBtn.disabled = !isWebActive || state.length >= WORD_SECTION_WEB_LIMIT;
        }
      }

function bindWordSectionWebControls() {
        WORD_STRUCTURE_SECTION_CONFIG.forEach(function(section) {
          if (!section.webConfig) {
            return;
          }
          const config = section.webConfig;
          const toggle = document.getElementById(config.toggleId);
          if (toggle && toggle.dataset.wordSectionWebBound !== 'true') {
            toggle.addEventListener('change', function() {
              syncWordSectionWebControls(section);
            });
            toggle.dataset.wordSectionWebBound = 'true';
          }
          const addBtn = document.getElementById(config.addId);
          if (addBtn && addBtn.dataset.wordSectionWebBound !== 'true') {
            addBtn.addEventListener('click', function() {
              const current = ensureWordSectionLinksState(config.stateKey);
              if (current.length >= WORD_SECTION_WEB_LIMIT) {
                return;
              }
              current.push({ url: '', description: '' });
              setWordSectionLinksState(config.stateKey, current);
              renderWordSectionLinksList(section);
              syncWordSectionWebControls(section);
            });
            addBtn.dataset.wordSectionWebBound = 'true';
          }
          const list = document.getElementById(config.listId);
          if (list && list.dataset.wordSectionWebBound !== 'true') {
            list.addEventListener('click', function(event) {
              const target = event.target;
              if (!target) {
                return;
              }
              let removeButton = null;
              if (typeof target.closest === 'function') {
                removeButton = target.closest('.word-web-remove');
              } else if (target.parentElement && target.parentElement.classList && target.parentElement.classList.contains('word-web-remove')) {
                removeButton = target.parentElement;
              }
              if (removeButton) {
                const sectionKey = removeButton.dataset.wordSection;
                const index = Number(removeButton.dataset.wordWebRemove);
                if (!Number.isNaN(index)) {
                  const state = ensureWordSectionLinksState(sectionKey);
                  state.splice(index, 1);
                  setWordSectionLinksState(sectionKey, state);
                  renderWordSectionLinksList(section);
                  syncWordSectionWebControls(section);
                }
              }
            });
            list.addEventListener('input', function(event) {
              const target = event.target;
              if (!target || !target.classList || !target.classList.contains('word-web-input')) {
                return;
              }
              const sectionKey = target.dataset.wordSection;
              const index = Number(target.dataset.wordWebIndex);
              const field = target.dataset.wordWebField;
              if (!sectionKey || Number.isNaN(index) || !field) {
                return;
              }
              const state = ensureWordSectionLinksState(sectionKey);
              if (!state[index]) {
                state[index] = { url: '', description: '' };
              }
              if (field === 'url') {
                state[index].url = target.value;
              } else if (field === 'description') {
                state[index].description = target.value;
              }
            });
            list.dataset.wordSectionWebBound = 'true';
          }
        });
      }

function syncWordStructureCard() {
        const card = document.getElementById('wordStructureCard');
        if (!card) {
          return;
        }
        const isWordTheme = isWordThemeActiveForCreate();
        card.style.display = isWordTheme ? 'block' : 'none';
        if (!isWordTheme) {
          wordWebSourcesCollapsed = false;
          return;
        }
        syncWordStructureSections();
      }

function bindWordStructureControls() {
        bindWordStructureSectionToggles();
        bindWordSectionWebControls();
      }

function renderWordWebSourcesList() {
        const list = document.getElementById('wordWebSourcesList');
        if (!list) {
          return;
        }
        if (wordWebSourcesState.length > WORD_WEB_SOURCE_LIMIT) {
          wordWebSourcesState = wordWebSourcesState.slice(0, WORD_WEB_SOURCE_LIMIT);
        }
        list.innerHTML = '';
        wordWebSourcesState.forEach(function(value, index) {
          const row = document.createElement('div');
          row.className = 'word-web-row';
          row.dataset.wordWebIndex = String(index);
          const removeBtn = document.createElement('button');
          removeBtn.type = 'button';
          removeBtn.className = 'word-web-remove';
          removeBtn.textContent = '×';
          removeBtn.dataset.wordWebRemove = String(index);
          removeBtn.setAttribute('aria-label', 'Eliminar página web ' + (index + 1));
          removeBtn.title = 'Eliminar';
          const input = document.createElement('input');
          input.type = 'url';
          input.className = 'word-web-input';
          input.placeholder = 'https://ejemplo.com/recurso';
          input.value = value || '';
          input.dataset.wordWebIndex = String(index);
          input.setAttribute('aria-label', 'Página web ' + (index + 1));
          input.autocomplete = 'off';
          input.spellcheck = false;
          row.appendChild(removeBtn);
          row.appendChild(input);
          list.appendChild(row);
        });
      }

function bindWordWebSourcesControls() {
        const toggle = document.getElementById('wordWebSourcesToggle');
        if (toggle && toggle.dataset.wordWebBound !== 'true') {
          toggle.addEventListener('change', function() {
            if (toggle.checked && wordWebSourcesState.length === 0) {
              wordWebSourcesState.push('');
              renderWordWebSourcesList();
            }
            wordWebSourcesCollapsed = false;
            syncWordWebSourcesCard();
          });
          toggle.dataset.wordWebBound = 'true';
        }
        const collapseBtn = document.getElementById('wordWebSourcesCollapse');
        if (collapseBtn && collapseBtn.dataset.wordWebBound !== 'true') {
          collapseBtn.addEventListener('click', function() {
            if (collapseBtn.disabled) {
              return;
            }
            wordWebSourcesCollapsed = !wordWebSourcesCollapsed;
            syncWordWebSourcesCard();
          });
          collapseBtn.dataset.wordWebBound = 'true';
        }
        const addBtn = document.getElementById('wordWebSourcesAdd');
        if (addBtn && addBtn.dataset.wordWebBound !== 'true') {
          addBtn.addEventListener('click', function() {
            if (wordWebSourcesState.length >= WORD_WEB_SOURCE_LIMIT) {
              return;
            }
            wordWebSourcesState.push('');
            renderWordWebSourcesList();
            syncWordWebSourcesCard();
            const list = document.getElementById('wordWebSourcesList');
            if (list) {
              const inputs = list.querySelectorAll('.word-web-input');
              const newest = inputs[inputs.length - 1];
              if (newest) {
                newest.focus();
              }
            }
          });
          addBtn.dataset.wordWebBound = 'true';
        }
        const list = document.getElementById('wordWebSourcesList');
        if (list && list.dataset.wordWebBound !== 'true') {
          list.addEventListener('input', function(event) {
            const target = event.target;
            if (!target || !target.classList || !target.classList.contains('word-web-input')) {
              return;
            }
            const index = parseInt(target.dataset.wordWebIndex || '-1', 10);
            if (isNaN(index) || index < 0 || index >= wordWebSourcesState.length) {
              return;
            }
            wordWebSourcesState[index] = target.value.trim();
          });
          list.addEventListener('click', function(event) {
            const button = event.target && event.target.closest('[data-word-web-remove]');
            if (!button) {
              return;
            }
            const index = parseInt(button.dataset.wordWebRemove || '-1', 10);
            if (isNaN(index) || index < 0 || index >= wordWebSourcesState.length) {
              return;
            }
            wordWebSourcesState.splice(index, 1);
            renderWordWebSourcesList();
            syncWordWebSourcesCard();
          });
          list.dataset.wordWebBound = 'true';
        }
      }

function syncWordWebSourcesCard() {
        const card = document.getElementById('wordWebSourcesCard');
        if (!card) {
          return;
        }
        const isWordTheme = isWordThemeActiveForCreate();
        card.style.display = isWordTheme ? 'block' : 'none';
        if (!isWordTheme) {
          wordWebSourcesCollapsed = false;
          return;
        }
        const toggle = document.getElementById('wordWebSourcesToggle');
        const body = document.getElementById('wordWebSourcesBody');
        const list = document.getElementById('wordWebSourcesList');
        const addBtn = document.getElementById('wordWebSourcesAdd');
        const collapseBtn = document.getElementById('wordWebSourcesCollapse');
        const isActive = Boolean(toggle && toggle.checked);
        if (isActive && wordWebSourcesState.length === 0) {
          wordWebSourcesState.push('');
          renderWordWebSourcesList();
        }
        if (!isActive) {
          wordWebSourcesCollapsed = false;
        }
        const shouldShowBody = Boolean(isActive && !wordWebSourcesCollapsed);
        if (body) {
          body.classList.toggle('is-hidden', !shouldShowBody);
          body.setAttribute('aria-hidden', String(!shouldShowBody));
        }
        if (list) {
          const inputs = list.querySelectorAll('.word-web-input');
          inputs.forEach(function(input) {
            input.disabled = !isActive;
            if (!isActive) {
              input.setAttribute('aria-disabled', 'true');
            } else {
              input.removeAttribute('aria-disabled');
            }
          });
          const removeButtons = list.querySelectorAll('.word-web-remove');
          removeButtons.forEach(function(button) {
            button.disabled = !isActive;
            if (!isActive) {
              button.setAttribute('aria-disabled', 'true');
            } else {
              button.removeAttribute('aria-disabled');
            }
          });
        }
        if (addBtn) {
          addBtn.disabled = !isActive || wordWebSourcesState.length >= WORD_WEB_SOURCE_LIMIT;
        }
        if (collapseBtn) {
          collapseBtn.disabled = !isActive;
          collapseBtn.classList.toggle('is-collapsed', !shouldShowBody);
          collapseBtn.setAttribute('aria-expanded', String(shouldShowBody));
        }
      }

function syncWordCreateOptions() {
        syncWordTitleControls();
        syncWordBodyControls();
        syncWordStructureCard();
        syncWordContextCard();
        syncWordWebSourcesCard();
      }

function bindWordTextToggles() {
        const autoToggle = document.getElementById('wordAutoTitleToggle');
        if (autoToggle && autoToggle.dataset.toggleBound !== 'true') {
          autoToggle.addEventListener('change', function() {
            syncWordTitleControls();
            updateWordPreview('title');
          });
          autoToggle.dataset.toggleBound = 'true';
        }
        const manualTitleToggle = document.getElementById('wordManualTitleFormatToggle');
        if (manualTitleToggle && manualTitleToggle.dataset.toggleBound !== 'true') {
          manualTitleToggle.addEventListener('change', function() {
            syncWordTitleControls();
            updateWordPreview('title');
          });
          manualTitleToggle.dataset.toggleBound = 'true';
        }
        const manualBodyToggle = document.getElementById('wordManualBodyFormatToggle');
        if (manualBodyToggle && manualBodyToggle.dataset.toggleBound !== 'true') {
          manualBodyToggle.addEventListener('change', function() {
            syncWordBodyControls();
            updateWordPreview('body');
          });
          manualBodyToggle.dataset.toggleBound = 'true';
        }
        bindWordContextToggles();
      }

function bindWordFormatInputs() {
        function attach(control, kind) {
          if (!control || control.dataset.wordFormatBound === 'true') {
            return;
          }
          const handler = function() {
            updateWordPreview(kind);
          };
          const tag = control.tagName ? control.tagName.toLowerCase() : '';
          const type = control.type ? control.type.toLowerCase() : '';
          const primaryEvent = type === 'color' || type === 'number' ? 'input' : (tag === 'select' ? 'change' : 'change');
          control.addEventListener(primaryEvent, handler);
          if (primaryEvent !== 'change') {
            control.addEventListener('change', handler);
          }
          control.dataset.wordFormatBound = 'true';
        }
        const titleContainer = document.getElementById('wordTitleFormatOptions');
        if (titleContainer) {
          const titleControls = titleContainer.querySelectorAll('input, select');
          titleControls.forEach(function(control) {
            attach(control, 'title');
          });
        }
        const bodyContainer = document.getElementById('wordBodyFormatOptions');
        if (bodyContainer) {
          const bodyControls = bodyContainer.querySelectorAll('input, select');
          bodyControls.forEach(function(control) {
            attach(control, 'body');
          });
        }
      }

function bindWordRangeToggle() {
        const rangeToggle = document.getElementById('wordUseRangeToggle');
        if (rangeToggle && rangeToggle.dataset.toggleBound !== 'true') {
          rangeToggle.addEventListener('change', function() {
            syncCreateRangeModeUI();
            syncWordCreateOptions();
          });
          rangeToggle.dataset.toggleBound = 'true';
        }
      }

function initializeWordRangeMode() {
        bindWordRangeToggle();
        bindWordTextToggles();
        bindWordFormatInputs();
        bindWordStructureControls();
        bindWordWebSourcesControls();
        renderWordWebSourcesList();
        renderWordStructureLinksList();
        syncCreateRangeModeUI();
        syncWordCreateOptions();
        refreshWordPreviews();
      }

if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initializeWordRangeMode);
      } else {
        initializeWordRangeMode();
      }

function notifyCreateThemeChanged() {
        bindWordRangeToggle();
        bindWordTextToggles();
        bindWordFormatInputs();
        bindWordStructureControls();
        bindWordWebSourcesControls();
        renderWordWebSourcesList();
        renderWordStructureLinksList();
        syncCreateRangeModeUI();
        syncWordCreateOptions();
        refreshWordPreviews();
      }

window.notifyCreateThemeChanged = notifyCreateThemeChanged;

const WordCrafterCreateTab = Object.freeze({
        isThemeActive: isWordThemeActiveForCreate,
        isRangeSelectionEnabled: isWordRangeSelectionEnabled,
        resetTextOptions: resetWordTextOptions,
        syncOptions: syncWordCreateOptions,
        refreshPreviews: refreshWordPreviews,
        bindRangeToggle: bindWordRangeToggle,
        bindTextToggles: bindWordTextToggles,
        bindFormatInputs: bindWordFormatInputs,
        bindContextToggles: bindWordContextToggles,
        bindStructureControls: bindWordStructureControls,
        bindWebSources: bindWordWebSourcesControls,
        notifyThemeChanged: notifyCreateThemeChanged
      });

window.WordCrafterCreateTab = WordCrafterCreateTab;
</script>
