<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta charset="UTF-8">
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 16px;
        background-color: #F9FAFB;
        color: #111827;
      }
      h2 {
        margin-top: 0;
        font-size: 20px;
        color: #2563EB;
      }
      label {
        display: block;
        margin-top: 12px;
        margin-bottom: 4px;
        font-weight: 600;
      }
      input[type="text"],
      input[type="password"] {
        width: 100%;
        padding: 8px;
        border: 1px solid #E5E7EB;
        border-radius: 4px;
        background-color: #FFFFFF;
        color: #111827;
        box-sizing: border-box;
        min-height: 36px;
      }
      .btn-secondary {
        background-color: #E5E7EB;
        color: #111827;
      }
      .btn-secondary:hover {
        background-color: #D1D5DB;
      }
      .input-with-action {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .input-with-action input[type="password"],
      .input-with-action input[type="text"] {
        flex: 1;
      }
      .icon-btn {
        margin-top: 0;
        background-color: #E5E7EB;
        color: #111827;
        padding: 8px;
        border-radius: 4px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 40px;
        min-height: 36px;
      }
      .icon-btn:hover {
        background-color: #D1D5DB;
      }
      button {
        margin-top: 16px;
        padding: 10px 16px;
        border: none;
        border-radius: 4px;
        font-weight: 600;
        cursor: pointer;
        min-height: 40px;
      }
      .btn-save {
        background-color: #2563EB;
        color: #FFFFFF;
      }
      .btn-save:hover {
        background-color: #1E4DB7;
      }
      .btn-delete {
        background-color: #EF4444;
        color: #FFFFFF;
        margin-left: 8px;
      }
      .btn-delete:hover {
        background-color: #DC2626;
      }
      .preference-section {
        margin-top: 24px;
        padding-top: 16px;
        border-top: 1px solid #E5E7EB;
      }
      .toggle-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-top: 16px;
        font-weight: 600;
      }
      .toggle-control {
        position: relative;
        width: 46px;
        height: 24px;
        display: inline-block;
      }
      .toggle-control input {
        opacity: 0;
        width: 0;
        height: 0;
      }
      .toggle-indicator {
        position: absolute;
        inset: 0;
        background: #D1D5DB;
        border-radius: 999px;
        transition: background 0.2s ease;
      }
      .toggle-indicator::after {
        content: '';
        position: absolute;
        top: 3px;
        left: 3px;
        width: 18px;
        height: 18px;
        background: #FFFFFF;
        border-radius: 50%;
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.2);
        transition: transform 0.2s ease;
      }
      .toggle-control input:checked + .toggle-indicator {
        background: #2563EB;
      }
      .toggle-control input:checked + .toggle-indicator::after {
        transform: translateX(22px);
      }
      .preference-hint {
        margin-top: 8px;
        font-size: 13px;
        color: #6B7280;
      }
      .message {
        margin-top: 12px;
        font-size: 14px;
        color: #6B7280;
      }
      .tc-modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(15, 23, 42, 0.45);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 16px;
        z-index: 9999;
      }
      .tc-modal-overlay.show {
        display: flex;
      }
      .tc-modal {
        background: #FFFFFF;
        border-radius: 16px;
        padding: 24px;
        width: 100%;
        max-width: 340px;
        text-align: center;
        box-shadow: 0 18px 40px rgba(15, 23, 42, 0.25);
      }
      .tc-modal-icon {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 16px;
        font-size: 26px;
        font-weight: 700;
      }
      .tc-modal-title {
        margin: 0 0 8px;
        font-size: 18px;
        font-weight: 700;
        color: #111827;
      }
      .tc-modal-message {
        margin: 0 0 24px;
        font-size: 14px;
        color: #4B5563;
      }
      .tc-modal-actions {
        display: flex;
        justify-content: center;
        gap: 12px;
        flex-wrap: wrap;
      }
      .tc-modal-btn {
        border: none;
        border-radius: 8px;
        padding: 10px 18px;
        font-weight: 600;
        cursor: pointer;
        min-width: 120px;
        font-size: 14px;
      }
      .tc-modal-btn.primary {
        background-color: #2563EB;
        color: #FFFFFF;
      }
      .tc-modal-btn.primary:hover {
        background-color: #1E4DB7;
      }
      .tc-modal-btn.secondary {
        background-color: #E5E7EB;
        color: #111827;
      }
      .tc-modal-btn.secondary:hover {
        background-color: #D1D5DB;
      }
      .tc-modal-overlay[data-variant="info"] .tc-modal-icon {
        background: #DBEAFE;
        color: #1D4ED8;
      }
      .tc-modal-overlay[data-variant="success"] .tc-modal-icon {
        background: #DCFCE7;
        color: #15803D;
      }
      .tc-modal-overlay[data-variant="error"] .tc-modal-icon {
        background: #FEE2E2;
        color: #B91C1C;
      }
      .tc-modal-overlay[data-variant="warning"] .tc-modal-icon {
        background: #FEF3C7;
        color: #B45309;
      }
    </style>
  </head>
  <body>
    <h2>Configuración</h2>
    <p>Administre su clave de OpenAI y las preferencias generales del complemento.</p>
    <label for="apiKeyInput">API Key</label>
    <div class="input-with-action">
      <input type="password" id="apiKeyInput" placeholder="sk-..." autocomplete="off" />
      <button type="button" id="toggleApiVisibility" class="icon-btn" aria-label="Mostrar clave">🙈</button>
    </div>
    <div>
      <button id="saveKeyBtn" class="btn-save">Guardar</button>
      <button id="deleteKeyBtn" class="btn-delete">Eliminar clave</button>
    </div>
    <div class="preference-section">
      <h3>Preferencias</h3>
      <label class="toggle-row" for="welcomeToggle">
        <span>Mostrar mensaje de bienvenida de TableCrafterAI</span>
        <span class="toggle-control">
          <input type="checkbox" id="welcomeToggle" />
          <span class="toggle-indicator"></span>
        </span>
      </label>
      <p class="preference-hint">Activa esta opción para volver a ver el mensaje introductorio en la barra lateral.</p>
    </div>
    <div id="message" class="message"></div>
    <div id="tcModalOverlay" class="tc-modal-overlay" aria-hidden="true" data-variant="info">
      <div class="tc-modal" role="dialog" aria-modal="true" aria-labelledby="tcModalTitle" aria-describedby="tcModalMessage">
        <div id="tcModalIcon" class="tc-modal-icon">ℹ️</div>
        <h3 id="tcModalTitle" class="tc-modal-title">Aviso</h3>
        <p id="tcModalMessage" class="tc-modal-message"></p>
        <div class="tc-modal-actions">
          <button type="button" id="tcModalSecondary" class="tc-modal-btn secondary">Cancelar</button>
          <button type="button" id="tcModalPrimary" class="tc-modal-btn primary">Aceptar</button>
        </div>
      </div>
    </div>
    <script>
      function defaultTitleForVariant(variant) {
        switch (variant) {
          case 'error':
            return 'Ocurrió un problema';
          case 'success':
            return 'Operación completada';
          case 'warning':
            return 'Atención';
          default:
            return 'Aviso';
        }
      }

      function openModal(options) {
        const overlay = document.getElementById('tcModalOverlay');
        const icon = document.getElementById('tcModalIcon');
        const titleEl = document.getElementById('tcModalTitle');
        const messageEl = document.getElementById('tcModalMessage');
        const primaryBtn = document.getElementById('tcModalPrimary');
        const secondaryBtn = document.getElementById('tcModalSecondary');
        const variant = options.variant || 'info';
        const allowEscape = options.allowEscape !== false;

        overlay.dataset.variant = variant;
        icon.textContent = options.icon || (variant === 'error' ? '⚠️' : variant === 'success' ? '✅' : variant === 'warning' ? '⚠️' : 'ℹ️');
        titleEl.textContent = options.title || defaultTitleForVariant(variant);
        messageEl.textContent = options.message || '';

        primaryBtn.textContent = options.primaryText || 'Aceptar';
        secondaryBtn.textContent = options.secondaryText || 'Cancelar';
        secondaryBtn.style.display = options.secondaryText ? 'inline-flex' : 'none';

        const previouslyFocused = document.activeElement;

        return new Promise(function(resolve) {
          function cleanup(result) {
            overlay.classList.remove('show');
            overlay.setAttribute('aria-hidden', 'true');
            document.removeEventListener('keydown', keyListener, true);
            primaryBtn.removeEventListener('click', primaryHandler);
            secondaryBtn.removeEventListener('click', secondaryHandler);
            if (previouslyFocused && typeof previouslyFocused.focus === 'function') {
              previouslyFocused.focus();
            }
            resolve(result);
          }

          function primaryHandler() {
            cleanup('primary');
          }

          function secondaryHandler() {
            cleanup('secondary');
          }

          function keyListener(evt) {
            if (evt.key === 'Escape' && allowEscape) {
              evt.preventDefault();
              cleanup('escape');
            } else if (evt.key === 'Tab') {
              const buttons = Array.prototype.filter.call(overlay.querySelectorAll('button'), function(btn) {
                return btn.offsetParent !== null;
              });
              if (buttons.length === 0) return;
              const first = buttons[0];
              const last = buttons[buttons.length - 1];
              if (evt.shiftKey) {
                if (document.activeElement === first) {
                  evt.preventDefault();
                  last.focus();
                }
              } else if (document.activeElement === last) {
                evt.preventDefault();
                first.focus();
              }
            }
          }

          overlay.setAttribute('aria-hidden', 'false');
          overlay.classList.add('show');
          document.addEventListener('keydown', keyListener, true);
          primaryBtn.addEventListener('click', primaryHandler);
          secondaryBtn.addEventListener('click', secondaryHandler);
          requestAnimationFrame(function() {
            primaryBtn.focus();
          });
        });
      }

      function showConfirmModal(message, opts) {
        const options = Object.assign({ message: message }, opts || {});
        options.primaryText = options.confirmText || 'Aceptar';
        options.secondaryText = options.cancelText || 'Cancelar';
        options.variant = options.variant || 'warning';
        if (!options.title) {
          options.title = defaultTitleForVariant(options.variant);
        }
        options.allowEscape = options.allowEscape !== false;
        return openModal(options).then(function(result) {
          return result === 'primary';
        });
      }

      const apiInput = document.getElementById('apiKeyInput');
      const messageEl = document.getElementById('message');
      const eyeToggleBtn = document.getElementById('toggleApiVisibility');
      const saveKeyBtn = document.getElementById('saveKeyBtn');
      const deleteKeyBtn = document.getElementById('deleteKeyBtn');
      const welcomeToggle = document.getElementById('welcomeToggle');

      function setMessage(text) {
        if (!messageEl) {
          return;
        }
        messageEl.textContent = text || '';
      }

      function parseHidden(entry) {
        return entry === true || entry === 'true';
      }

      function syncWelcomeToggle(data) {
        if (!welcomeToggle) {
          return;
        }
        const info = data && typeof data === 'object' ? data : {};
        let hideTable = false;
        let hideWord = false;
        if (
          !Object.prototype.hasOwnProperty.call(info, 'hideTable') &&
          !Object.prototype.hasOwnProperty.call(info, 'hideWord') &&
          Object.prototype.hasOwnProperty.call(info, 'hideWelcome')
        ) {
          const legacy = parseHidden(info.hideWelcome);
          hideTable = legacy;
          hideWord = legacy;
        } else {
          hideTable = parseHidden(info.hideTable);
          hideWord = parseHidden(info.hideWord);
        }
        welcomeToggle.checked = !(hideTable && hideWord);
      }

      function loadConfiguration() {
        setMessage('');
        if (typeof google === 'undefined' || !google.script || !google.script.run) {
          return;
        }
        try {
          google.script.run
            .withSuccessHandler(function(res) {
              const data = res && typeof res === 'object' ? res : {};
              if (apiInput) {
                apiInput.value = data.key || '';
                apiInput.setAttribute('type', 'password');
              }
            })
            .withFailureHandler(function(error) {
              const message = error && error.message ? error.message : 'No se pudieron cargar las preferencias.';
              setMessage(message);
            })
            .getConfigurationSettings();
        } catch (error) {
          setMessage('No se pudieron cargar las preferencias.');
        }
      }

      function loadWelcomePreference() {
        if (typeof google === 'undefined' || !google.script || !google.script.run) {
          return;
        }
        try {
          google.script.run
            .withSuccessHandler(function(res) {
              syncWelcomeToggle(res);
            })
            .withFailureHandler(function() {})
            .getWelcomeMessagePreference();
        } catch (error) {
          // Ignoramos fallos silenciosamente para no bloquear la UI.
        }
      }

      document.addEventListener('DOMContentLoaded', function() {
        loadConfiguration();
        loadWelcomePreference();
      });

      if (saveKeyBtn) {
        saveKeyBtn.addEventListener('click', function() {
          setMessage('');
          const key = apiInput ? apiInput.value.trim() : '';
          if (typeof google === 'undefined' || !google.script || !google.script.run) {
            setMessage('No se pudo guardar la clave en este entorno.');
            return;
          }
          try {
            google.script.run
              .withSuccessHandler(function(res) {
                const data = res && typeof res === 'object' ? res : {};
                if (apiInput) {
                  apiInput.value = data.key || '';
                  apiInput.setAttribute('type', 'password');
                }
                setMessage('Preferencias guardadas correctamente.');
              })
              .withFailureHandler(function(error) {
                const message = error && error.message ? error.message : 'No se pudo guardar la clave.';
                setMessage(message);
              })
              .saveConfigurationSettings({ apiKey: key });
          } catch (error) {
            setMessage('No se pudo guardar la clave.');
          }
        });
      }

      if (deleteKeyBtn) {
        deleteKeyBtn.addEventListener('click', async function() {
          const confirmed = await showConfirmModal('¿Desea eliminar la clave almacenada?', {
            title: 'Eliminar clave',
            variant: 'warning',
            confirmText: 'Eliminar',
            cancelText: 'Cancelar'
          });
          if (!confirmed) {
            return;
          }
          setMessage('');
          if (typeof google === 'undefined' || !google.script || !google.script.run) {
            if (apiInput) {
              apiInput.value = '';
              apiInput.setAttribute('type', 'password');
            }
            setMessage('Clave eliminada localmente.');
            return;
          }
          try {
            google.script.run
              .withSuccessHandler(function(res) {
                const data = res && typeof res === 'object' ? res : {};
                if (apiInput) {
                  apiInput.value = data.key || '';
                  apiInput.setAttribute('type', 'password');
                }
                setMessage('Clave eliminada.');
              })
              .withFailureHandler(function(error) {
                const message = error && error.message ? error.message : 'No se pudo eliminar la clave.';
                setMessage(message);
              })
              .saveConfigurationSettings({ apiKey: '' });
          } catch (error) {
            setMessage('No se pudo eliminar la clave.');
          }
        });
      }

      if (welcomeToggle) {
        welcomeToggle.addEventListener('change', function() {
          const shouldShow = this.checked;
          setMessage('');
          if (typeof google === 'undefined' || !google.script || !google.script.run) {
            return;
          }
          try {
            google.script.run
              .withSuccessHandler(function() {
                setMessage(
                  shouldShow
                    ? 'El mensaje de bienvenida volverá a mostrarse.'
                    : 'El mensaje de bienvenida permanecerá oculto.'
                );
              })
              .withFailureHandler(function(error) {
                const message = error && error.message ? error.message : 'No se pudo actualizar la preferencia.';
                setMessage(message);
              })
              .setWelcomeMessagePreference(shouldShow, 'all');
          } catch (error) {
            setMessage('No se pudo actualizar la preferencia.');
          }
        });
      }

      if (eyeToggleBtn) {
        eyeToggleBtn.addEventListener('click', function() {
          if (!apiInput) {
            return;
          }
          const isHidden = apiInput.getAttribute('type') === 'password';
          apiInput.setAttribute('type', isHidden ? 'text' : 'password');
          this.textContent = isHidden ? '👁️' : '🙈';
          this.setAttribute('aria-label', isHidden ? 'Ocultar clave' : 'Mostrar clave');
          apiInput.focus();
        });
      }
    </script>
  </body>
</html>
