<script>
let editHeaders = [];
let editRangeInfo = null;
let editingId = '';
let editFormatDirty = false;
let editSavedListCollapsed = false;
let wordEditTextsCache = [];
let wordEditSelectedId = '';
let wordEditObserver = null;

function collectWordSavedTextsFromSelect() {
  const select = document.getElementById('aiSavedTexts');
  if (!select || !select.options) {
    return [];
  }
  const entries = [];
  Array.prototype.forEach.call(select.options, function(option) {
    if (!option || !option.value) {
      return;
    }
    const data = option.dataset || {};
    const kind = (data.kind || data.type || data.entryType || '').toLowerCase();
    const recordType = (data.recordType || data.metaType || '').toLowerCase();
    const value = String(option.value);
    if (
      (kind && kind !== 'texto' && kind !== 'text' && kind !== 'word' && kind !== 'documento') ||
      (recordType && recordType !== 'texto' && recordType !== 'text' && recordType !== 'word' && recordType !== 'documento')
    ) {
      return;
    }
    if (!kind && value && (value.indexOf('table:') === 0 || value.indexOf('tabla:') === 0)) {
      return;
    }
    entries.push({
      id: value,
      name: option.textContent && option.textContent.trim() ? option.textContent.trim() : option.value,
      language: data.language || data.lang || '',
      tone: data.tone || '',
      updated: data.updated || data.modified || '',
      notes: data.notes || data.description || ''
    });
  });
  return entries;
}

function updateWordEditDetails(entry) {
  const titleEl = document.getElementById('wordEditDetailsTitle');
  const languageEl = document.getElementById('wordEditDetailsLanguage');
  const toneEl = document.getElementById('wordEditDetailsTone');
  const updatedEl = document.getElementById('wordEditDetailsUpdated');
  const notesEl = document.getElementById('wordEditDetailsNotes');
  const statusEl = document.getElementById('wordEditDetailsStatus');
  const hintEl = document.getElementById('wordEditDetailsHint');
  const openBtn = document.getElementById('wordEditOpenBtn');
  const deleteBtn = document.getElementById('wordEditDeleteBtn');
  const hasEntry = !!(entry && entry.id);
  const fallback = '—';
  if (titleEl) {
    titleEl.textContent = hasEntry && entry.name ? entry.name : fallback;
  }
  if (languageEl) {
    languageEl.textContent = hasEntry && entry.language ? entry.language : fallback;
  }
  if (toneEl) {
    toneEl.textContent = hasEntry && entry.tone ? entry.tone : fallback;
  }
  if (updatedEl) {
    updatedEl.textContent = hasEntry && entry.updated ? entry.updated : fallback;
  }
  if (notesEl) {
    notesEl.textContent = hasEntry && entry.notes ? entry.notes : 'Selecciona un texto para revisar las instrucciones guardadas.';
  }
  if (statusEl) {
    statusEl.textContent = hasEntry ? 'Seleccionado' : 'Sin seleccionar';
  }
  if (hintEl) {
    hintEl.textContent = hasEntry
      ? 'Revisa los datos guardados y aplica los cambios desde el panel principal.'
      : 'Elige un texto para ver su título, idioma, tono y notas clave.';
  }
  if (openBtn) {
    openBtn.disabled = true;
    openBtn.title = hasEntry ? 'Disponible próximamente' : '';
  }
  if (deleteBtn) {
    deleteBtn.disabled = true;
    deleteBtn.title = hasEntry ? 'Disponible próximamente' : '';
  }
}

function renderWordEditSavedTexts(entries) {
  const listEl = document.getElementById('wordEditSavedTextsList');
  const selectEl = document.getElementById('wordEditSavedTexts');
  const emptyEl = document.getElementById('wordEditEmptyState');
  if (!listEl || !selectEl) {
    return;
  }
  listEl.innerHTML = '';
  while (selectEl.firstChild) {
    selectEl.removeChild(selectEl.firstChild);
  }
  const data = Array.isArray(entries) ? entries : [];
  if (!data.length) {
    if (emptyEl) {
      emptyEl.style.display = '';
    }
    updateWordEditDetails(null);
    wordEditSelectedId = '';
    return;
  }
  if (emptyEl) {
    emptyEl.style.display = 'none';
  }
  data.forEach(function(entry) {
    if (!entry || !entry.id) {
      return;
    }
    const option = document.createElement('option');
    option.value = entry.id;
    option.textContent = entry.name || entry.id;
    if (entry.language) option.dataset.language = entry.language;
    if (entry.tone) option.dataset.tone = entry.tone;
    if (entry.updated) option.dataset.updated = entry.updated;
    if (entry.notes) option.dataset.notes = entry.notes;
    selectEl.appendChild(option);

    const item = document.createElement('button');
    item.type = 'button';
    item.className = 'word-edit-item';
    item.dataset.value = entry.id;
    item.setAttribute('role', 'option');
    item.setAttribute('aria-selected', 'false');
    const title = document.createElement('span');
    title.className = 'word-edit-item-title';
    title.textContent = entry.name || entry.id;
    item.appendChild(title);
    const meta = document.createElement('span');
    meta.className = 'word-edit-item-meta';
    const language = entry.language ? entry.language : 'Idioma no definido';
    const tone = entry.tone ? entry.tone : 'Tono automático';
    meta.textContent = language + ' · ' + tone;
    item.appendChild(meta);
    listEl.appendChild(item);
  });
  if (wordEditSelectedId) {
    selectWordEditText(wordEditSelectedId, { scroll: false });
  } else if (data.length && data[0] && data[0].id) {
    selectWordEditText(data[0].id, { scroll: false });
  } else {
    updateWordEditDetails(null);
  }
}

function selectWordEditText(id, options) {
  const listEl = document.getElementById('wordEditSavedTextsList');
  const selectEl = document.getElementById('wordEditSavedTexts');
  const data = Array.isArray(wordEditTextsCache) ? wordEditTextsCache : [];
  const normalizedId = id ? String(id) : '';
  const entry = data.find(function(item) {
    return item && item.id === normalizedId;
  }) || null;
  if (!entry) {
    wordEditSelectedId = '';
    if (selectEl) {
      selectEl.value = '';
    }
    if (listEl) {
      const items = listEl.querySelectorAll('.word-edit-item');
      Array.prototype.forEach.call(items, function(item) {
        item.setAttribute('aria-selected', 'false');
        item.classList.remove('word-edit-item--selected');
      });
    }
    updateWordEditDetails(null);
    return;
  }
  wordEditSelectedId = normalizedId;
  if (selectEl) {
    selectEl.value = normalizedId;
  }
  if (listEl) {
    const items = listEl.querySelectorAll('.word-edit-item');
    Array.prototype.forEach.call(items, function(item) {
      const value = item && item.dataset ? item.dataset.value : '';
      const selected = value === normalizedId;
      item.setAttribute('aria-selected', selected ? 'true' : 'false');
      item.classList.toggle('word-edit-item--selected', selected);
      if (selected && options && options.scroll !== false) {
        if (typeof item.scrollIntoView === 'function') {
          item.scrollIntoView({ block: 'nearest' });
        }
      }
    });
  }
  updateWordEditDetails(entry);
}

function syncWordEditSavedTextsFromSelect() {
  wordEditTextsCache = collectWordSavedTextsFromSelect();
  renderWordEditSavedTexts(wordEditTextsCache);
}

function handleWordEditListClick(event) {
  const target = event.target;
  if (!target) {
    return;
  }
  const item = typeof target.closest === 'function' ? target.closest('.word-edit-item') : null;
  if (!item || !item.dataset || !item.dataset.value) {
    return;
  }
  selectWordEditText(item.dataset.value);
}

function handleWordEditListKeydown(event) {
  if (event.key !== 'Enter' && event.key !== ' ' && event.key !== 'Spacebar') {
    return;
  }
  const target = event.target;
  if (!target) {
    return;
  }
  const item = typeof target.closest === 'function' ? target.closest('.word-edit-item') : null;
  if (!item || !item.dataset || !item.dataset.value) {
    return;
  }
  event.preventDefault();
  selectWordEditText(item.dataset.value);
}

function initializeWordEditPanel() {
  const listEl = document.getElementById('wordEditSavedTextsList');
  if (!listEl) {
    return;
  }
  if (!listEl.hasAttribute('tabindex')) {
    listEl.tabIndex = 0;
  }
  listEl.addEventListener('click', handleWordEditListClick);
  listEl.addEventListener('keydown', handleWordEditListKeydown);
  const sourceSelect = document.getElementById('aiSavedTexts');
  if (sourceSelect) {
    sourceSelect.addEventListener('change', syncWordEditSavedTextsFromSelect);
    if (wordEditObserver && typeof wordEditObserver.disconnect === 'function') {
      wordEditObserver.disconnect();
    }
    wordEditObserver = new MutationObserver(function() {
      syncWordEditSavedTextsFromSelect();
    });
    wordEditObserver.observe(sourceSelect, { childList: true, attributes: true });
  }
  syncWordEditSavedTextsFromSelect();
}




      

function syncEditSavedListCollapseClass() {
        const listEl = document.getElementById('editSavedTablesList');
        const selectEl = document.getElementById('editSavedTables');
        if (!listEl) {
          return;
        }
        const hasSelection = !!(
          selectEl &&
          !selectEl.disabled &&
          selectEl.value &&
          String(selectEl.value).trim()
        );
        const shouldCollapse =
          hasSelection && editSavedListCollapsed && !listEl.classList.contains('disabled');
        if (shouldCollapse) {
          listEl.classList.add('collapsed');
          listEl.setAttribute('aria-expanded', 'false');
          listEl.dataset.collapsed = 'true';
        } else {
          listEl.classList.remove('collapsed');
          listEl.setAttribute('aria-expanded', 'true');
          listEl.dataset.collapsed = 'false';
        }
      }

function setEditSavedListCollapsed(collapsed) {
        editSavedListCollapsed = !!collapsed;
        syncEditSavedListCollapseClass();
      }

function updateCachedFormulaPreference(tableId, value, options) {
        if (!tableId) {
          return;
        }
        const normalizedId = String(tableId).trim();
        if (!normalizedId) {
          return;
        }
        const normalizedValue = !!value;
        let updated = false;
        if (Array.isArray(savedTablesCache)) {
          for (let i = 0; i < savedTablesCache.length; i++) {
            const entry = savedTablesCache[i];
            if (entry && entry.id === normalizedId) {
              entry.updateFormulaReferences = normalizedValue;
              updated = true;
              break;
            }
          }
        }
        const persist = !options || options.persist !== false;
        if (updated && persist) {
          persistSavedTablesCache();
        }
      }

function applyEditFormulaPreference(value, options) {
        const normalized = normalizeFormulaPreference(value);
        const toggle = document.getElementById('editUpdateFormulaRefs');
        if (toggle) {
          toggle.checked = normalized;
        }
        if (!editRangeInfo) {
          editRangeInfo = {};
        }
        editRangeInfo.updateFormulaReferences = normalized;
        if (editingId) {
          updateCachedFormulaPreference(editingId, normalized, options);
        }
        return normalized;
      }

function getEditFormulaPreference() {
        const toggle = document.getElementById('editUpdateFormulaRefs');
        if (toggle) {
          return !!toggle.checked;
        }
        if (editRangeInfo && typeof editRangeInfo.updateFormulaReferences === 'boolean') {
          return editRangeInfo.updateFormulaReferences;
        }
        return true;
      }

function createEditSavedItem(entry, selected, disabled) {
        const item = document.createElement('div');
        item.className = 'edit-saved-item';
        if (selected) {
          item.classList.add('selected');
        }
        if (disabled) {
          item.classList.add('disabled');
          item.tabIndex = -1;
          item.setAttribute('aria-disabled', 'true');
        } else {
          item.tabIndex = 0;
          item.setAttribute('aria-disabled', 'false');
        }
        item.dataset.value = entry.id;
        item.setAttribute('role', 'option');
        item.setAttribute('aria-selected', selected ? 'true' : 'false');
        styleEditListItem(item, entry);

        const label = document.createElement('span');
        label.className = 'edit-saved-label';
        label.textContent = entry.name || entry.id;
        item.appendChild(label);

        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'edit-saved-locate';
        btn.dataset.value = entry.id;
        btn.title = 'Ir a la tabla';
        if (disabled) {
          btn.disabled = true;
          btn.tabIndex = -1;
        }
        const icon = document.createElement('span');
        icon.setAttribute('aria-hidden', 'true');
        icon.textContent = '📍';
        btn.appendChild(icon);
        const sr = document.createElement('span');
        sr.className = 'visually-hidden';
        sr.textContent = 'Ir a la tabla';
        btn.appendChild(sr);
        item.appendChild(btn);
        return item;
      }

function renderEditSavedTablesList(entries, config) {
        const listEl = document.getElementById('editSavedTablesList');
        const selectEl = document.getElementById('editSavedTables');
        if (!listEl || !selectEl) {
          return;
        }
        const data = Array.isArray(entries) ? entries : [];
        const options = config || {};
        const disabled = !!options.disabled;
        const groupBySheet = !!options.groupBySheet;
        const selectedValue = options.selectedValue ? String(options.selectedValue) : '';
        listEl.innerHTML = '';
        listEl.setAttribute('role', 'listbox');
        listEl.setAttribute('aria-multiselectable', 'false');
        listEl.classList.toggle('disabled', disabled);
        listEl.setAttribute('aria-disabled', disabled ? 'true' : 'false');

        if (disabled || data.length === 0) {
          setEditSavedListCollapsed(false);
          const empty = document.createElement('div');
          empty.className = 'edit-saved-empty';
          empty.textContent = 'No hay tablas guardadas';
          listEl.appendChild(empty);
          syncEditSavedListCollapseClass();
          return;
        }

        if (groupBySheet) {
          const grouped = Object.create(null);
          const order = [];
          data.forEach(function(entry) {
            if (!entry || !entry.id) {
              return;
            }
            const sheetLabel = entry.sheetName ? entry.sheetName : 'Sin hoja';
            if (!grouped[sheetLabel]) {
              grouped[sheetLabel] = [];
              order.push(sheetLabel);
            }
            grouped[sheetLabel].push(entry);
          });
          order.forEach(function(sheetLabel) {
            const groupWrapper = document.createElement('div');
            groupWrapper.className = 'edit-saved-group';
            const labelEl = document.createElement('div');
            labelEl.className = 'edit-saved-group-label';
            labelEl.textContent = sheetLabel;
            groupWrapper.appendChild(labelEl);
            grouped[sheetLabel].forEach(function(entry) {
              const isSelected = entry.id === selectedValue;
              const item = createEditSavedItem(entry, isSelected, disabled);
              groupWrapper.appendChild(item);
            });
            listEl.appendChild(groupWrapper);
          });
        } else {
          data.forEach(function(entry) {
            if (!entry || !entry.id) {
              return;
            }
            const isSelected = entry.id === selectedValue;
            const item = createEditSavedItem(entry, isSelected, disabled);
            listEl.appendChild(item);
          });
        }
        syncEditSavedListCollapseClass();
      }

function syncEditSavedTablesHighlight() {
        const listEl = document.getElementById('editSavedTablesList');
        const selectEl = document.getElementById('editSavedTables');
        if (!listEl || !selectEl) {
          return;
        }
        const selectedValue = !selectEl.disabled && selectEl.value ? String(selectEl.value) : '';
        listEl.querySelectorAll('.edit-saved-item').forEach(function(item) {
          const value = item && item.dataset ? item.dataset.value : '';
          if (!value) {
            item.classList.remove('selected');
            item.setAttribute('aria-selected', 'false');
            return;
          }
          if (selectedValue && value === selectedValue) {
            item.classList.add('selected');
            item.setAttribute('aria-selected', 'true');
          } else {
            item.classList.remove('selected');
            item.setAttribute('aria-selected', 'false');
          }
        });
        syncEditSavedListCollapseClass();
      }




      

function clearEditFormatDirty() {
        editFormatDirty = false;
      }

function markEditFormatDirty() {
        editFormatDirty = true;
      }

function isEditFormatDirty() {
        return !!editFormatDirty;
      }

function selectEditSavedTable(value) {
        const select = document.getElementById('editSavedTables');
        if (!select) {
          return;
        }
        if (select.disabled) {
          return;
        }
        const normalized = value ? String(value) : '';
        let hasMatch = false;
        if (select.options && select.options.length) {
          Array.prototype.forEach.call(select.options, function(option) {
            if (option && option.value === normalized) {
              hasMatch = true;
            }
          });
        }
        if (!normalized || !hasMatch) {
          select.value = '';
          const event = new Event('change', { bubbles: true });
          select.dispatchEvent(event);
          return;
        }
        if (select.value !== normalized) {
          select.value = normalized;
        }
        const event = new Event('change', { bubbles: true });
        select.dispatchEvent(event);
      }

async function locateSavedTable(tableId) {
        const id = tableId ? String(tableId).trim() : '';
        if (!id) {
          return;
        }
        let response;
        try {
          response = await callServerFunction('focusSavedTableRange', id);
        } catch (err) {
          await showMessageModal('No se pudo enfocar la tabla: ' + (err && err.message ? err.message : err), {
            title: 'No se pudo enfocar',
            variant: 'error'
          });
          return;
        }
        if (!response || response.error) {
          await showMessageModal((response && response.error) || 'No se pudo enfocar la tabla seleccionada.', {
            title: 'No se pudo enfocar',
            variant: 'error'
          });
        }
      }

function setEditDefaultStyles() {
        const colorHeader = document.getElementById('editColorHeader');
        const colorAlt1 = document.getElementById('editColorAlt1');
        const colorAlt2 = document.getElementById('editColorAlt2');
        const borderToggle = document.getElementById('editToggleBorder');
        const boldToggle = document.getElementById('editToggleBold');
        if (colorHeader) colorHeader.value = DEFAULT_STYLE.headerColor;
        if (colorAlt1) colorAlt1.value = DEFAULT_STYLE.altColor1;
        if (colorAlt2) colorAlt2.value = DEFAULT_STYLE.altColor2;
        if (borderToggle) borderToggle.checked = DEFAULT_STYLE.border;
        if (boldToggle) boldToggle.checked = DEFAULT_STYLE.bold;
      }

function resetEditTabView(options) {
        const opts = options || {};
        clearEditFormatDirty();
        if (!opts.preserveSelection) {
          const select = document.getElementById('editSavedTables');
          if (select) {
            select.value = '';
          }
          if (opts.clearEditingId !== false) {
            editingId = '';
          }
          setEditSavedListCollapsed(false);
        } else if (opts.clearEditingId) {
          editingId = '';
        }
        editHeaders = [];
        editRangeInfo = null;
        renderEditHeaders();

        const rangeSection = document.getElementById('editRangeSection');
        const metaSection = document.getElementById('editMetaSection');
        if (rangeSection) {
          rangeSection.style.display = 'none';
        }
        if (metaSection) {
          metaSection.style.display = 'none';
        }

        const label = document.getElementById('editRangeLabel');
        if (label) {
          label.textContent = '—';
        }
        const input = document.getElementById('editRangeInput');
        if (input) {
          input.value = '';
          input.dataset.manual = 'false';
        }

        const nameInput = document.getElementById('editTableName');
        if (nameInput) {
          nameInput.value = '';
        }
        const descInput = document.getElementById('editTableDesc');
        if (descInput) {
          descInput.value = '';
        }

        setEditDefaultStyles();

        const actionsRow = document.getElementById('editActionsRow');
        if (actionsRow) {
          actionsRow.style.display = 'none';
        }
        const refreshApplyBtn = document.getElementById('editRefreshApplyBtn');
        if (refreshApplyBtn) {
          refreshApplyBtn.disabled = true;
        }
        const saveBtn = document.getElementById('editSaveTableBtn');
        if (saveBtn) {
          saveBtn.disabled = true;
        }
        const deleteBtn = document.getElementById('editDeleteTableBtn');
        if (deleteBtn) {
          deleteBtn.disabled = true;
        }
        const updateFormulasToggle = document.getElementById('editUpdateFormulaRefs');
        if (updateFormulasToggle) {
          updateFormulasToggle.checked = true;
        }
        syncEditSavedTablesHighlight();
      }

function clearEditRangeUI() {
        const label = document.getElementById('editRangeLabel');
        if (label) {
          label.textContent = '—';
        }
        const input = document.getElementById('editRangeInput');
        if (input) {
          input.value = '';
          input.dataset.manual = 'false';
        }
        editRangeInfo = null;
        clearEditFormatDirty();
      }

function setEditRangeUI(info, options) {
        options = options || {};
        if (!info || !info.sheetName || !info.a1Notation) {
          clearEditRangeUI();
          return;
        }
        const rows = typeof info.rows === 'number' ? info.rows : (info.rows || 0);
        const cols = typeof info.cols === 'number' ? info.cols : (info.cols || 0);
        const label = document.getElementById('editRangeLabel');
        const input = document.getElementById('editRangeInput');
        const fullA1 = info.sheetName + '!' + info.a1Notation;
        if (label) {
          const dims = rows && cols ? ' (' + cols + '×' + rows + ')' : '';
          label.textContent = fullA1 + dims;
        }
        if (input && (options.force || input.dataset.manual !== 'true')) {
          input.value = fullA1;
          input.dataset.manual = 'false';
        }
        const previousInfo = editRangeInfo;
        const incomingEditHeaders = Array.isArray(info.headers) ? info.headers : editHeaders;
        const previousHeadersSource = previousInfo && Array.isArray(previousInfo.headers)
          ? previousInfo.headers
          : Array.isArray(editHeaders)
          ? editHeaders
          : [];
        const normalizedPreviousHeaders = cloneHeaderModels(previousHeadersSource);
        const normalizedHeaders = cloneHeaderModels(incomingEditHeaders);
        if (normalizedPreviousHeaders.length > 0) {
          for (let i = 0; i < normalizedHeaders.length; i++) {
            const header = normalizedHeaders[i];
            const fallback = normalizedPreviousHeaders[i];
            if (!fallback) {
              continue;
            }
            const labelText = header.label ? String(header.label).trim() : '';
            if (!labelText) {
              header.label = fallback.label || '';
            }
            const hasDescriptionText = header.description ? String(header.description).trim() : '';
            if ((!hasDescriptionText || !header.hasDescription) && fallback.hasDescription) {
              header.description = fallback.description || '';
              header.hasDescription = true;
            }
            const fallbackPrompt = fallback.aiFillPrompt ? String(fallback.aiFillPrompt).trim() : '';
            if (fallback.aiFillEnabled && !header.aiFillEnabled) {
              header.aiFillEnabled = true;
            }
            if ((!header.aiFillPrompt || !String(header.aiFillPrompt).trim()) && fallbackPrompt) {
              header.aiFillPrompt = fallbackPrompt;
            }
            if (fallback.key) {
              header.key = fallback.key;
            }
          }
        }
        const incomingPreference =
          typeof info.updateFormulaReferences === 'boolean'
            ? info.updateFormulaReferences
            : previousInfo && typeof previousInfo.updateFormulaReferences === 'boolean'
            ? previousInfo.updateFormulaReferences
            : true;
        info.headers = normalizedHeaders;
        editRangeInfo = {
          sheetName: info.sheetName,
          a1Notation: info.a1Notation,
          rows: rows,
          cols: cols,
          headers: cloneHeaderModels(info.headers),
          updateFormulaReferences: incomingPreference
        };
        editRangeInfo.fullA1 = fullA1;
        if (options.clearDirty) {
          clearEditFormatDirty();
        } else if (options.markDirty) {
          markEditFormatDirty();
        }
      }

function getEditRangeInputValue() {
        const input = document.getElementById('editRangeInput');
        if (input) {
          const text = input.value.trim();
          if (text) {
            return text;
          }
        }
        if (editRangeInfo && editRangeInfo.sheetName && editRangeInfo.a1Notation) {
          return editRangeInfo.sheetName + '!' + editRangeInfo.a1Notation;
        }
        return '';
      }

function shouldUpdateEditFormulaReferences() {
        return getEditFormulaPreference();
      }

function renderEditHeaders() {
        renderHeaderList('editHeadersList', editHeaders);
      }

function loadEditActiveRange(updateHeaders = true, options) {
        const opts = options || {};
        return new Promise(function(resolve) {
          google.script.run
            .withSuccessHandler(function(info) {
              const label = document.getElementById('editRangeLabel');
              if (info.error) {
                clearEditRangeUI();
                if (label) {
                  label.textContent = '—';
                }
                showMessageModal(info.error, {
                  title: 'Rango no disponible',
                  variant: 'error'
                });
                resolve({ ok: false, error: info.error });
                return;
              }
              const infoForUi = Object.assign({}, info);
              if (!updateHeaders) {
                infoForUi.headers = cloneHeaderModels(editHeaders);
              }
              const input = document.getElementById('editRangeInput');
              const shouldForce = !input || input.dataset.manual !== 'true';
              setEditRangeUI(infoForUi, { force: shouldForce, markDirty: !!opts.markDirty });
              if (updateHeaders) {
                editHeaders = cloneHeaderModels(infoForUi.headers);
              }
              renderEditHeaders();
              resolve({ ok: true, info: infoForUi });
            })
            .withFailureHandler(function(err) {
              const message = err && err.message ? err.message : err;
              showMessageModal('No se pudo obtener el rango activo: ' + message, {
                title: 'Rango no disponible',
                variant: 'error'
              });
              resolve({ ok: false, error: message });
            })
            .getActiveRangeInfo();
        });
      }

function populateEditForm(meta) {
        const normalizedMeta = normalizeMetaForPopulate(meta);
        if (!normalizedMeta) {
          resetEditTabView({ preserveSelection: true, clearEditingId: false });
          showMessageModal('No se encontraron metadatos para la tabla seleccionada.', {
            title: 'Metadatos no disponibles',
            variant: 'error'
          });
          return;
        }

        upsertSavedTablesCache(normalizedMeta);
        lastSavedTableId = normalizedMeta.id;
        clearEditFormatDirty();

        const rangeSection = document.getElementById('editRangeSection');
        const metaSection = document.getElementById('editMetaSection');
        if (rangeSection) {
          rangeSection.style.display = 'block';
        }
        if (metaSection) {
          metaSection.style.display = 'block';
        }

        const actionsRow = document.getElementById('editActionsRow');
        if (actionsRow) {
          actionsRow.style.display = 'flex';
        }
        const refreshApplyBtn = document.getElementById('editRefreshApplyBtn');
        if (refreshApplyBtn) {
          refreshApplyBtn.disabled = false;
        }
        const saveBtn = document.getElementById('editSaveTableBtn');
        if (saveBtn) {
          saveBtn.disabled = false;
        }
        const deleteBtn = document.getElementById('editDeleteTableBtn');
        if (deleteBtn) {
          deleteBtn.disabled = false;
        }

        const nameInput = document.getElementById('editTableName');
        if (nameInput) {
          nameInput.value = normalizedMeta.name || '';
        }
        const descInput = document.getElementById('editTableDesc');
        if (descInput) {
          descInput.value = normalizedMeta.description || '';
        }

        const style = normalizedMeta.style || {};
        const headerColor = typeof style.headerColor === 'string' ? style.headerColor : DEFAULT_STYLE.headerColor;
        const alt1 = typeof style.altColor1 === 'string' ? style.altColor1 : DEFAULT_STYLE.altColor1;
        const alt2 = typeof style.altColor2 === 'string' ? style.altColor2 : DEFAULT_STYLE.altColor2;
        const border = Object.prototype.hasOwnProperty.call(style, 'border')
          ? !!style.border
          : DEFAULT_STYLE.border;
        const bold = Object.prototype.hasOwnProperty.call(style, 'bold') ? !!style.bold : DEFAULT_STYLE.bold;

        const headerColorInput = document.getElementById('editColorHeader');
        if (headerColorInput) {
          headerColorInput.value = headerColor;
        }
        const alt1Input = document.getElementById('editColorAlt1');
        if (alt1Input) {
          alt1Input.value = alt1;
        }
        const alt2Input = document.getElementById('editColorAlt2');
        if (alt2Input) {
          alt2Input.value = alt2;
        }
        const borderToggle = document.getElementById('editToggleBorder');
        if (borderToggle) {
          borderToggle.checked = border;
        }
        const boldToggle = document.getElementById('editToggleBold');
        if (boldToggle) {
          boldToggle.checked = bold;
        }

        const preference = normalizeFormulaPreference(normalizedMeta.updateFormulaReferences);

        editHeaders = cloneHeaderModels(normalizedMeta.headers);
        if (editHeaders.length === 0 && normalizedMeta.id) {
          google.script.run
            .withSuccessHandler(function(res) {
              if (res && Array.isArray(res.headers)) {
                editHeaders = cloneHeaderModels(res.headers);
                renderEditHeaders();
              }
            })
            .getTableHeaders(normalizedMeta.id);
        }
        renderEditHeaders();

        if (normalizedMeta.sheetName && normalizedMeta.rangeA1) {
          setEditRangeUI(
            {
              sheetName: normalizedMeta.sheetName,
              a1Notation: normalizedMeta.rangeA1,
              rows: normalizedMeta.rows || 0,
              cols: normalizedMeta.cols || 0,
              headers: cloneHeaderModels(editHeaders),
              updateFormulaReferences: preference
            },
            { force: true, clearDirty: true }
          );
        } else {
          clearEditRangeUI();
        }

        applyEditFormulaPreference(preference, { persist: false });
      }

async function openActionForEditing(action) {
        if (!action || !action.id) {
          return;
        }
        if (action.type === 'table') {
          await refreshSavedTables(['editSavedTables', 'aiSavedTables'], { selectId: action.id });
          await attemptTabChange('editTab', { force: true });
          selectEditSavedTable(action.id);
        } else if (action.type === 'reportFavorite') {
          await loadReportFavoriteIntoPanel(action);
        } else {
          await showMessageModal('Esta acción todavía no se puede editar desde el panel.', {
            title: 'Acción no soportada',
            variant: 'warning'
          });
        }
      }



      document.querySelectorAll('.tab-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
          attemptTabChange(btn.dataset.tab);
        });
      });

      const createRefreshBtn = document.getElementById('refreshRangeBtn');
      if (createRefreshBtn) {
        createRefreshBtn.addEventListener('click', async function() {
          if (createRefreshBtn.disabled) {
            return;
          }
          if (isFormatLockActive()) {
            const resolved = await resolvePendingFormatting();
            if (resolved !== 'saved' && resolved !== 'cleared') {
              return;
            }
          }
          const input = document.getElementById('rangeInput');
          if (input) {
            input.dataset.manual = 'false';
          }
          loadActiveRange(editingId === '');
        });
      }

      document.getElementById('editRefreshApplyBtn').addEventListener('click', async function() {
        if (!editingId) {
          await showMessageModal('Seleccione una tabla antes de actualizar el rango.', {
            title: 'Seleccione una tabla',
            variant: 'error'
          });
          return;
        }
        const loadResult = await loadEditActiveRange(true, { markDirty: true });
        if (!loadResult || !loadResult.ok) {
          return;
        }
        await handleEditApplyFormat();
      });

      

async function handleEditApplyFormat() {
        if (!editingId) {
          await showMessageModal('Seleccione una tabla guardada antes de aplicar el formato.', {
            title: 'Seleccione una tabla',
            variant: 'error'
          });
          return false;
        }

        const rangeA1 = getEditRangeInputValue();
        if (!rangeA1) {
          await showMessageModal('Indique un rango válido antes de aplicar el formato.', {
            title: 'Rango requerido',
            variant: 'error'
          });
          return false;
        }

        const validation = validateTableDetails({
          nameInputId: 'editTableName',
          descInputId: 'editTableDesc',
          headers: editHeaders
        });
        if (!validation.valid) {
          const msg = buildMissingFieldsMessage(validation.missing);
          await showMessageModal(msg || 'Complete todos los campos obligatorios antes de continuar.', {
            title: 'Información incompleta',
            variant: 'error'
          });
          return false;
        }

        editHeaders = cloneHeaderModels(validation.values.headers);
        renderEditHeaders();
        const nameInput = document.getElementById('editTableName');
        if (nameInput) {
          nameInput.value = validation.values.name;
        }
        const descInput = document.getElementById('editTableDesc');
        if (descInput) {
          descInput.value = validation.values.description;
        }

        const headerColorInput = document.getElementById('editColorHeader');
        const alt1Input = document.getElementById('editColorAlt1');
        const alt2Input = document.getElementById('editColorAlt2');
        const borderToggle = document.getElementById('editToggleBorder');
        const boldToggle = document.getElementById('editToggleBold');
        const style = {
          headerColor: headerColorInput ? headerColorInput.value : DEFAULT_STYLE.headerColor,
          altColor1: alt1Input ? alt1Input.value : DEFAULT_STYLE.altColor1,
          altColor2: alt2Input ? alt2Input.value : DEFAULT_STYLE.altColor2,
          border: borderToggle ? !!borderToggle.checked : DEFAULT_STYLE.border,
          bold: boldToggle ? !!boldToggle.checked : DEFAULT_STYLE.bold
        };

        const uniqueName = await ensureUniqueTableNameOrAlert(validation.values.name, {
          ignoreId: editingId
        });
        if (!uniqueName) {
          return false;
        }

        const updateFormulaReferences = shouldUpdateEditFormulaReferences();
        const entryValues = Object.assign({}, validation.values, {
          updateFormulaReferences: updateFormulaReferences
        });

        let response;
        try {
          response = await callServerFunction(
            'applyTableFormatting',
            editingId,
            rangeA1,
            validation.values.name,
            validation.values.description,
            cloneHeaderModels(editHeaders),
            style,
            { updateFormulaReferences: updateFormulaReferences, formulaPreference: updateFormulaReferences }
          );
        } catch (err) {
          await showMessageModal('No se pudo aplicar el formato: ' + (err && err.message ? err.message : err), {
            title: 'No se pudo aplicar',
            variant: 'error'
          });
          return false;
        }

        if (response && response.error) {
          await showMessageModal(response.error, {
            title: 'No se pudo aplicar',
            variant: 'error'
          });
          return false;
        }

        if (response && response.rangeInfo) {
          setEditRangeUI(response.rangeInfo, { force: true, clearDirty: true });
          if (Array.isArray(response.rangeInfo.headers)) {
            editHeaders = cloneHeaderModels(response.rangeInfo.headers);
            renderEditHeaders();
          }
          const appliedPreference =
            typeof response.rangeInfo.updateFormulaReferences === 'boolean'
              ? response.rangeInfo.updateFormulaReferences
              : updateFormulaReferences;
          applyEditFormulaPreference(appliedPreference);
          entryValues.updateFormulaReferences = appliedPreference;
        } else {
          applyEditFormulaPreference(updateFormulaReferences);
        }

        if (response && response.id) {
          editingId = response.id;
          lastSavedTableId = response.id;
          const cachedEntry = buildSavedTableCacheEntry(
            response.id,
            entryValues,
            (response && response.rangeInfo) || editRangeInfo,
            style,
            editHeaders
          );
          if (cachedEntry) {
            upsertSavedTablesCache(cachedEntry);
            applySavedTablesFromCache(['editSavedTables', 'aiSavedTables'], {
              selectId: response.id
            });
          }
        }

        await refreshSavedTables(['editSavedTables', 'aiSavedTables'], {
          selectId: editingId
        });

        clearEditFormatDirty();

        await showMessageModal((response && response.message) || 'Formato aplicado correctamente.', {
          title: 'Formato aplicado',
          variant: 'success'
        });
        return true;
      }



      document.getElementById('saveTableBtn').addEventListener('click', function() {
        handleSaveAction();
      });

      document.getElementById('editSaveTableBtn').addEventListener('click', function() {
        handleEditSaveAction();
      });

      

async function handleEditSaveAction(options) {
        const opts = options || {};
        if (!editingId) {
          await showMessageModal('Seleccione una tabla guardada antes de guardar los cambios.', {
            title: 'Seleccione una tabla',
            variant: 'error'
          });
          return false;
        }

        const rangeA1 = getEditRangeInputValue();
        if (!rangeA1) {
          await showMessageModal('Indique un rango válido antes de guardar la tabla.', {
            title: 'Rango requerido',
            variant: 'error'
          });
          return false;
        }

        const validation = validateTableDetails({
          nameInputId: 'editTableName',
          descInputId: 'editTableDesc',
          headers: editHeaders
        });

        if (validation.missing.length > 0) {
          const missingExcludingName = validation.missing.filter(function(item) {
            return item !== 'Nombre de la tabla';
          });

          if (missingExcludingName.length > 0) {
            const msg = buildMissingFieldsMessage(validation.missing);
            await showMessageModal(msg || 'Complete todos los campos obligatorios antes de continuar.', {
              title: 'Información incompleta',
              variant: 'error'
            });
            return false;
          }

          if (validation.missing.indexOf('Nombre de la tabla') !== -1) {
            const continueWithoutName = await showConfirmModal(
              'Guardar sin nombre hará que la tabla sea difícil de identificar. ¿Desea continuar?',
              {
                title: 'Guardar sin nombre',
                variant: 'warning',
                confirmText: 'Continuar',
                cancelText: 'Cancelar'
              }
            );
            if (!continueWithoutName) {
              return false;
            }
          }
        }

        const uniqueName = await ensureUniqueTableNameOrAlert(validation.values.name, {
          ignoreId: editingId
        });
        if (!uniqueName) {
          return false;
        }

        editHeaders = cloneHeaderModels(validation.values.headers);
        renderEditHeaders();
        const nameInput = document.getElementById('editTableName');
        if (nameInput) {
          nameInput.value = validation.values.name;
        }
        const descInput = document.getElementById('editTableDesc');
        if (descInput) {
          descInput.value = validation.values.description;
        }

        const headerColorInput = document.getElementById('editColorHeader');
        const alt1Input = document.getElementById('editColorAlt1');
        const alt2Input = document.getElementById('editColorAlt2');
        const borderToggle = document.getElementById('editToggleBorder');
        const boldToggle = document.getElementById('editToggleBold');
        const style = {
          headerColor: headerColorInput ? headerColorInput.value : DEFAULT_STYLE.headerColor,
          altColor1: alt1Input ? alt1Input.value : DEFAULT_STYLE.altColor1,
          altColor2: alt2Input ? alt2Input.value : DEFAULT_STYLE.altColor2,
          border: borderToggle ? !!borderToggle.checked : DEFAULT_STYLE.border,
          bold: boldToggle ? !!boldToggle.checked : DEFAULT_STYLE.bold
        };

        const updateFormulaReferences = shouldUpdateEditFormulaReferences();
        const entryValues = Object.assign({}, validation.values, {
          updateFormulaReferences: updateFormulaReferences
        });

        if (isEditFormatDirty() && !opts.skipFormatPrompt) {
          const decision = await openModal({
            title: 'Formato pendiente',
            message: 'Debe aplicar formato antes de guardar.',
            variant: 'warning',
            primaryText: 'Aplicar formato y guardar',
            secondaryText: 'Cancelar'
          });
          if (decision === 'primary') {
            const applied = await handleEditApplyFormat();
            if (!applied) {
              return false;
            }
            return handleEditSaveAction(Object.assign({}, opts, { skipFormatPrompt: true }));
          }
          return false;
        }

        let response;
        try {
          response = await callServerFunction(
            'applyTableFormatting',
            editingId,
            rangeA1,
            validation.values.name,
            validation.values.description,
            cloneHeaderModels(editHeaders),
            style,
            { skipFormatting: true, formulaPreference: updateFormulaReferences }
          );
        } catch (err) {
          await showMessageModal('No se pudo guardar la tabla: ' + (err && err.message ? err.message : err), {
            title: 'No se pudo guardar',
            variant: 'error'
          });
          return false;
        }

        if (response && response.error) {
          await showMessageModal(response.error, {
            title: 'No se pudo guardar',
            variant: 'error'
          });
          return false;
        }

        if (response && response.rangeInfo) {
          setEditRangeUI(response.rangeInfo, { force: true, clearDirty: true });
          if (Array.isArray(response.rangeInfo.headers)) {
            editHeaders = cloneHeaderModels(response.rangeInfo.headers);
            renderEditHeaders();
          }
          const appliedPreference =
            typeof response.rangeInfo.updateFormulaReferences === 'boolean'
              ? response.rangeInfo.updateFormulaReferences
              : updateFormulaReferences;
          applyEditFormulaPreference(appliedPreference);
          entryValues.updateFormulaReferences = appliedPreference;
        } else {
          applyEditFormulaPreference(updateFormulaReferences);
        }

        if (response && response.id) {
          editingId = response.id;
          lastSavedTableId = response.id;
          const cachedEntry = buildSavedTableCacheEntry(
            response.id,
            entryValues,
            (response && response.rangeInfo) || editRangeInfo,
            style,
            editHeaders
          );
          if (cachedEntry) {
            upsertSavedTablesCache(cachedEntry);
            applySavedTablesFromCache(['editSavedTables', 'aiSavedTables'], {
              selectId: response.id
            });
          }
        }

        await refreshSavedTables(['editSavedTables', 'aiSavedTables'], {
          selectId: editingId
        });

        await showMessageModal((response && response.message) || 'Tabla guardada correctamente.', {
          title: 'Tabla guardada',
          variant: 'success'
        });
        return true;
      }

document.addEventListener('DOMContentLoaded', function() {
  initializeWordEditPanel();
});
