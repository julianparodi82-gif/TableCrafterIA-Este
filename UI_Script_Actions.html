<script>
const ACTION_CHANNEL_LABELS = Object.freeze({
  download: 'Descargar',
  email: 'Correo electrónico',
  whatsapp: 'WhatsApp'
});
const REPORT_FORMAT_LABELS_IN_ACTIONS =
  typeof REPORT_FORMAT_LABELS !== 'undefined'
    ? REPORT_FORMAT_LABELS
    : {
        pdf: 'PDF',
        excel: 'Excel',
        sheets: 'Google Sheets'
      };
const REPORT_FEATURE_LABELS_IN_ACTIONS =
  typeof REPORT_FEATURE_LABELS !== 'undefined'
    ? REPORT_FEATURE_LABELS
    : {
        chart: 'Gráfico',
        table: 'Tabla',
        list: 'Lista',
        summary: 'Resumen'
      };
const ACTION_EDITOR_DEFAULT_SUBTITLE =
  'Ajustá las características guardadas y actualizá el favorito directamente desde este panel.';

let savedActionsCache = [];
let savedActionsLoaded = false;
let loadingSavedActions = false;
let currentSavedActionId = '';
let currentSavedActionDetails = null;
let reportEditorPortal = null;
let reportEditorMounted = false;
let queuedSavedActionsRefresh = null;
let savedActionsRefreshTimer = 0;
let savedActionsPanelInitialized = false;
let pendingSavedActionMutation = null;
let savedActionsMenuInitialized = false;
let savedActionsMenuOpen = false;

function getCurrentSavedActionId() {
  return currentSavedActionId;
}

function getSavedActionsSnapshot() {
  return savedActionsCache.slice();
}

function findSavedActionInCache(actionId) {
  const id = actionId ? String(actionId) : '';
  if (!id) {
    return null;
  }
  return (
    savedActionsCache.find(function(action) {
      return action && action.id === id;
    }) || null
  );
}

function countReportFavoriteActions(actions) {
  if (!Array.isArray(actions)) {
    return 0;
  }
  return actions.reduce(function(total, action) {
    if (action && action.type === 'reportFavorite') {
      return total + 1;
    }
    return total;
  }, 0);
}

function dispatchSavedActionsUpdated() {
  const detail = {
    actions: getSavedActionsSnapshot(),
    currentId: currentSavedActionId
  };
  document.dispatchEvent(new CustomEvent('tc:savedActionsUpdated', { detail: detail }));
}

function getReportEditorPortal() {
  if (reportEditorPortal) {
    return reportEditorPortal;
  }
  const section = document.getElementById('aiReportSection');
  const host = document.getElementById('aiActionEditorBody');
  if (!section || !host) {
    return null;
  }
  let placeholder = document.getElementById('aiReportSectionPlaceholder');
  if (!placeholder) {
    const parent = section.parentNode;
    if (!parent) {
      return null;
    }
    placeholder = document.createElement('div');
    placeholder.id = 'aiReportSectionPlaceholder';
    placeholder.style.display = 'contents';
    parent.insertBefore(placeholder, section);
  }
  if (!placeholder.contains(section)) {
    placeholder.appendChild(section);
  }
  reportEditorPortal = {
    section: section,
    host: host,
    placeholder: placeholder
  };
  return reportEditorPortal;
}

function initReportEditorPortal() {
  getReportEditorPortal();
}

function mountReportEditorInActions() {
  const portal = getReportEditorPortal();
  if (!portal || !portal.section || !portal.host) {
    return false;
  }
  if (!portal.host.contains(portal.section)) {
    portal.host.appendChild(portal.section);
  }
  reportEditorMounted = true;
  return true;
}

function restoreReportEditorHome() {
  const portal = getReportEditorPortal();
  if (!portal || !portal.section || !portal.placeholder) {
    return;
  }
  if (!portal.placeholder.contains(portal.section)) {
    portal.placeholder.appendChild(portal.section);
  }
  reportEditorMounted = false;
}

function updateActionEditorHeader(action) {
  const title = document.getElementById('aiActionEditorTitle');
  const subtitle = document.getElementById('aiActionEditorSubtitle');
  const meta = document.getElementById('aiActionEditorMeta');
  const name = action && action.name ? action.name : 'Acción sin nombre';
  if (title) {
    title.textContent = name;
  }
  if (subtitle) {
    if (action && action.description) {
      subtitle.textContent = action.description;
    } else {
      subtitle.textContent = ACTION_EDITOR_DEFAULT_SUBTITLE;
    }
  }
  if (meta) {
    const pieces = [];
    if (action && action.updatedAt) {
      pieces.push('Actualizado: ' + action.updatedAt);
    }
    if (action && action.createdAt) {
      pieces.push('Creado: ' + action.createdAt);
    }
    meta.textContent = pieces.join(' • ');
  }
}

async function enterReportFavoriteEditor(action, options) {
  const editor = document.getElementById('aiActionEditor');
  const portal = getReportEditorPortal();
  if (!editor || !portal || !portal.section || !portal.host) {
    return false;
  }
  updateActionEditorHeader(action);
  editor.classList.remove('ai-hidden');
  const mounted = mountReportEditorInActions();
  if (!mounted) {
    return false;
  }
  const opts = options || {};
  if (opts.skipReload === true) {
    return true;
  }
  if (typeof loadReportFavoriteIntoPanel !== 'function') {
    return true;
  }
  try {
    await loadReportFavoriteIntoPanel(action, { skipTabChange: true });
    return true;
  } catch (err) {
    console.log('No se pudo cargar el reporte favorito en Acciones.', err);
    exitReportFavoriteEditor({ keepVisible: false, keepMounted: false, clearFavorite: false });
    return false;
  }
}

function exitReportFavoriteEditor(options) {
  const opts = options || {};
  if (!opts.keepMounted) {
    restoreReportEditorHome();
  }
  const editor = document.getElementById('aiActionEditor');
  if (editor && !opts.keepVisible) {
    editor.classList.add('ai-hidden');
  }
  if (!opts.keepHeader) {
    const title = document.getElementById('aiActionEditorTitle');
    if (title) {
      title.textContent = 'Editar reporte favorito';
    }
    const subtitle = document.getElementById('aiActionEditorSubtitle');
    if (subtitle) {
      subtitle.textContent = ACTION_EDITOR_DEFAULT_SUBTITLE;
    }
    const meta = document.getElementById('aiActionEditorMeta');
    if (meta) {
      meta.textContent = '';
    }
  }
  if (opts.clearFavorite && typeof clearActiveReportFavorite === 'function') {
    clearActiveReportFavorite();
  }
}

function notifyActionsTabChanged(targetTab) {
  if (savedActionsMenuOpen) {
    closeSavedActionsMenu();
  }
  if (targetTab === 'aiTab') {
    if (reportEditorMounted || (currentSavedActionDetails && currentSavedActionDetails.type === 'reportFavorite')) {
      exitReportFavoriteEditor({ clearFavorite: false });
    }
    return;
  }
  if (targetTab === 'actionsTab') {
    if (currentSavedActionDetails && currentSavedActionDetails.type === 'reportFavorite') {
      const container = document.getElementById('aiActionDetails');
      if (container) {
        container.classList.remove('ai-hidden');
      }
      const cardWrapper = document.getElementById('aiActionDetailCard');
      if (cardWrapper) {
        cardWrapper.innerHTML = '';
        cardWrapper.classList.add('ai-hidden');
      }
      enterReportFavoriteEditor(currentSavedActionDetails, { skipReload: true }).then(function(success) {
        if (!success) {
          populateActionDetailCard(currentSavedActionDetails, { mode: 'fallback' });
        }
      });
    }
  }
}

function updateSavedActionsEmptyState(hasEntries) {
  const emptyMessage = document.getElementById('aiActionsEmptyMessage');
  if (!emptyMessage) {
    return;
  }
  if (hasEntries) {
    emptyMessage.classList.add('ai-hidden');
  } else {
    emptyMessage.classList.remove('ai-hidden');
  }
}

function renderSavedActionsSelect(actions, selectedId, options) {
  const select = document.getElementById('aiSavedActions');
  if (!select) {
    return { hasEntries: false, selectedId: '' };
  }
  const opts = options || {};
  const list = Array.isArray(actions) ? actions : [];
  select.innerHTML = '';
  const placeholder = document.createElement('option');
  placeholder.value = '';
  placeholder.textContent = 'Seleccionar...';
  select.appendChild(placeholder);
  if (list.length === 0) {
    select.disabled = true;
    updateSavedActionsEmptyState(false);
    renderSavedActionsMenu([], '');
    return { hasEntries: false, selectedId: '' };
  }
  const tooltipMap = Object.create(null);
  const actionMap = Object.create(null);
  const sortedList = list
    .slice()
    .sort(function(a, b) {
      const nameA = (a && a.name ? a.name : '').toLowerCase();
      const nameB = (b && b.name ? b.name : '').toLowerCase();
      if (nameA < nameB) {
        return -1;
      }
      if (nameA > nameB) {
        return 1;
      }
      return 0;
    });
  sortedList.forEach(function(action) {
    if (!action || !action.id) {
      return;
    }
    const option = document.createElement('option');
    option.value = action.id;
    const label = action.name ? action.name : 'Acción sin nombre';
    option.textContent = label + ' • ' + getActionTypeLabel(action.type);
    const tooltip = buildSavedActionTooltip(action);
    if (tooltip) {
      option.title = tooltip;
      tooltipMap[action.id] = tooltip;
    }
    select.appendChild(option);
    actionMap[action.id] = action;
  });
  select.disabled = false;
  updateSavedActionsEmptyState(true);
  const optionEntries = Array.prototype.filter.call(select.options, function(option) {
    return option && option.value;
  });
  const favoriteOption = optionEntries.find(function(option) {
    const entry = actionMap[option.value];
    return entry && entry.type === 'reportFavorite';
  });
  const fallbackOption = optionEntries.length ? optionEntries[0] : null;
  const preferredOption = favoriteOption || fallbackOption || null;
  let fallbackTooltipUpdater = null;
  if (typeof bindSelectTooltipWithMap === 'function') {
    bindSelectTooltipWithMap(select, tooltipMap);
  } else {
    fallbackTooltipUpdater = function() {
      const tip = tooltipMap[select.value] || '';
      if (tip) {
        select.dataset.tooltip = tip;
        select.setAttribute('title', tip);
        select.classList.add('tc-tooltip-target');
      } else {
        select.removeAttribute('data-tooltip');
        select.removeAttribute('title');
      }
    };
    fallbackTooltipUpdater();
    if (!select.dataset.tooltipBound) {
      select.addEventListener('change', fallbackTooltipUpdater);
      select.addEventListener('focus', fallbackTooltipUpdater);
      select.addEventListener('mouseenter', fallbackTooltipUpdater);
      select.dataset.tooltipBound = 'true';
    }
  }
  const normalized = selectedId ? String(selectedId) : '';
  let autoSelectedFirst = false;
  if (normalized) {
    const match = Array.prototype.find.call(select.options, function(item) {
      return item && item.value === normalized;
    });
    if (match) {
      select.value = normalized;
    } else if (opts.autoSelectFirst !== false) {
      if (preferredOption) {
        select.value = preferredOption.value;
        autoSelectedFirst = true;
      } else {
        select.value = '';
      }
    } else {
      select.value = '';
    }
  } else if (opts.autoSelectFirst !== false) {
    if (preferredOption) {
      select.value = preferredOption.value;
      autoSelectedFirst = true;
    } else {
      select.value = '';
    }
  } else {
    select.value = '';
  }
  if (!select.value && opts.previousValue) {
    const fallbackMatch = Array.prototype.find.call(select.options, function(option) {
      return option && option.value === String(opts.previousValue);
    });
    if (fallbackMatch) {
      select.value = fallbackMatch.value;
      autoSelectedFirst = false;
    }
  }
  if (typeof updateSelectTooltip === 'function') {
    updateSelectTooltip(select, tooltipMap);
  } else if (fallbackTooltipUpdater) {
    fallbackTooltipUpdater();
  }
  renderSavedActionsMenu(list, select.value || '');
  return {
    hasEntries: list.length > 0,
    selectedId: select.value || '',
    autoSelected: autoSelectedFirst
  };
}

async function syncSavedActionSelection(previousValue, options) {
  const opts = options || {};
  const select = document.getElementById('aiSavedActions');
  const finalValue = select ? select.value || '' : '';
  const hadEntries = !!(opts.hasEntries);
  if (!hadEntries) {
    clearSavedActionDetails();
    currentSavedActionId = '';
    return;
  }
  if (!finalValue) {
    clearSavedActionDetails();
    currentSavedActionId = '';
    return;
  }
  const shouldLoad =
    opts.forceLoad === true ||
    finalValue !== (previousValue || '') ||
    !currentSavedActionDetails ||
    (currentSavedActionDetails && currentSavedActionDetails.id !== finalValue);
  if (!shouldLoad) {
    return;
  }
  await loadSavedActionDetails(finalValue);
}

function clearSavedActionDetails(options) {
  const opts = options || {};
  currentSavedActionDetails = null;
  exitReportFavoriteEditor({
    keepVisible: false,
    keepMounted: false,
    keepHeader: !!opts.keepHeader,
    clearFavorite: !opts.keepFavorite
  });
  const card = document.getElementById('aiActionDetailCard');
  if (card) {
    card.innerHTML = '';
    card.classList.add('ai-hidden');
  }
  const editor = document.getElementById('aiActionEditor');
  if (editor) {
    editor.classList.add('ai-hidden');
  }
  const container = document.getElementById('aiActionDetails');
  if (container) {
    container.classList.add('ai-hidden');
  }
  updateSavedActionsTriggerLabel('', {
    totalFavorites: countReportFavoriteActions(savedActionsCache)
  });
}

function formatActionChannel(value) {
  if (!value) {
    return '';
  }
  const key = String(value).toLowerCase();
  return ACTION_CHANNEL_LABELS[key] || value;
}

function buildReportFavoriteSummary(action) {
  if (!action) {
    return '';
  }
  const parts = [];
  if (action.format) {
    const formatLabel = REPORT_FORMAT_LABELS_IN_ACTIONS[action.format] || action.format;
    parts.push('Formato: ' + formatLabel);
  }
  if (Array.isArray(action.featureDetails) && action.featureDetails.length > 0) {
    const labels = action.featureDetails
      .map(function(detail) {
        if (!detail || !detail.feature) {
          return '';
        }
        const featureId = detail.feature;
        const baseLabel = REPORT_FEATURE_LABELS_IN_ACTIONS[featureId] || featureId;
        const quantity = detail.quantity;
        if (typeof quantity === 'number' && quantity > 1) {
          return baseLabel + ' × ' + quantity;
        }
        return baseLabel;
      })
      .filter(function(label) {
        return !!label;
      });
    if (labels.length) {
      parts.push('Características: ' + labels.join(', '));
    }
  } else if (Array.isArray(action.features) && action.features.length > 0) {
    const labels = action.features
      .map(function(feature) {
        return REPORT_FEATURE_LABELS_IN_ACTIONS[feature] || feature;
      })
      .filter(function(label) {
        return !!label;
      });
    if (labels.length) {
      parts.push('Características: ' + labels.join(', '));
    }
  }
  if (Array.isArray(action.channels) && action.channels.length > 0) {
    const channelLabels = action.channels
      .map(function(channel) {
        return formatActionChannel(channel);
      })
      .filter(function(label) {
        return !!label;
      });
    if (channelLabels.length) {
      parts.push('Canales: ' + channelLabels.join(', '));
    }
  }
  if (action.fileName) {
    parts.push('Archivo: ' + action.fileName + (action.fileExtension ? '.' + action.fileExtension : ''));
  }
  if (action.descriptionEnabled && action.descriptionText) {
    parts.push('Descripción del reporte incluida.');
  }
  if (action.appendDateToFile) {
    parts.push('Se agregará la fecha al nombre del archivo.');
  }
  return parts.join('\n');
}

function buildActionDetailCard(action, options) {
  const opts = options || {};
  const card = document.createElement('div');
  card.className = 'ai-action-card';
  const title = document.createElement('h4');
  title.textContent = action && action.name ? action.name : 'Acción sin nombre';
  card.appendChild(title);
  const meta = document.createElement('div');
  meta.className = 'ai-action-meta';
  const typeBadge = document.createElement('span');
  typeBadge.textContent = getActionTypeLabel(action && action.type);
  meta.appendChild(typeBadge);
  if (action && action.updatedAt) {
    const updated = document.createElement('span');
    updated.textContent = 'Actualizado: ' + action.updatedAt;
    meta.appendChild(updated);
  }
  if (action && action.createdAt) {
    const created = document.createElement('span');
    created.textContent = 'Creado: ' + action.createdAt;
    meta.appendChild(created);
  }
  card.appendChild(meta);
  if (action && action.description) {
    const description = document.createElement('p');
    description.className = 'ai-action-summary';
    description.textContent = action.description;
    card.appendChild(description);
  }
  if (action && action.type === 'table') {
    const extra = document.createElement('p');
    extra.className = 'ai-action-summary';
    const rangeInfo = [];
    if (action.sheetName) {
      rangeInfo.push('Hoja: ' + action.sheetName);
    }
    if (action.rangeA1) {
      rangeInfo.push('Rango: ' + action.rangeA1);
    }
    if (action.rows) {
      rangeInfo.push('Filas: ' + action.rows);
    }
    if (action.cols) {
      rangeInfo.push('Columnas: ' + action.cols);
    }
    extra.textContent = rangeInfo.join(' • ');
    card.appendChild(extra);
  } else if (action && action.type === 'reportFavorite') {
    const summaryText = buildReportFavoriteSummary(action);
    if (summaryText) {
      const summary = document.createElement('p');
      summary.className = 'ai-action-summary';
      summary.textContent = summaryText;
      card.appendChild(summary);
    }
    if (Array.isArray(action.tables) && action.tables.length > 0) {
      const tablesInfo = document.createElement('p');
      tablesInfo.className = 'ai-action-summary';
      tablesInfo.textContent = 'Tablas vinculadas: ' + action.tables.join(', ');
      card.appendChild(tablesInfo);
    }
    if (opts.mode === 'fallback') {
      const notice = document.createElement('p');
      notice.className = 'ai-action-summary';
      notice.textContent =
        'No se pudo mostrar el editor interactivo. Abrí el reporte en el panel IA para modificarlo.';
      card.appendChild(notice);
    }
  }
  if (opts.includeActions !== false) {
    const buttons = document.createElement('div');
    buttons.className = 'ai-action-buttons';
    const editBtn = document.createElement('button');
    editBtn.type = 'button';
    editBtn.className = 'btn-secondary';
    if (action && action.type === 'table') {
      editBtn.textContent = 'Editar tabla';
    } else {
      editBtn.textContent = 'Editar en panel IA';
    }
    editBtn.addEventListener('click', function() {
      openActionForEditing(action);
    });
    buttons.appendChild(editBtn);
    card.appendChild(buttons);
  }
  return card;
}

function populateActionDetailCard(action, options) {
  const wrapper = document.getElementById('aiActionDetailCard');
  if (!wrapper) {
    return;
  }
  wrapper.innerHTML = '';
  if (!action) {
    wrapper.classList.add('ai-hidden');
    return;
  }
  wrapper.appendChild(buildActionDetailCard(action, options));
  wrapper.classList.remove('ai-hidden');
}

function buildSavedActionTooltip(action) {
  if (!action) {
    return '';
  }
  const parts = [];
  const typeLabel = getActionTypeLabel(action.type);
  if (action.description) {
    parts.push(String(action.description));
  }
  if (action.type === 'reportFavorite') {
    const summary = buildReportFavoriteSummary(action);
    if (summary) {
      parts.push(summary);
    }
  } else if (action.type === 'table') {
    const meta = [];
    if (action.sheetName) {
      meta.push('Hoja: ' + action.sheetName);
    }
    if (action.rangeA1) {
      meta.push('Rango: ' + action.rangeA1);
    }
    if (action.rows) {
      meta.push('Filas: ' + action.rows);
    }
    if (action.cols) {
      meta.push('Columnas: ' + action.cols);
    }
    if (meta.length) {
      parts.push(meta.join(' • '));
    }
  }
  if (!parts.length) {
    parts.push('Tipo: ' + typeLabel);
  } else {
    parts.unshift('Tipo: ' + typeLabel);
  }
  return parts.join('\n');
}

function updateSavedActionsTriggerLabel(actionId, options) {
  const trigger = document.getElementById('aiSavedActionsTrigger');
  if (!trigger) {
    return;
  }
  const opts = options || {};
  const totalFavorites =
    typeof opts.totalFavorites === 'number'
      ? opts.totalFavorites
      : countReportFavoriteActions(savedActionsCache);
  const placeholder = opts.placeholder || 'Elegí un reporte favorito';
  const labelNode = trigger.querySelector('.ai-saved-actions-trigger-label');
  const hintNode = trigger.querySelector('.ai-saved-actions-trigger-hint');
  let labelText = placeholder;
  let hintText = 'Mostrar favoritos guardados';
  let appliedId = '';
  if (totalFavorites <= 0) {
    hintText = 'Agregá un reporte a favoritos';
  }
  if (!actionId && totalFavorites > 0) {
    hintText =
      totalFavorites === 1
        ? '1 favorito disponible'
        : totalFavorites + ' favoritos disponibles';
  }
  if (actionId) {
    const match = findSavedActionInCache(actionId);
    if (match && match.type === 'reportFavorite') {
      labelText = match.name ? match.name : 'Acción sin nombre';
      hintText = getActionTypeLabel(match.type);
      appliedId = actionId;
    }
  }
  if (labelNode) {
    labelNode.textContent = labelText;
  }
  if (hintNode) {
    hintNode.textContent = hintText;
  }
  trigger.dataset.selectedId = appliedId;
}

function closeSavedActionsMenu() {
  const menu = document.getElementById('aiSavedActionsMenu');
  const trigger = document.getElementById('aiSavedActionsTrigger');
  if (menu) {
    menu.classList.add('ai-hidden');
  }
  if (trigger) {
    trigger.setAttribute('aria-expanded', 'false');
  }
  savedActionsMenuOpen = false;
}

function openSavedActionsMenu() {
  const menu = document.getElementById('aiSavedActionsMenu');
  const trigger = document.getElementById('aiSavedActionsTrigger');
  if (!menu || !trigger || trigger.disabled) {
    return;
  }
  menu.classList.remove('ai-hidden');
  trigger.setAttribute('aria-expanded', 'true');
  savedActionsMenuOpen = true;
  const selected = menu.querySelector('.ai-saved-actions-item--selected');
  const focusTarget = selected || menu.querySelector('.ai-saved-actions-item');
  if (focusTarget) {
    focusTarget.focus();
  }
}

function toggleSavedActionsMenu() {
  if (savedActionsMenuOpen) {
    closeSavedActionsMenu();
  } else {
    openSavedActionsMenu();
  }
}

function handleSavedActionsMenuOutsideClick(event) {
  if (!savedActionsMenuOpen) {
    return;
  }
  const menu = document.getElementById('aiSavedActionsMenu');
  const trigger = document.getElementById('aiSavedActionsTrigger');
  if (!menu || !trigger) {
    return;
  }
  const target = event.target;
  if (menu.contains(target) || trigger.contains(target)) {
    return;
  }
  closeSavedActionsMenu();
}

function handleSavedActionsMenuKeydown(event) {
  if (!savedActionsMenuOpen && event.target && event.target.id === 'aiSavedActionsTrigger') {
    if (event.key === 'ArrowDown' || event.key === 'Enter' || event.key === ' ') {
      event.preventDefault();
      openSavedActionsMenu();
    }
    return;
  }
  if (savedActionsMenuOpen) {
    const menu = document.getElementById('aiSavedActionsMenu');
    if (menu && event.target && menu.contains(event.target)) {
      const items = Array.prototype.filter.call(menu.querySelectorAll('.ai-saved-actions-item'), function(item) {
        return !item.disabled;
      });
      if (items.length) {
        const currentIndex = items.indexOf(event.target);
        if (event.key === 'ArrowDown') {
          event.preventDefault();
          const nextIndex = currentIndex >= 0 && currentIndex < items.length - 1 ? currentIndex + 1 : 0;
          items[nextIndex].focus();
          return;
        }
        if (event.key === 'ArrowUp') {
          event.preventDefault();
          const prevIndex = currentIndex > 0 ? currentIndex - 1 : items.length - 1;
          items[prevIndex].focus();
          return;
        }
      }
    }
  }
  if (event.key === 'Escape' && savedActionsMenuOpen) {
    closeSavedActionsMenu();
    const trigger = document.getElementById('aiSavedActionsTrigger');
    if (trigger) {
      trigger.focus();
    }
  }
}

function selectSavedActionFromMenu(actionId) {
  const select = document.getElementById('aiSavedActions');
  if (select) {
    select.value = actionId || '';
    const changeEvent = new Event('change', { bubbles: true });
    select.dispatchEvent(changeEvent);
  } else if (actionId) {
    loadSavedActionDetails(actionId);
  }
  const totalFavorites = countReportFavoriteActions(savedActionsCache);
  updateSavedActionsTriggerLabel(actionId, {
    totalFavorites: totalFavorites
  });
  renderSavedActionsMenu(savedActionsCache, actionId);
  closeSavedActionsMenu();
}

function renderSavedActionsMenu(actions, selectedId) {
  const menu = document.getElementById('aiSavedActionsMenu');
  const trigger = document.getElementById('aiSavedActionsTrigger');
  if (!menu || !trigger) {
    return;
  }
  const list = Array.isArray(actions) ? actions : [];
  const favorites = list.filter(function(action) {
    return action && action.type === 'reportFavorite';
  });
  const normalizedSelected = selectedId ? String(selectedId) : '';
  const selectedFavoriteId = favorites.some(function(action) {
    return action && action.id === normalizedSelected;
  })
    ? normalizedSelected
    : '';
  menu.innerHTML = '';
  if (!favorites.length) {
    const emptyState = document.createElement('div');
    emptyState.className = 'ai-saved-actions-empty';
    emptyState.textContent = 'No hay reportes favoritos guardados todavía.';
    menu.appendChild(emptyState);
    trigger.disabled = true;
    updateSavedActionsTriggerLabel('', {
      totalFavorites: 0,
      placeholder: 'No hay favoritos guardados'
    });
    updateSavedActionsEmptyState(false);
    closeSavedActionsMenu();
    return;
  }
  trigger.disabled = false;
  favorites
    .slice()
    .sort(function(a, b) {
      const nameA = (a && a.name ? a.name : '').toLowerCase();
      const nameB = (b && b.name ? b.name : '').toLowerCase();
      if (nameA < nameB) {
        return -1;
      }
      if (nameA > nameB) {
        return 1;
      }
      return 0;
    })
    .forEach(function(action) {
      if (!action || !action.id) {
        return;
      }
      const item = document.createElement('button');
      item.type = 'button';
      item.className = 'ai-saved-actions-item';
      item.dataset.actionId = action.id;
      item.setAttribute('role', 'option');
      item.textContent = action.name ? action.name : 'Acción sin nombre';
      const tooltip = buildSavedActionTooltip(action);
      if (tooltip) {
        item.title = tooltip.replace(/\n/g, ' • ');
      }
      if (action.id === selectedFavoriteId) {
        item.classList.add('ai-saved-actions-item--selected');
        item.setAttribute('aria-selected', 'true');
      } else {
        item.setAttribute('aria-selected', 'false');
      }
      item.addEventListener('click', function() {
        selectSavedActionFromMenu(action.id);
      });
      item.addEventListener('keydown', function(event) {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          selectSavedActionFromMenu(action.id);
        }
      });
      menu.appendChild(item);
    });
  updateSavedActionsTriggerLabel(selectedFavoriteId, {
    totalFavorites: favorites.length
  });
  updateSavedActionsEmptyState(true);
}

function bindSavedActionsMenuEvents() {
  if (savedActionsMenuInitialized) {
    return;
  }
  const trigger = document.getElementById('aiSavedActionsTrigger');
  if (!trigger) {
    return;
  }
  trigger.addEventListener('click', function(event) {
    event.preventDefault();
    toggleSavedActionsMenu();
  });
  trigger.addEventListener('keydown', handleSavedActionsMenuKeydown);
  document.addEventListener('click', handleSavedActionsMenuOutsideClick);
  document.addEventListener('keydown', handleSavedActionsMenuKeydown);
  savedActionsMenuInitialized = true;
}

async function renderSavedActionDetails(action) {
  const container = document.getElementById('aiActionDetails');
  if (!container) {
    return;
  }
  if (!action || !action.id) {
    clearSavedActionDetails();
    return;
  }
  currentSavedActionDetails = action;
  updateSavedActionsTriggerLabel(action.id, {
    totalFavorites: countReportFavoriteActions(savedActionsCache)
  });
  container.classList.remove('ai-hidden');
  if (action.type === 'reportFavorite') {
    const cardWrapper = document.getElementById('aiActionDetailCard');
    if (cardWrapper) {
      cardWrapper.innerHTML = '';
      cardWrapper.classList.add('ai-hidden');
    }
    const loaded = await enterReportFavoriteEditor(action);
    if (!loaded) {
      populateActionDetailCard(action, { mode: 'fallback' });
    }
    return;
  }
  exitReportFavoriteEditor({ clearFavorite: true });
  populateActionDetailCard(action);
}

async function loadSavedActionDetails(actionId) {
  if (!actionId) {
    clearSavedActionDetails();
    currentSavedActionId = '';
    return;
  }
  let response;
  try {
    response = await callServerFunction('getSavedActionDetails', actionId);
  } catch (err) {
    await showMessageModal(
      'No se pudo cargar la acción seleccionada: ' + (err && err.message ? err.message : err),
      {
        title: 'Error al cargar',
        variant: 'error'
      }
    );
    return;
  }
  if (!response || response.error) {
    await showMessageModal((response && response.error) || 'No se encontró la acción seleccionada.', {
      title: 'Acción no disponible',
      variant: 'warning'
    });
    clearSavedActionDetails();
    currentSavedActionId = '';
    return;
  }
  currentSavedActionId = actionId;
  await renderSavedActionDetails(response);
}

async function ensureSavedActionsCache(options) {
  const opts = options || {};
  if (!opts.force && savedActionsLoaded) {
    return savedActionsCache;
  }
  let result;
  try {
    result = await callServerFunction('listSavedActions');
  } catch (err) {
    savedActionsLoaded = false;
    throw err;
  }
  savedActionsCache = Array.isArray(result) ? result.slice() : [];
  savedActionsLoaded = true;
  dispatchSavedActionsUpdated();
  return savedActionsCache;
}

async function refreshSavedActions(options) {
  const opts = options || {};
  const select = document.getElementById('aiSavedActions');
  const previousValue = select ? select.value || '' : '';
  const targetId = opts.selectId || previousValue || currentSavedActionId || '';
  const autoSelectFirst = opts.autoSelectFirst !== false;
  const forceLoad = opts.forceLoad === true;
  if (!opts.force && savedActionsLoaded && !loadingSavedActions) {
    const renderInfo = renderSavedActionsSelect(savedActionsCache, targetId, {
      autoSelectFirst: autoSelectFirst,
      previousValue: previousValue
    });
    await syncSavedActionSelection(previousValue, {
      hasEntries: renderInfo.hasEntries,
      forceLoad: forceLoad
    });
    dispatchSavedActionsUpdated();
    return savedActionsCache;
  }
  if (loadingSavedActions) {
    queuedSavedActionsRefresh = {
      selectId: targetId,
      force: true,
      autoSelectFirst: autoSelectFirst,
      forceLoad: forceLoad
    };
    return;
  }
  loadingSavedActions = true;
  try {
    const result = await callServerFunction('listSavedActions');
    savedActionsCache = Array.isArray(result) ? result.slice() : [];
    savedActionsLoaded = true;
    const renderInfo = renderSavedActionsSelect(savedActionsCache, targetId, {
      autoSelectFirst: autoSelectFirst,
      previousValue: previousValue
    });
    await syncSavedActionSelection(previousValue, {
      hasEntries: renderInfo.hasEntries,
      forceLoad: forceLoad
    });
    dispatchSavedActionsUpdated();
  } catch (err) {
    savedActionsCache = [];
    savedActionsLoaded = false;
    renderSavedActionsSelect([], '', { autoSelectFirst: false, previousValue: previousValue });
    await syncSavedActionSelection(previousValue, { hasEntries: false, forceLoad: true });
    currentSavedActionId = '';
    dispatchSavedActionsUpdated();
    await showMessageModal(
      'No se pudieron obtener las acciones guardadas: ' + (err && err.message ? err.message : err),
      {
        title: 'Error al listar acciones',
        variant: 'error'
      }
    );
  } finally {
    loadingSavedActions = false;
    if (queuedSavedActionsRefresh) {
      const next = queuedSavedActionsRefresh;
      queuedSavedActionsRefresh = null;
      refreshSavedActions(next);
    }
  }
}

function notifySavedActionMutation(detail) {
  const payload = detail && typeof detail === 'object' ? detail : {};
  if (!savedActionsPanelInitialized) {
    pendingSavedActionMutation = payload;
  }
  document.dispatchEvent(new CustomEvent('tc:savedActionMutated', { detail: payload }));
}

function requestSavedActionsRefresh(options) {
  const opts = options || {};
  const request = {
    selectId: opts.selectId || '',
    force: opts.force === true,
    autoSelectFirst: opts.autoSelectFirst !== false,
    forceLoad: opts.forceLoad === true,
    delay: typeof opts.delay === 'number' ? opts.delay : 200
  };
  if (savedActionsRefreshTimer) {
    window.clearTimeout(savedActionsRefreshTimer);
    savedActionsRefreshTimer = 0;
  }
  if (request.delay <= 0) {
    refreshSavedActions(request);
    return;
  }
  savedActionsRefreshTimer = window.setTimeout(function() {
    savedActionsRefreshTimer = 0;
    refreshSavedActions(request);
  }, request.delay);
}

function handleSavedActionMutationEvent(event) {
  const detail = event && event.detail ? event.detail : {};
  requestSavedActionsRefresh({
    selectId: detail && detail.id ? detail.id : '',
    force: detail.force !== false,
    delay: typeof detail.delay === 'number' ? detail.delay : 200,
    autoSelectFirst: detail.autoSelectFirst !== false,
    forceLoad: detail.forceLoad === true
  });
}

function initSavedActionsPanel() {
  if (savedActionsPanelInitialized) {
    return;
  }
  savedActionsPanelInitialized = true;
  initReportEditorPortal();
  bindSavedActionsMenuEvents();
  const cardWrapper = document.getElementById('aiActionDetailCard');
  if (cardWrapper) {
    cardWrapper.classList.add('ai-hidden');
  }
  const editor = document.getElementById('aiActionEditor');
  if (editor) {
    editor.classList.add('ai-hidden');
  }
  const savedActionsSelect = document.getElementById('aiSavedActions');
  if (savedActionsSelect) {
    savedActionsSelect.addEventListener('change', function() {
      loadSavedActionDetails(savedActionsSelect.value);
    });
  }
  const savedActionsRefreshBtn = document.getElementById('aiSavedActionsRefreshBtn');
  if (savedActionsRefreshBtn) {
    savedActionsRefreshBtn.addEventListener('click', function() {
      requestSavedActionsRefresh({
        selectId: typeof getCurrentSavedActionId === 'function' ? getCurrentSavedActionId() : '',
        force: true,
        delay: 0,
        forceLoad: true
      });
    });
  }
  document.addEventListener('tc:savedActionMutated', handleSavedActionMutationEvent);
  if (pendingSavedActionMutation) {
    handleSavedActionMutationEvent({ detail: pendingSavedActionMutation });
    pendingSavedActionMutation = null;
  }
  requestSavedActionsRefresh({ delay: 0, force: true });
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initSavedActionsPanel);
} else {
  initSavedActionsPanel();
}

if (typeof window !== 'undefined') {
  window.getSavedActionsSnapshot = getSavedActionsSnapshot;
  window.getCurrentSavedActionId = getCurrentSavedActionId;
  window.refreshSavedActions = refreshSavedActions;
  window.ensureSavedActionsCache = ensureSavedActionsCache;
  window.notifyActionsTabChanged = notifyActionsTabChanged;
  window.requestSavedActionsRefresh = requestSavedActionsRefresh;
  window.notifySavedActionMutation = notifySavedActionMutation;
}
</script>
