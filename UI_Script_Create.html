<script>
let currentHeaders = [];
let rangeInfo = null;
let createFormulaPreference = true;
let createFormatDirty = false;
let pendingFormatState = { applied: false, range: null };
const WORD_TITLE_AUTO_PLACEHOLDER = 'Título generado automáticamente';
const WORD_WEB_SOURCE_LIMIT = 10;
const WORD_AUTO_COMMENT_KEYS = ['insights', 'risks', 'followUp', 'custom'];
let wordContextWebSources = [];
let wordContextWebCollapsed = false;
const WORD_LANGUAGE_DEFAULT = 'auto';
const WORD_TONE_DEFAULT = 'neutral';
const WORD_PROFILE_DEFAULT = 'auto';
const WORD_LENGTH_DEFAULT = 'auto';
const WORD_STRUCTURE_KEYS = ['wordIntro', 'wordConclusion'];

function isWordThemeActiveForCreate() {
        return document.body && document.body.classList.contains('theme-wordcrafter');
      }

function isWordRangeSelectionEnabled() {
        if (!isWordThemeActiveForCreate()) {
          return true;
        }
        const toggle = document.getElementById('wordUseRangeToggle');
        return !toggle || toggle.checked;
      }

function syncCreateMetadataForTheme() {
        const isWordTheme = isWordThemeActiveForCreate();
        const nameLabel = document.getElementById('createNameLabel');
        if (nameLabel) {
          const targetText = isWordTheme
            ? nameLabel.dataset && nameLabel.dataset.wordText
            : nameLabel.dataset && nameLabel.dataset.tableText;
          if (typeof targetText === 'string') {
            nameLabel.textContent = targetText;
          }
        }
        const nameInput = document.getElementById('tableName');
        if (nameInput) {
          const placeholder = isWordTheme
            ? nameInput.dataset && nameInput.dataset.wordPlaceholder
            : nameInput.dataset && nameInput.dataset.tablePlaceholder;
          if (typeof placeholder === 'string') {
            nameInput.placeholder = placeholder;
          }
        }
        const descGroup = document.getElementById('createDescriptionGroup');
        const descLabel = document.getElementById('createDescriptionLabel');
        const descField = document.getElementById('tableDesc');
        const shouldShowDescription = !isWordTheme;
        if (descGroup) {
          descGroup.style.display = shouldShowDescription ? '' : 'none';
        }
        if (descLabel) {
          const labelText = shouldShowDescription
            ? (descLabel.dataset && descLabel.dataset.tableText) || descLabel.textContent
            : (descLabel.dataset && descLabel.dataset.wordText) || '';
          descLabel.textContent = labelText;
        }
        if (descField) {
          const descPlaceholder = shouldShowDescription
            ? (descField.dataset && descField.dataset.tablePlaceholder) || ''
            : (descField.dataset && descField.dataset.wordPlaceholder) || '';
          descField.placeholder = descPlaceholder;
        }
      }

function syncCreateRangeModeUI() {
        const isWordTheme = isWordThemeActiveForCreate();
        const useRange = isWordRangeSelectionEnabled();
        const toggleRow = document.getElementById('wordRangeToggleRow');
        const rangeFields = document.getElementById('wordRangeFields');
        const legend = document.getElementById('wordRangeLegend');
        const cursorNotice = document.getElementById('wordCursorNotice');
        const refreshBtn = document.getElementById('refreshRangeBtn');
        const rangeInput = document.getElementById('rangeInput');
        const applyBtn = document.getElementById('applyFormatBtn');
        const headerOptions = document.getElementById('tableHeaderOptions');
        const saveBtn = document.getElementById('saveTableBtn');
        const formulaToggleRow = document.getElementById('createFormulaToggleRow');
        const formulaToggle = document.getElementById('createUpdateFormulaRefs');
        if (toggleRow) {
          toggleRow.style.display = isWordTheme ? 'flex' : 'none';
        }
        if (rangeFields) {
          rangeFields.style.display = !isWordTheme || useRange ? '' : 'none';
        }
        if (legend) {
          legend.style.display = isWordTheme && useRange ? 'block' : 'none';
        }
        if (cursorNotice) {
          cursorNotice.style.display = isWordTheme && !useRange ? 'block' : 'none';
        }
        if (refreshBtn) {
          refreshBtn.disabled = Boolean(isWordTheme && !useRange);
          if (refreshBtn.disabled) {
            refreshBtn.setAttribute('aria-disabled', 'true');
          } else {
            refreshBtn.removeAttribute('aria-disabled');
          }
        }
        if (rangeInput) {
          const shouldDisable = Boolean(isWordTheme && !useRange);
          rangeInput.disabled = shouldDisable;
          if (shouldDisable) {
            rangeInput.setAttribute('aria-disabled', 'true');
          } else {
            rangeInput.removeAttribute('aria-disabled');
          }
        }
        if (applyBtn) {
          const shouldDisableApply = Boolean(isWordTheme && !useRange);
          applyBtn.disabled = shouldDisableApply;
          const targetLabel = isWordTheme
            ? applyBtn.dataset && applyBtn.dataset.wordLabel ? applyBtn.dataset.wordLabel : 'Generar texto'
            : applyBtn.dataset && applyBtn.dataset.tableLabel ? applyBtn.dataset.tableLabel : 'Aplicar formato';
          if (typeof targetLabel === 'string') {
            applyBtn.textContent = targetLabel;
          }
          if (shouldDisableApply) {
            applyBtn.setAttribute('aria-disabled', 'true');
          } else {
            applyBtn.removeAttribute('aria-disabled');
          }
        }
        if (headerOptions) {
          headerOptions.style.display = isWordTheme ? 'none' : '';
        }
        if (saveBtn) {
          if (isWordTheme) {
            saveBtn.style.display = 'none';
            saveBtn.disabled = true;
            saveBtn.setAttribute('aria-disabled', 'true');
          } else {
            saveBtn.style.display = '';
            saveBtn.disabled = false;
            saveBtn.removeAttribute('aria-disabled');
          }
        }
        if (formulaToggleRow) {
          formulaToggleRow.style.display = isWordTheme ? 'none' : '';
        }
        if (formulaToggle) {
          const shouldDisableFormula = Boolean(isWordTheme);
          formulaToggle.disabled = shouldDisableFormula;
          if (shouldDisableFormula) {
            formulaToggle.setAttribute('aria-disabled', 'true');
          } else {
            formulaToggle.removeAttribute('aria-disabled');
          }
        }
        syncCreateMetadataForTheme();
      }

function applyCreateFormulaPreference(value) {
        const normalized = normalizeFormulaPreference(value);
        createFormulaPreference = normalized;
        const toggle = document.getElementById('createUpdateFormulaRefs');
        if (toggle) {
          toggle.checked = normalized;
        }
        if (rangeInfo && typeof rangeInfo === 'object') {
          rangeInfo.updateFormulaReferences = normalized;
        }
        return normalized;
      }

function getCreateFormulaPreference() {
        const toggle = document.getElementById('createUpdateFormulaRefs');
        if (toggle) {
          return !!toggle.checked;
        }
        if (typeof createFormulaPreference === 'boolean') {
          return createFormulaPreference;
        }
        if (rangeInfo && typeof rangeInfo.updateFormulaReferences === 'boolean') {
          return rangeInfo.updateFormulaReferences;
        }
        return true;
      }

function bindCreateFormulaToggle() {
        const toggle = document.getElementById('createUpdateFormulaRefs');
        if (toggle && toggle.dataset.toggleBound !== 'true') {
          toggle.addEventListener('change', function() {
            applyCreateFormulaPreference(this.checked);
          });
          toggle.dataset.toggleBound = 'true';
        }
      }

function resetWordFormatInputs(containerId) {
        const container = document.getElementById(containerId);
        if (!container) {
          return;
        }
        const inputs = container.querySelectorAll('input, select, textarea');
        inputs.forEach(function(control) {
          if (control.type === 'checkbox') {
            control.checked = control.defaultChecked;
            return;
          }
          const fallback = control.dataset && control.dataset.defaultValue !== undefined ? control.dataset.defaultValue : control.defaultValue;
          if (fallback !== undefined) {
            control.value = fallback;
          } else {
            control.value = '';
          }
        });
      }

function resetWordTextOptions() {
        const autoToggle = document.getElementById('wordAutoTitleToggle');
        const manualTitleToggle = document.getElementById('wordManualTitleFormatToggle');
        const manualBodyToggle = document.getElementById('wordManualBodyFormatToggle');
        const titleInput = document.getElementById('tableName');
        if (autoToggle) {
          autoToggle.checked = false;
        }
        if (manualTitleToggle) {
          manualTitleToggle.checked = false;
        }
        if (manualBodyToggle) {
          manualBodyToggle.checked = false;
        }
        if (titleInput) {
          if (titleInput.dataset && titleInput.dataset.autoFilled === 'true') {
            titleInput.value = titleInput.dataset.prevManualValue || '';
            delete titleInput.dataset.autoFilled;
            delete titleInput.dataset.prevManualValue;
          }
          titleInput.disabled = false;
          titleInput.removeAttribute('aria-disabled');
        }
        resetWordFormatInputs('wordTitleFormatOptions');
        resetWordFormatInputs('wordBodyFormatOptions');
        const extraFields = [
          'wordBodyContext'
        ];
        extraFields.forEach(function(fieldId) {
          const el = document.getElementById(fieldId);
          if (el) {
            const fallback = el.dataset && el.dataset.defaultValue !== undefined ? el.dataset.defaultValue : el.defaultValue;
            if (fallback !== undefined) {
              el.value = fallback;
            } else {
              el.value = '';
            }
          }
        });
        const toneSelect = document.getElementById('wordBodyTone');
        if (toneSelect) {
          toneSelect.value = WORD_TONE_DEFAULT;
        }
        const toneCustom = document.getElementById('wordBodyToneCustom');
        if (toneCustom) {
          toneCustom.value = '';
        }
        const languageSelect = document.getElementById('wordBodyLanguage');
        if (languageSelect) {
          languageSelect.value = WORD_LANGUAGE_DEFAULT;
        }
        const languageCustom = document.getElementById('wordBodyLanguageCustom');
        if (languageCustom) {
          languageCustom.value = '';
        }
        const profileSelect = document.getElementById('wordBodyProfile');
        if (profileSelect) {
          profileSelect.value = WORD_PROFILE_DEFAULT;
        }
        const profileNote = document.getElementById('wordBodyProfileNote');
        if (profileNote) {
          profileNote.value = '';
        }
        const lengthSelect = document.getElementById('wordBodyLength');
        if (lengthSelect) {
          lengthSelect.value = WORD_LENGTH_DEFAULT;
        }
        WORD_STRUCTURE_KEYS.forEach(function(key) {
          const toggle = document.getElementById(key + 'Toggle');
          if (toggle) {
            toggle.checked = false;
          }
          const descToggle = document.getElementById(key + 'DescriptionToggle');
          if (descToggle) {
            descToggle.checked = false;
          }
          const descField = document.getElementById(key + 'Description');
          if (descField) {
            descField.value = '';
          }
        });
        wordContextWebSources = [];
        wordContextWebCollapsed = false;
        renderWordContextWebSources();
        const webToggle = document.getElementById('wordContextWebToggle');
        if (webToggle) {
          webToggle.checked = false;
        }
        updateWordContextWebVisibility();
        resetWordAutoComments();
        syncWordStructureSections();
        syncWordLanguageControls();
        syncWordToneControls();
        syncWordProfileControls();
        refreshWordPreviews();
      }

function updateWordFormatFlagClasses(container) {
        if (!container) {
          return;
        }
        const flagLabels = container.querySelectorAll('.word-format-flag');
        flagLabels.forEach(function(label) {
          const control = label.querySelector('input');
          label.classList.toggle('is-active', Boolean(control && control.checked));
        });
      }

function updateWordPreview(kind) {
        const previewId = kind === 'body' ? 'wordBodyPreview' : 'wordTitlePreview';
        const preview = document.getElementById(previewId);
        if (!preview) {
          return;
        }
        const prefix = kind === 'body' ? 'wordBody' : 'wordTitle';
        const colorInput = document.getElementById(prefix + 'Color');
        const sizeInput = document.getElementById(prefix + 'FontSize');
        const alignSelect = document.getElementById(prefix + 'Alignment');
        const fontFamilySelect = document.getElementById(prefix + 'FontFamily');
        const boldToggle = document.getElementById(prefix + 'Bold');
        const underlineToggle = document.getElementById(prefix + 'Underline');
        const italicsToggle = document.getElementById(prefix + 'Italics');
        const uppercaseToggle = kind === 'title' ? document.getElementById('wordTitleUppercase') : null;
        const highlightToggle = kind === 'body' ? document.getElementById('wordBodyHighlight') : null;
        const lineSpacingSelect = kind === 'body' ? document.getElementById('wordBodyLineSpacing') : null;
        const formatContainer = document.getElementById(prefix + 'FormatOptions');

        if (!preview.dataset.baseText) {
          preview.dataset.baseText = 'Ejemplo';
        }

        if (colorInput) {
          preview.style.color = colorInput.value || '';
        }
        preview.style.removeProperty('font-size');
        if (!preview.dataset.lockedFontSize) {
          try {
            const computed = window.getComputedStyle(preview).fontSize;
            if (computed) {
              preview.dataset.lockedFontSize = computed;
            }
          } catch (err) {
            preview.dataset.lockedFontSize = '';
          }
        }
        if (preview.dataset.lockedFontSize) {
          preview.style.fontSize = preview.dataset.lockedFontSize;
        }
        if (alignSelect) {
          preview.style.textAlign = alignSelect.value || '';
        }
        if (fontFamilySelect && fontFamilySelect.value) {
          preview.style.fontFamily = fontFamilySelect.value;
        }
        if (boldToggle) {
          preview.style.fontWeight = boldToggle.checked ? '700' : (kind === 'title' ? '600' : '500');
        }
        const decorations = [];
        if (underlineToggle && underlineToggle.checked) {
          decorations.push('underline');
        }
        if (italicsToggle) {
          preview.style.fontStyle = italicsToggle.checked ? 'italic' : 'normal';
        }
        if (uppercaseToggle) {
          preview.style.textTransform = uppercaseToggle.checked ? 'uppercase' : 'none';
        }
        if (kind === 'body') {
          const textSpan = preview.querySelector('.word-preview-text');
          if (textSpan) {
            textSpan.textContent = preview.dataset.baseText;
          } else {
            preview.textContent = preview.dataset.baseText;
          }
        } else {
          const baseText = uppercaseToggle && uppercaseToggle.checked
            ? preview.dataset.baseText.toUpperCase()
            : preview.dataset.baseText;
          preview.textContent = baseText;
        }
        if (kind === 'body' && highlightToggle) {
          preview.classList.toggle('word-preview-highlighted', highlightToggle.checked);
        }
        if (lineSpacingSelect && lineSpacingSelect.value) {
          preview.style.lineHeight = lineSpacingSelect.value;
        }
        preview.style.textDecoration = decorations.join(' ');
        updateWordFormatFlagClasses(formatContainer);
      }

function refreshWordPreviews() {
        updateWordPreview('title');
        updateWordPreview('body');
      }

function createEmptyWordWebSourceEntry() {
        return { url: '', hasDescription: false, description: '' };
      }

function ensureWordContextWebSources() {
        if (!Array.isArray(wordContextWebSources)) {
          wordContextWebSources = [];
        }
        if (wordContextWebSources.length > WORD_WEB_SOURCE_LIMIT) {
          wordContextWebSources = wordContextWebSources.slice(0, WORD_WEB_SOURCE_LIMIT);
        }
        return wordContextWebSources;
      }

function renderWordContextWebSources(options) {
        const itemsContainer = document.getElementById('wordContextWebItems');
        if (!itemsContainer) {
          return;
        }
        const focusNew = !!(options && options.focusNew);
        const sources = ensureWordContextWebSources();
        itemsContainer.innerHTML = '';
        sources.forEach(function(entry, index) {
          const item = document.createElement('div');
          item.className = 'word-context-web-item';

          const row = document.createElement('div');
          row.className = 'word-context-web-row';

          const removeBtn = document.createElement('button');
          removeBtn.type = 'button';
          removeBtn.className = 'header-ai-web-remove word-context-web-remove';
          removeBtn.textContent = '×';
          removeBtn.setAttribute('aria-label', 'Eliminar página web');
          removeBtn.addEventListener('click', function() {
            const list = ensureWordContextWebSources();
            list.splice(index, 1);
            renderWordContextWebSources();
            updateWordContextWebVisibility();
          });

          const inputWrapper = document.createElement('div');
          inputWrapper.className = 'header-ai-web-input-wrapper';
          const input = document.createElement('input');
          input.type = 'url';
          input.className = 'word-context-web-input header-ai-web-input';
          input.placeholder = 'https://ejemplo.com';
          input.value = entry && entry.url ? entry.url : '';
          input.addEventListener('input', function() {
            const target = ensureWordContextWebSources()[index];
            if (target) {
              target.url = this.value;
            }
          });
          inputWrapper.appendChild(input);

          row.appendChild(removeBtn);
          row.appendChild(inputWrapper);
          item.appendChild(row);

          const descToggleLabel = document.createElement('label');
          descToggleLabel.className = 'word-context-web-desc-toggle';
          const descToggle = document.createElement('input');
          descToggle.type = 'checkbox';
          const descText = document.createElement('span');
          descText.textContent = 'Agregar descripción';
          const hasContent = entry && entry.description && entry.description.trim();
          descToggle.checked = !!(entry && (entry.hasDescription || hasContent));
          if (descToggle.checked) {
            descToggleLabel.classList.add('is-active');
          }
          descToggleLabel.appendChild(descToggle);
          descToggleLabel.appendChild(descText);
          item.appendChild(descToggleLabel);

          const descArea = document.createElement('textarea');
          descArea.className = 'word-context-web-desc';
          descArea.placeholder = 'Describe qué información se debe buscar';
          descArea.value = entry && entry.description ? entry.description : '';
          descArea.classList.toggle('is-visible', descToggle.checked);
          descArea.addEventListener('input', function() {
            const target = ensureWordContextWebSources()[index];
            if (target) {
              target.description = this.value;
            }
          });
          descToggle.addEventListener('change', function() {
            const target = ensureWordContextWebSources()[index];
            if (target) {
              target.hasDescription = this.checked;
              if (!this.checked) {
                target.description = '';
                descArea.value = '';
              }
            }
            descArea.classList.toggle('is-visible', this.checked);
            descToggleLabel.classList.toggle('is-active', this.checked);
          });
          item.appendChild(descArea);

          itemsContainer.appendChild(item);
          if (focusNew && index === sources.length - 1) {
            setTimeout(function() {
              input.focus();
            }, 0);
          }
        });
        updateWordContextWebVisibility();
      }

function updateWordContextWebVisibility() {
        const toggle = document.getElementById('wordContextWebToggle');
        const list = document.getElementById('wordContextWebList');
        const collapseBtn = document.getElementById('wordContextWebCollapse');
        const addBtn = document.getElementById('wordContextWebAdd');
        const enabled = !!(toggle && toggle.checked);
        const collapsed = !!wordContextWebCollapsed && enabled;
        if (list) {
          list.classList.toggle('is-visible', enabled && !collapsed);
        }
        if (collapseBtn) {
          collapseBtn.disabled = !enabled;
          collapseBtn.textContent = collapsed ? '▸' : '▾';
          collapseBtn.setAttribute('aria-expanded', enabled && !collapsed ? 'true' : 'false');
        }
        if (addBtn) {
          const sources = ensureWordContextWebSources();
          addBtn.disabled = !enabled || collapsed || sources.length >= WORD_WEB_SOURCE_LIMIT;
        }
      }

function syncWordStructureSection(key) {
        const toggle = document.getElementById(key + 'Toggle');
        const details = document.getElementById(key + 'Details');
        const descToggle = document.getElementById(key + 'DescriptionToggle');
        const descWrapper = document.getElementById(key + 'DescriptionWrapper');
        const descInput = document.getElementById(key + 'Description');
        const active = Boolean(toggle && toggle.checked);
        if (details) {
          details.classList.toggle('is-visible', active);
        }
        if (!active && descToggle) {
          descToggle.checked = false;
        }
        const showDescription = Boolean(active && descToggle && descToggle.checked);
        if (descWrapper) {
          descWrapper.classList.toggle('is-visible', showDescription);
        }
        if (!showDescription && descInput) {
          descInput.value = '';
        }
      }

function syncWordStructureSections() {
        WORD_STRUCTURE_KEYS.forEach(function(key) {
          syncWordStructureSection(key);
        });
      }

function bindWordContextWebSources() {
        const toggle = document.getElementById('wordContextWebToggle');
        if (toggle && toggle.dataset.webBound !== 'true') {
          toggle.addEventListener('change', function() {
            if (this.checked && ensureWordContextWebSources().length === 0) {
              wordContextWebSources.push(createEmptyWordWebSourceEntry());
              renderWordContextWebSources({ focusNew: true });
            }
            if (!this.checked) {
              wordContextWebCollapsed = false;
            }
            updateWordContextWebVisibility();
          });
          toggle.dataset.webBound = 'true';
        }
        const addBtn = document.getElementById('wordContextWebAdd');
        if (addBtn && addBtn.dataset.webBound !== 'true') {
          addBtn.addEventListener('click', function() {
            if (ensureWordContextWebSources().length >= WORD_WEB_SOURCE_LIMIT) {
              return;
            }
            wordContextWebSources.push(createEmptyWordWebSourceEntry());
            renderWordContextWebSources({ focusNew: true });
            updateWordContextWebVisibility();
          });
          addBtn.dataset.webBound = 'true';
        }
        const collapseBtn = document.getElementById('wordContextWebCollapse');
        if (collapseBtn && collapseBtn.dataset.webBound !== 'true') {
          collapseBtn.addEventListener('click', function() {
            if (collapseBtn.disabled) {
              return;
            }
            wordContextWebCollapsed = !wordContextWebCollapsed;
            updateWordContextWebVisibility();
          });
          collapseBtn.dataset.webBound = 'true';
        }
        renderWordContextWebSources();
        updateWordContextWebVisibility();
      }

function bindWordStructureToggle(key) {
        const toggle = document.getElementById(key + 'Toggle');
        if (toggle && toggle.dataset.wordStructureBound !== 'true') {
          toggle.addEventListener('change', function() {
            syncWordStructureSection(key);
          });
          toggle.dataset.wordStructureBound = 'true';
        }
        const descToggle = document.getElementById(key + 'DescriptionToggle');
        if (descToggle && descToggle.dataset.wordStructureBound !== 'true') {
          descToggle.addEventListener('change', function() {
            syncWordStructureSection(key);
          });
          descToggle.dataset.wordStructureBound = 'true';
        }
      }

function bindWordStructureToggles() {
        WORD_STRUCTURE_KEYS.forEach(function(key) {
          bindWordStructureToggle(key);
        });
        syncWordStructureSections();
      }

function resetWordAutoComments() {
        const toggle = document.getElementById('wordAutoCommentsToggle');
        if (toggle) {
          toggle.checked = false;
        }
        WORD_AUTO_COMMENT_KEYS.forEach(function(key) {
          const option = document.getElementById('wordAutoComment' + capitalizeWordKey(key));
          if (option) {
            option.checked = false;
          }
        });
        const customText = document.getElementById('wordAutoCommentsCustom');
        if (customText) {
          customText.value = '';
        }
        syncWordAutoComments();
      }

function capitalizeWordKey(key) {
        if (!key) {
          return '';
        }
        return key.charAt(0).toUpperCase() + key.slice(1);
      }

function syncWordAutoComments() {
        const toggle = document.getElementById('wordAutoCommentsToggle');
        const options = document.getElementById('wordAutoCommentsOptions');
        const customToggle = document.getElementById('wordAutoCommentCustom');
        const customWrapper = document.getElementById('wordAutoCommentsCustomWrapper');
        const customText = document.getElementById('wordAutoCommentsCustom');
        const enabled = !!(toggle && toggle.checked);
        if (options) {
          options.classList.toggle('is-visible', enabled);
        }
        if (!enabled) {
          WORD_AUTO_COMMENT_KEYS.forEach(function(key) {
            const option = document.getElementById('wordAutoComment' + capitalizeWordKey(key));
            if (option) {
              option.checked = false;
            }
          });
        }
        const showCustom = Boolean(enabled && customToggle && customToggle.checked);
        if (customWrapper) {
          customWrapper.classList.toggle('is-visible', showCustom);
        }
        if (!showCustom && customText) {
          customText.value = '';
        }
      }

function bindWordAutoComments() {
        const toggle = document.getElementById('wordAutoCommentsToggle');
        if (toggle && toggle.dataset.autoCommentsBound !== 'true') {
          toggle.addEventListener('change', function() {
            syncWordAutoComments();
          });
          toggle.dataset.autoCommentsBound = 'true';
        }
        WORD_AUTO_COMMENT_KEYS.forEach(function(key) {
          const control = document.getElementById('wordAutoComment' + capitalizeWordKey(key));
          if (control && control.dataset.autoCommentsBound !== 'true') {
            control.addEventListener('change', function() {
              syncWordAutoComments();
            });
            control.dataset.autoCommentsBound = 'true';
          }
        });
        const customField = document.getElementById('wordAutoCommentsCustom');
        if (customField && customField.dataset.autoCommentsBound !== 'true') {
          customField.addEventListener('input', function() {
            // Mantener sincronizado el estado de comentarios personalizados si es necesario en el futuro.
          });
          customField.dataset.autoCommentsBound = 'true';
        }
        syncWordAutoComments();
      }

function syncWordLanguageControls() {
        const select = document.getElementById('wordBodyLanguage');
        const wrapper = document.getElementById('wordBodyLanguageCustomWrapper');
        const input = document.getElementById('wordBodyLanguageCustom');
        if (!select || !wrapper) {
          return;
        }
        const shouldShow = select.value === 'other';
        wrapper.classList.toggle('is-visible', shouldShow);
        if (!shouldShow && input) {
          input.value = '';
        }
      }

function syncWordToneControls() {
        const select = document.getElementById('wordBodyTone');
        const wrapper = document.getElementById('wordBodyToneCustomWrapper');
        const input = document.getElementById('wordBodyToneCustom');
        if (!select || !wrapper) {
          return;
        }
        const shouldShow = select.value === 'custom';
        wrapper.classList.toggle('is-visible', shouldShow);
        if (!shouldShow && input) {
          input.value = '';
        }
      }

function syncWordProfileControls() {
        const select = document.getElementById('wordBodyProfile');
        const wrapper = document.getElementById('wordBodyProfileNoteWrapper');
        const note = document.getElementById('wordBodyProfileNote');
        if (!select || !wrapper) {
          return;
        }
        const shouldShow = select.value === 'custom';
        wrapper.classList.toggle('is-visible', shouldShow);
        if (!shouldShow && note) {
          note.value = '';
        }
      }

function bindWordContextSelects() {
        const languageSelect = document.getElementById('wordBodyLanguage');
        if (languageSelect && languageSelect.dataset.wordSelectBound !== 'true') {
          languageSelect.addEventListener('change', function() {
            syncWordLanguageControls();
          });
          languageSelect.dataset.wordSelectBound = 'true';
        }
        const toneSelect = document.getElementById('wordBodyTone');
        if (toneSelect && toneSelect.dataset.wordSelectBound !== 'true') {
          toneSelect.addEventListener('change', function() {
            syncWordToneControls();
          });
          toneSelect.dataset.wordSelectBound = 'true';
        }
        const profileSelect = document.getElementById('wordBodyProfile');
        if (profileSelect && profileSelect.dataset.wordSelectBound !== 'true') {
          profileSelect.addEventListener('change', function() {
            syncWordProfileControls();
          });
          profileSelect.dataset.wordSelectBound = 'true';
        }
        syncWordLanguageControls();
        syncWordToneControls();
        syncWordProfileControls();
      }

function syncWordTitleControls() {
        const isWordTheme = isWordThemeActiveForCreate();
        const container = document.getElementById('wordTitleOptions');
        const autoToggle = document.getElementById('wordAutoTitleToggle');
        const manualToggle = document.getElementById('wordManualTitleFormatToggle');
        const formatOptions = document.getElementById('wordTitleFormatOptions');
        const titleInput = document.getElementById('tableName');
        if (container) {
          container.style.display = isWordTheme ? 'block' : 'none';
        }
        if (!isWordTheme) {
          if (autoToggle) {
            autoToggle.checked = false;
          }
          if (manualToggle) {
            manualToggle.checked = false;
          }
        }
        const autoActive = Boolean(isWordTheme && autoToggle && autoToggle.checked);
        if (titleInput) {
          if (autoActive) {
            if (titleInput.dataset.autoFilled !== 'true') {
              titleInput.dataset.prevManualValue = titleInput.value;
              if (!titleInput.value) {
                titleInput.value = WORD_TITLE_AUTO_PLACEHOLDER;
              }
              titleInput.dataset.autoFilled = 'true';
            }
            titleInput.disabled = true;
            titleInput.setAttribute('aria-disabled', 'true');
          } else {
            if (titleInput.dataset && titleInput.dataset.autoFilled === 'true') {
              titleInput.value = titleInput.dataset.prevManualValue || '';
              delete titleInput.dataset.autoFilled;
              delete titleInput.dataset.prevManualValue;
            }
            titleInput.disabled = false;
            titleInput.removeAttribute('aria-disabled');
          }
        }
        if (manualToggle) {
          manualToggle.disabled = !isWordTheme;
          if (manualToggle.disabled) {
            manualToggle.checked = false;
            manualToggle.setAttribute('aria-disabled', 'true');
          } else {
            manualToggle.removeAttribute('aria-disabled');
          }
        }
        const manualActive = Boolean(isWordTheme && manualToggle && manualToggle.checked);
        if (formatOptions) {
          formatOptions.style.display = manualActive ? 'block' : 'none';
          const shouldCollapse = formatOptions.dataset && formatOptions.dataset.wordCollapsed === 'true';
          setWordFormatSectionCollapsed('wordTitleFormatOptions', shouldCollapse);
        }
        bindWordFormatCollapses();
        updateWordPreview('title');
      }

function syncWordBodyControls() {
        const isWordTheme = isWordThemeActiveForCreate();
        const container = document.getElementById('wordBodyOptions');
        const manualToggle = document.getElementById('wordManualBodyFormatToggle');
        const formatOptions = document.getElementById('wordBodyFormatOptions');
        if (container) {
          container.style.display = isWordTheme ? 'block' : 'none';
        }
        if (!isWordTheme && manualToggle) {
          manualToggle.checked = false;
        }
        const manualActive = Boolean(isWordTheme && manualToggle && manualToggle.checked);
        if (manualToggle) {
          manualToggle.disabled = !isWordTheme;
          if (manualToggle.disabled) {
            manualToggle.setAttribute('aria-disabled', 'true');
          } else {
            manualToggle.removeAttribute('aria-disabled');
          }
        }
        if (formatOptions) {
          formatOptions.style.display = manualActive ? 'block' : 'none';
          const shouldCollapse = formatOptions.dataset && formatOptions.dataset.wordCollapsed === 'true';
          setWordFormatSectionCollapsed('wordBodyFormatOptions', shouldCollapse);
        }
        bindWordFormatCollapses();
        updateWordPreview('body');
      }

function syncWordContextCard() {
        const card = document.getElementById('wordContextCard');
        if (!card) {
          return;
        }
        const isWordTheme = isWordThemeActiveForCreate();
        card.style.display = isWordTheme ? 'block' : 'none';
        syncWordLanguageControls();
        syncWordToneControls();
        syncWordProfileControls();
        syncWordStructureSections();
        updateWordContextWebVisibility();
        syncWordAutoComments();
      }

function syncWordCreateOptions() {
        syncWordTitleControls();
        syncWordBodyControls();
        syncWordContextCard();
      }

function bindWordTextToggles() {
        const autoToggle = document.getElementById('wordAutoTitleToggle');
        if (autoToggle && autoToggle.dataset.toggleBound !== 'true') {
          autoToggle.addEventListener('change', function() {
            syncWordTitleControls();
            updateWordPreview('title');
          });
          autoToggle.dataset.toggleBound = 'true';
        }
        const manualTitleToggle = document.getElementById('wordManualTitleFormatToggle');
        if (manualTitleToggle && manualTitleToggle.dataset.toggleBound !== 'true') {
          manualTitleToggle.addEventListener('change', function() {
            syncWordTitleControls();
            updateWordPreview('title');
          });
          manualTitleToggle.dataset.toggleBound = 'true';
        }
        const manualBodyToggle = document.getElementById('wordManualBodyFormatToggle');
        if (manualBodyToggle && manualBodyToggle.dataset.toggleBound !== 'true') {
          manualBodyToggle.addEventListener('change', function() {
            syncWordBodyControls();
            updateWordPreview('body');
          });
          manualBodyToggle.dataset.toggleBound = 'true';
        }
      }

function bindWordFormatInputs() {
        function attach(control, kind) {
          if (!control || control.dataset.wordFormatBound === 'true') {
            return;
          }
          const handler = function() {
            updateWordPreview(kind);
          };
          const tag = control.tagName ? control.tagName.toLowerCase() : '';
          const type = control.type ? control.type.toLowerCase() : '';
          const primaryEvent = type === 'color' || type === 'number' ? 'input' : (tag === 'select' ? 'change' : 'change');
          control.addEventListener(primaryEvent, handler);
          if (primaryEvent !== 'change') {
            control.addEventListener('change', handler);
          }
          control.dataset.wordFormatBound = 'true';
        }
        const titleContainer = document.getElementById('wordTitleFormatOptions');
        if (titleContainer) {
          const titleControls = titleContainer.querySelectorAll('input, select');
          titleControls.forEach(function(control) {
            attach(control, 'title');
          });
        }
        const bodyContainer = document.getElementById('wordBodyFormatOptions');
        if (bodyContainer) {
          const bodyControls = bodyContainer.querySelectorAll('input, select');
          bodyControls.forEach(function(control) {
            attach(control, 'body');
          });
        }
      }

function setWordFormatSectionCollapsed(sectionId, collapsed) {
        const container = document.getElementById(sectionId);
        if (!container) {
          return;
        }
        const content = container.querySelector('.word-format-content');
        const toggle = container.querySelector('.word-format-collapse');
        const isCollapsed = !!collapsed;
        container.classList.toggle('is-collapsed', isCollapsed);
        if (content) {
          content.style.display = isCollapsed ? 'none' : '';
        }
        if (toggle) {
          const expandLabel = toggle.dataset && toggle.dataset.expandLabel
            ? toggle.dataset.expandLabel
            : 'Expandir opciones de formato';
          const collapseLabel = toggle.dataset && toggle.dataset.collapseLabel
            ? toggle.dataset.collapseLabel
            : 'Replegar opciones de formato';
          toggle.setAttribute('aria-expanded', isCollapsed ? 'false' : 'true');
          toggle.setAttribute('aria-label', isCollapsed ? expandLabel : collapseLabel);
        }
        container.dataset.wordCollapsed = isCollapsed ? 'true' : 'false';
      }

function toggleWordFormatSection(sectionId) {
        const container = document.getElementById(sectionId);
        if (!container) {
          return;
        }
        const nextState = !(container.dataset && container.dataset.wordCollapsed === 'true');
        setWordFormatSectionCollapsed(sectionId, nextState);
      }

function bindWordFormatCollapses() {
        const sections = ['wordTitleFormatOptions', 'wordBodyFormatOptions'];
        sections.forEach(function(sectionId) {
          const container = document.getElementById(sectionId);
          if (!container) {
            return;
          }
          const toggle = container.querySelector('.word-format-collapse');
          if (toggle && toggle.dataset.wordCollapseBound !== 'true') {
            toggle.addEventListener('click', function() {
              toggleWordFormatSection(sectionId);
            });
            toggle.dataset.wordCollapseBound = 'true';
          }
          const shouldCollapse = container.dataset && container.dataset.wordCollapsed === 'true';
          setWordFormatSectionCollapsed(sectionId, shouldCollapse);
        });
      }

function resetPendingFormatState() {
        pendingFormatState = { applied: false, range: null };
      }

function setPendingFormattedRange(info) {
        if (info && info.sheetName && info.a1Notation) {
          pendingFormatState = {
            applied: true,
            range: {
              sheetName: info.sheetName,
              a1Notation: info.a1Notation
            }
          };
        } else {
          resetPendingFormatState();
        }
      }

function isFormatLockActive() {
        return !!(pendingFormatState && pendingFormatState.applied);
      }

function clearCreateFormatDirty() {
        createFormatDirty = false;
      }

function markCreateFormatDirty() {
        createFormatDirty = true;
      }

function isCreateFormatDirty() {
        return !!createFormatDirty;
      }

function resetCreateTabView(options) {
        options = options || {};
        if (!options.preserveRange) {
          createFormulaPreference = true;
          applyCreateFormulaPreference(true);
          resetPendingFormatState();
          clearRangeUI();
        }
        if (!options.preserveFields) {
          resetWordTextOptions();
          const nameInput = document.getElementById('tableName');
          if (nameInput) {
            nameInput.value = '';
          }
          const descInput = document.getElementById('tableDesc');
          if (descInput) {
            descInput.value = '';
          }
          setDefaultStyles();
        }
        if (!options.preserveHeaders) {
          currentHeaders = [];
          renderCreateHeaders();
        }
        clearCreateFormatDirty();
        syncCreateRangeModeUI();
        syncWordCreateOptions();
      }

function clearRangeUI() {
        const label = document.getElementById('rangeLabel');
        if (label) {
          label.textContent = '—';
        }
        const input = document.getElementById('rangeInput');
        if (input) {
          input.value = '';
          input.dataset.manual = 'false';
        }
        rangeInfo = null;
        clearCreateFormatDirty();
      }

function setRangeUI(info, options) {
        options = options || {};
        if (!info || !info.sheetName || !info.a1Notation) {
          clearRangeUI();
          return;
        }
        const rows = typeof info.rows === 'number' ? info.rows : (info.rows || 0);
        const cols = typeof info.cols === 'number' ? info.cols : (info.cols || 0);
        const label = document.getElementById('rangeLabel');
        const input = document.getElementById('rangeInput');
        const fullA1 = info.sheetName + '!' + info.a1Notation;
        if (label) {
          const dims = rows && cols ? ' (' + cols + '×' + rows + ')' : '';
          label.textContent = fullA1 + dims;
        }
        if (input && (options.force || input.dataset.manual !== 'true')) {
          input.value = fullA1;
          input.dataset.manual = 'false';
        }
        const incomingHeaders = Array.isArray(info.headers) ? info.headers : currentHeaders;
        const previousPreference =
          rangeInfo && typeof rangeInfo.updateFormulaReferences === 'boolean'
            ? rangeInfo.updateFormulaReferences
            : createFormulaPreference;
        const incomingPreference =
          typeof info.updateFormulaReferences === 'boolean'
            ? info.updateFormulaReferences
            : previousPreference;
        rangeInfo = {
          sheetName: info.sheetName,
          a1Notation: info.a1Notation,
          rows: rows,
          cols: cols,
          headers: cloneHeaderModels(incomingHeaders),
          updateFormulaReferences: normalizeFormulaPreference(incomingPreference)
        };
        rangeInfo.fullA1 = fullA1;
        applyCreateFormulaPreference(rangeInfo.updateFormulaReferences);
      }

function getRangeInputValue() {
        const input = document.getElementById('rangeInput');
        if (input) {
          const text = input.value.trim();
          if (text) {
            return text;
          }
        }
        if (rangeInfo && rangeInfo.sheetName && rangeInfo.a1Notation) {
          return rangeInfo.sheetName + '!' + rangeInfo.a1Notation;
        }
        return '';
      }

function renderCreateHeaders() {
        renderHeaderList('headersList', currentHeaders);
      }

function setDefaultStyles() {
        const colorHeader = document.getElementById('colorHeader');
        const colorAlt1 = document.getElementById('colorAlt1');
        const colorAlt2 = document.getElementById('colorAlt2');
        const borderToggle = document.getElementById('toggleBorder');
        const boldToggle = document.getElementById('toggleBold');
        if (colorHeader) colorHeader.value = DEFAULT_STYLE.headerColor;
        if (colorAlt1) colorAlt1.value = DEFAULT_STYLE.altColor1;
        if (colorAlt2) colorAlt2.value = DEFAULT_STYLE.altColor2;
        if (borderToggle) borderToggle.checked = DEFAULT_STYLE.border;
        if (boldToggle) boldToggle.checked = DEFAULT_STYLE.bold;
      }

function loadActiveRange(updateHeaders = true) {
        if (isWordThemeActiveForCreate() && !isWordRangeSelectionEnabled()) {
          return;
        }
        google.script.run.withSuccessHandler(function(info) {
          const label = document.getElementById('rangeLabel');
          if (info.error) {
            clearRangeUI();
            if (label) {
              label.textContent = '—';
            }
            showMessageModal(info.error, {
              title: 'Rango no disponible',
              variant: 'error'
            });
            return;
          }
          const infoForUi = Object.assign({}, info);
          if (!updateHeaders) {
            infoForUi.headers = cloneHeaderModels(currentHeaders);
          }
          setRangeUI(infoForUi, { force: editingId === '' || !document.getElementById('rangeInput') || document.getElementById('rangeInput').value === '' });
          if (updateHeaders) {
            currentHeaders = cloneHeaderModels(info.headers);
          }
          renderCreateHeaders();
          markCreateFormatDirty();
          resetPendingFormatState();
        }).getActiveRangeInfo();
      }

async function handleApplyFormat() {
        if (isWordThemeActiveForCreate() && !isWordRangeSelectionEnabled()) {
          await showMessageModal('Activa "Seleccionar un rango antes de pegar" para aplicar y preparar el formato.', {
            title: 'Selecciona un rango',
            variant: 'info'
          });
          return false;
        }
        const rangeA1 = getRangeInputValue();
        if (!rangeA1) {
          await showMessageModal('Indique un rango válido antes de aplicar el formato.', {
            title: 'Rango requerido',
            variant: 'error'
          });
          return false;
        }

        const validation = validateTableDetails();
        if (!validation.valid) {
          const msg = buildMissingFieldsMessage(validation.missing);
          await showMessageModal(msg || 'Complete todos los campos obligatorios antes de continuar.', {
            title: 'Información incompleta',
            variant: 'error'
          });
          return false;
        }

        currentHeaders = cloneHeaderModels(validation.values.headers);
        renderCreateHeaders();
        const nameInput = document.getElementById('tableName');
        if (nameInput) {
          nameInput.value = validation.values.name;
        }
        const descInput = document.getElementById('tableDesc');
        if (descInput) {
          descInput.value = validation.values.description;
        }

        const headerColor = document.getElementById('colorHeader').value;
        const alt1 = document.getElementById('colorAlt1').value;
        const alt2 = document.getElementById('colorAlt2').value;
        const border = document.getElementById('toggleBorder').checked;
        const bold = document.getElementById('toggleBold').checked;
        const style = { headerColor: headerColor, altColor1: alt1, altColor2: alt2, border: border, bold: bold };
        const tableId = editingId;
        const updateFormulaReferences = getCreateFormulaPreference();

        let response;
        try {
          response = await callServerFunction(
            'applyTableFormatting',
            tableId,
            rangeA1,
            validation.values.name,
            validation.values.description,
            cloneHeaderModels(currentHeaders),
            style,
            {
              skipSaving: true,
              updateFormulaReferences: updateFormulaReferences,
              formulaPreference: updateFormulaReferences
            }
          );
        } catch (err) {
          await showMessageModal('No se pudo aplicar el formato: ' + (err && err.message ? err.message : err), {
            title: 'No se pudo aplicar',
            variant: 'error'
          });
          return false;
        }

        if (response && response.error) {
          await showMessageModal(response.error, {
            title: 'No se pudo aplicar',
            variant: 'error'
          });
          return false;
        }

        let appliedPreference = updateFormulaReferences;
        if (response && response.rangeInfo) {
          setRangeUI(response.rangeInfo, { force: true });
          if (Array.isArray(response.rangeInfo.headers)) {
            currentHeaders = cloneHeaderModels(response.rangeInfo.headers);
            renderCreateHeaders();
          }
          setPendingFormattedRange(response.rangeInfo);
          if (typeof response.rangeInfo.updateFormulaReferences === 'boolean') {
            appliedPreference = response.rangeInfo.updateFormulaReferences;
          }
        } else {
          const parts = rangeA1.split('!');
          if (parts.length === 2) {
            setPendingFormattedRange({ sheetName: parts[0], a1Notation: parts[1] });
          } else {
            resetPendingFormatState();
          }
        }

        applyCreateFormulaPreference(appliedPreference);

        clearCreateFormatDirty();

        await showMessageModal((response && response.message) || 'Formato aplicado correctamente.', {
          title: 'Formato aplicado',
          variant: 'success'
        });
        return true;
      }

async function handleSaveAction(options) {
        options = options || {};
        if (isWordThemeActiveForCreate() && !isWordRangeSelectionEnabled()) {
          await showMessageModal('El guardado requiere seleccionar un rango. Activa la opción para definir dónde pegar el texto.', {
            title: 'Selecciona un rango',
            variant: 'info'
          });
          return false;
        }
        const rangeA1 = getRangeInputValue();
        if (!rangeA1) {
          await showMessageModal('Indique un rango válido antes de guardar la tabla.', {
            title: 'Rango requerido',
            variant: 'error'
          });
          return false;
        }

        const validation = validateTableDetails();
        if (validation.missing.length > 0) {
          const missingExcludingName = validation.missing.filter(function(item) {
            return item !== 'Nombre de la tabla';
          });

          if (missingExcludingName.length > 0) {
            const msg = buildMissingFieldsMessage(validation.missing);
            await showMessageModal(msg || 'Complete todos los campos obligatorios antes de continuar.', {
              title: 'Información incompleta',
              variant: 'error'
            });
            return false;
          }

          if (validation.missing.indexOf('Nombre de la tabla') !== -1) {
            const continueWithoutName = await showConfirmModal('Guardar sin nombre hará que la tabla sea difícil de identificar. ¿Desea continuar?', {
              title: 'Guardar sin nombre',
              variant: 'warning',
              confirmText: 'Continuar',
              cancelText: 'Cancelar'
            });
            if (!continueWithoutName) {
              return false;
            }
          }
        }

        const uniqueName = await ensureUniqueTableNameOrAlert(validation.values.name, {
          ignoreId: editingId
        });
        if (!uniqueName) {
          return false;
        }

        currentHeaders = cloneHeaderModels(validation.values.headers);
        renderCreateHeaders();
        const nameInput = document.getElementById('tableName');
        if (nameInput) {
          nameInput.value = validation.values.name;
        }
        const descInput = document.getElementById('tableDesc');
        if (descInput) {
          descInput.value = validation.values.description;
        }

        const headerColor = document.getElementById('colorHeader').value;
        const alt1 = document.getElementById('colorAlt1').value;
        const alt2 = document.getElementById('colorAlt2').value;
        const border = document.getElementById('toggleBorder').checked;
        const bold = document.getElementById('toggleBold').checked;
        const style = { headerColor: headerColor, altColor1: alt1, altColor2: alt2, border: border, bold: bold };
        const tableId = editingId;
        const updateFormulaReferences = getCreateFormulaPreference();
        const entryValues = Object.assign({}, validation.values, {
          updateFormulaReferences: updateFormulaReferences
        });

        if (isCreateFormatDirty() && !options.skipFormatCheck) {
          await showMessageModal('Debe aplicar el formato al rango actual antes de guardar la tabla.', {
            title: 'Formato pendiente',
            variant: 'warning'
          });
          return false;
        }

        let response;
        try {
          response = await callServerFunction(
            'applyTableFormatting',
            tableId,
            rangeA1,
            validation.values.name,
            validation.values.description,
            cloneHeaderModels(currentHeaders),
            style,
            { skipFormatting: true, formulaPreference: updateFormulaReferences }
          );
        } catch (err) {
          await showMessageModal('No se pudo guardar la tabla: ' + (err && err.message ? err.message : err), {
            title: 'No se pudo guardar',
            variant: 'error'
          });
          return false;
        }

        if (response && response.error) {
          await showMessageModal(response.error, {
            title: 'No se pudo guardar',
            variant: 'error'
          });
          return false;
        }

        let appliedPreference = updateFormulaReferences;
        if (response && response.rangeInfo) {
          setRangeUI(response.rangeInfo, { force: true });
          if (Array.isArray(response.rangeInfo.headers)) {
            currentHeaders = cloneHeaderModels(response.rangeInfo.headers);
            renderCreateHeaders();
          }
          if (typeof response.rangeInfo.updateFormulaReferences === 'boolean') {
            appliedPreference = response.rangeInfo.updateFormulaReferences;
          }
        }

        entryValues.updateFormulaReferences = appliedPreference;
        applyCreateFormulaPreference(appliedPreference);

        if (response && response.id) {
          lastSavedTableId = response.id;
          const cachedEntry = buildSavedTableCacheEntry(
            response.id,
            entryValues,
            (response && response.rangeInfo) || rangeInfo,
            style,
            currentHeaders
          );
          if (cachedEntry) {
            upsertSavedTablesCache(cachedEntry);
            applySavedTablesFromCache(['editSavedTables', 'aiSavedTables'], {
              selectId: response.id
            });
          }
        }

        editingId = '';

        await refreshSavedTables(['editSavedTables', 'aiSavedTables'], {
          selectId: lastSavedTableId
        });

        resetCreateTabView({
          preserveRange: false,
          preserveFields: false,
          preserveHeaders: false
        });

        await showMessageModal((response && response.message) || 'Tabla guardada correctamente.', {
          title: 'Tabla guardada',
          variant: 'success'
        });
        return true;
      }

async function clearPendingFormattedRange() {
        const targetInfo = (pendingFormatState && pendingFormatState.range) || rangeInfo;
        const rangeNotation = getFullRangeNotation(targetInfo);
        if (!rangeNotation) {
          await showMessageModal('No se pudo identificar el rango a limpiar. Actualice el rango e inténtelo nuevamente.', {
            title: 'Rango no disponible',
            variant: 'error'
          });
          return false;
        }

        let response;
        try {
          response = await callServerFunction('clearRangeByNotation', rangeNotation);
        } catch (err) {
          await showMessageModal('No se pudo borrar el rango: ' + (err && err.message ? err.message : err), {
            title: 'No se pudo borrar',
            variant: 'error'
          });
          return false;
        }

        if (response && response.error) {
          await showMessageModal(response.error, {
            title: 'No se pudo borrar',
            variant: 'error'
          });
          return false;
        }

        resetPendingFormatState();
        clearRangeUI();
        return true;
      }

async function resolvePendingFormatting() {
        if (!isFormatLockActive()) {
          return 'none';
        }
        const result = await openModal({
          title: 'Cambios pendientes',
          message: 'Se aplicó un formato que aún no se guardó. Elija guardar la tabla o borrar el formato para continuar.',
          variant: 'warning',
          primaryText: 'Guardar tabla',
          secondaryText: 'Borrar tabla',
          allowEscape: false
        });

        if (result === 'primary') {
          const saved = await handleSaveAction({ triggeredByGuard: true });
          if (saved) {
            return 'saved';
          }
          return 'blocked';
        }
        if (result === 'secondary') {
          const cleared = await clearPendingFormattedRange();
          if (cleared) {
            await showMessageModal('Se borraron el contenido y formato del rango seleccionado.', {
              title: 'Tabla borrada',
              variant: 'success'
            });
            return 'cleared';
          }
          return 'blocked';
        }
        return 'blocked';
      }

      function bindWordRangeToggle() {
        const rangeToggle = document.getElementById('wordUseRangeToggle');
        if (rangeToggle && rangeToggle.dataset.toggleBound !== 'true') {
          rangeToggle.addEventListener('change', function() {
            syncCreateRangeModeUI();
            syncWordCreateOptions();
          });
          rangeToggle.dataset.toggleBound = 'true';
        }
      }

function initializeWordRangeMode() {
        bindWordRangeToggle();
        bindCreateFormulaToggle();
        applyCreateFormulaPreference(createFormulaPreference);
        bindWordTextToggles();
        bindWordFormatInputs();
        bindWordFormatCollapses();
        bindWordContextWebSources();
        bindWordContextSelects();
        bindWordStructureToggles();
        bindWordAutoComments();
        syncCreateRangeModeUI();
        syncWordCreateOptions();
        refreshWordPreviews();
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initializeWordRangeMode);
      } else {
        initializeWordRangeMode();
      }

function notifyCreateThemeChanged() {
        bindWordRangeToggle();
        bindCreateFormulaToggle();
        applyCreateFormulaPreference(createFormulaPreference);
        bindWordTextToggles();
        bindWordFormatInputs();
        bindWordFormatCollapses();
        bindWordContextWebSources();
        bindWordContextSelects();
        bindWordStructureToggles();
        bindWordAutoComments();
        syncCreateRangeModeUI();
        syncWordCreateOptions();
        refreshWordPreviews();
      }

      window.notifyCreateThemeChanged = notifyCreateThemeChanged;
