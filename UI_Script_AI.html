function saveReportEmail() {
        const input = document.getElementById('aiReportEmailInput');
        const nameInput = document.getElementById('aiReportEmailNameInput');
        const list = document.getElementById('aiReportEmailList');
        if (!input || !list) {
          return;
        }
        const value = (input.value || '').trim();
        const label = nameInput ? (nameInput.value || '').trim() : '';
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!value) {
          setReportHelperMessage('aiReportEmailMessage', 'Ingrese un correo electrónico válido para guardarlo.', 'error');
          return;
        }
        if (!emailRegex.test(value)) {
          setReportHelperMessage('aiReportEmailMessage', 'El formato del correo no es válido.', 'error');
          return;
        }
        const trimmedValue = value.trim();
        const previouslySelected = sanitizeContactSelection(
          getCheckedValuesFromList('aiReportEmailList'),
          REPORT_ALL_EMAILS_VALUE
        );
        const existingIndex = savedReportEmails.findIndex(function(entry) {
          const normalized = normalizeReportEmailEntry(entry);
          return normalized && normalized.address === trimmedValue;
        });
        const baseSelection = previouslySelected.indexOf(REPORT_ALL_EMAILS_VALUE) !== -1
          ? [REPORT_ALL_EMAILS_VALUE]
          : previouslySelected.slice();
        if (existingIndex === -1) {
          savedReportEmails.push({ address: trimmedValue, label: label });
          persistReportContactList('emails', savedReportEmails);
          if (baseSelection.indexOf(REPORT_ALL_EMAILS_VALUE) === -1) {
            baseSelection.push(trimmedValue);
          }
          renderReportEmailList(baseSelection);
          setReportHelperMessage('aiReportEmailMessage', 'Correo guardado correctamente.', 'success');
        } else {
          const existingEntry = normalizeReportEmailEntry(savedReportEmails[existingIndex]);
          let message = 'El correo ya estaba guardado. Se seleccionó automáticamente.';
          if (existingEntry && existingEntry.address) {
            if ((existingEntry.label || '') !== label) {
              savedReportEmails[existingIndex] = { address: existingEntry.address, label: label };
              persistReportContactList('emails', savedReportEmails);
              message = 'Se actualizó la información del correo guardado.';
            }
          }
          if (baseSelection.indexOf(trimmedValue) === -1 && baseSelection.indexOf(REPORT_ALL_EMAILS_VALUE) === -1) {
            baseSelection.push(trimmedValue);
          }
          renderReportEmailList(baseSelection);
          setReportHelperMessage('aiReportEmailMessage', message, 'success');
        }
        input.value = '';
        if (nameInput) {
          nameInput.value = '';
        }
      }

function updateAiActionState() {
        const select = document.getElementById('aiActionSelect');
        const askSection = document.getElementById('aiAskSection');
        const reportSection = document.getElementById('aiReportSection');
        const questionInput = document.getElementById('questionInput');
        const askBtn = document.getElementById('askBtn');
        const answerBox = document.getElementById('answerBox');
        if (!select || !askSection) {
          return;
        }
        const action = select.value;
        if (action === 'ask') {
          askSection.style.display = 'block';
          if (reportSection) {
            reportSection.style.display = 'none';
          }
          if (questionInput) {
            questionInput.disabled = false;
          }
          if (askBtn) {
            askBtn.disabled = false;
          }
        } else if (action === 'report') {
          initializeReportSection();
          askSection.style.display = 'none';
          if (reportSection) {
            reportSection.style.display = 'block';
          }
          if (questionInput) {
            questionInput.value = '';
            questionInput.disabled = true;
          }
          if (askBtn) {
            askBtn.disabled = true;
          }
          if (answerBox) {
            answerBox.value = '';
          }
        } else {
          askSection.style.display = 'none';
          if (reportSection) {
            reportSection.style.display = 'none';
          }
          resetReportSection();
          if (questionInput) {
            questionInput.value = '';
            questionInput.disabled = true;
          }
          if (askBtn) {
            askBtn.disabled = true;
          }
          if (answerBox) {
            answerBox.value = '';
          }
        }
      }

          .withFailureHandler(function(err) {
            const message = err && err.message ? err.message : err;
            showMessageModal('No se pudo obtener la tabla seleccionada: ' + message, {
              title: 'Error al cargar tabla',
              variant: 'error'
            });
          })
          .getTableMeta(val);
      });

      const editSavedList = document.getElementById('editSavedTablesList');
      if (editSavedList) {
        editSavedList.addEventListener('click', function(event) {
          if (editSavedList.classList.contains('disabled')) {
            return;
          }
          const locateBtn = event.target.closest('.edit-saved-locate');
          if (locateBtn) {
            event.preventDefault();
            event.stopPropagation();
            const tableId = locateBtn.dataset ? locateBtn.dataset.value : '';
            if (tableId) {
              locateSavedTable(tableId);
            }
            return;
          }
          const item = event.target.closest('.edit-saved-item');
          if (item && item.dataset && item.dataset.value) {
            if (editSavedList.classList.contains('collapsed')) {
              event.preventDefault();
              setEditSavedListCollapsed(false);
              return;
            }
            event.preventDefault();
            selectEditSavedTable(item.dataset.value);
          }
        });
        editSavedList.addEventListener('keydown', function(event) {
          if (editSavedList.classList.contains('disabled')) {
            return;
          }
          if (event.key === 'Enter' || event.key === ' ') {
            const item = event.target.closest('.edit-saved-item');
            if (item && item.dataset && item.dataset.value) {
              if (editSavedList.classList.contains('collapsed')) {
                event.preventDefault();
                setEditSavedListCollapsed(false);
                return;
              }
              event.preventDefault();
              selectEditSavedTable(item.dataset.value);
            }
          }
        });
      }

      document.getElementById('editDeleteTableBtn').addEventListener('click', async function() {
        if (!editingId) {
          await showMessageModal('Seleccione una tabla guardada antes de borrarla.', {
            title: 'Seleccione una tabla',
            variant: 'error'
          });
          return;
        }
        const targetId = editingId;
        const cached = getSavedTableFromCache(targetId);
        const nameSuffix = cached && cached.name ? ' "' + cached.name + '"' : '';
        const confirmed = await showConfirmModal(
          'Se eliminará la tabla' +
            nameSuffix +
            '. Se borrarán el contenido y formato del rango asociado y sus metadatos guardados. ¿Desea continuar?',
          {
            title: 'Confirmar borrado',
            variant: 'warning',
            confirmText: 'Borrar tabla',
            cancelText: 'Cancelar'
          }
        );
        if (!confirmed) {
          return;
        }
        google.script.run
          .withSuccessHandler(async function(res) {
            if (res && res.error) {
              await showMessageModal(res.error, {
                title: 'No se pudo borrar',
                variant: 'error'
              });
              return;
            }
            const removedOnly = res && res.removed && !(res && res.warning);
            editingId = '';
            lastSavedTableId = '';
            removeSavedTableFromCache(targetId);
            applySavedTablesFromCache(['editSavedTables', 'aiSavedTables']);
            await refreshSavedTables(['editSavedTables', 'aiSavedTables']);
            resetEditTabView();
            const hasWarning = res && res.warning;
            let message;
            let title;
            let variant;
            if (removedOnly) {
              message = (res && res.message) || 'Se ha retirado de la lista.';
              title = 'Tabla no encontrada';
              variant = 'info';
            } else if (hasWarning) {
              message = 'Tabla borrada. ' + res.warning;
              title = 'Tabla borrada con advertencias';
              variant = 'warning';
            } else {
              message = 'Tabla borrada correctamente.';
              title = 'Tabla borrada';
              variant = 'success';
            }
            await showMessageModal(message, {
              title: title,
              variant: variant
            });
          })
          .withFailureHandler(async function(err) {
            const message = err && err.message ? err.message : err;
            await showMessageModal('No se pudo borrar la tabla: ' + message, {
              title: 'No se pudo borrar',
              variant: 'error'
            });
          })
          .deleteSavedTable(targetId);
      });

      document.getElementById('askBtn').addEventListener('click', function() {
        const actionSelect = document.getElementById('aiActionSelect');
        if (actionSelect && actionSelect.value !== 'ask') {
          return;
        }
        const select = document.getElementById('aiSavedTables');
        const selectedValues = Array.prototype.slice
          .call(select && select.options ? select.options : [])
          .filter(function(option) {
            return option.selected && option.value;
          })
          .map(function(option) {
            return option.value;
          });
        const questionInput = document.getElementById('questionInput');
        const question = questionInput ? questionInput.value.trim() : '';
        if (selectedValues.length === 0) {
          showMessageModal('Seleccione al menos una tabla para realizar la consulta.', {
            title: 'Seleccione una tabla',
            variant: 'error'
          });
          return;
        }
        if (!question) {
          showMessageModal('Escriba una pregunta.', {
            title: 'Pregunta requerida',
            variant: 'error'
          });
          return;
        }
        const payload = selectedValues.indexOf(ALL_TABLES_OPTION_VALUE) !== -1 ? ALL_TABLES_OPTION_VALUE : selectedValues;
        const answerField = document.getElementById('answerBox');
        if (answerField) {
          answerField.value = '';
        }
        google.script.run.withSuccessHandler(function(res) {
          if (res && res.error) {
            showMessageModal(res.error, {
              title: 'Consulta no disponible',
              variant: 'error'
            });
          } else {
            if (answerField) {
              answerField.value = res.answer || '';
            }
          }
        }).askQuestion(payload, question);
      });

      document.addEventListener('DOMContentLoaded', function() {
        window.addEventListener('beforeunload', handleSidebarBeforeUnload);
        setDefaultStyles();
        setEditDefaultStyles();
        const aiSelect = document.getElementById('aiSavedTables');
        const aiList = document.getElementById('aiSavedTablesList');
        if (aiSelect) {
          aiSelect.addEventListener('change', function() {
            updateAiListSelectionUI(aiSelect);
          });
        }
        if (aiList) {
          aiList.addEventListener('click', function(event) {
            const target = event.target;
            if (!target) {
              return;
            }
            const item = typeof target.closest === 'function' ? target.closest('.ai-multi-item') : null;
            if (!item || !item.dataset || !item.dataset.value || aiList.classList.contains('disabled')) {
              return;
            }
            toggleAiListValue(item.dataset.value);
          });
          aiList.addEventListener('keydown', function(event) {
            if (event.key !== 'Enter' && event.key !== ' ' && event.key !== 'Spacebar') {
              return;
            }
            const target = event.target;
            if (!target) {
              return;
            }
            const item = typeof target.closest === 'function' ? target.closest('.ai-multi-item') : null;
            if (!item || !item.dataset || !item.dataset.value || aiList.classList.contains('disabled')) {
              return;
            }
            event.preventDefault();
            toggleAiListValue(item.dataset.value);
          });
        }
        const aiActionSelect = document.getElementById('aiActionSelect');
        if (aiActionSelect) {
          aiActionSelect.addEventListener('change', updateAiActionState);
          updateAiActionState();
        }
        applyReportFeatureTooltips();
        applyReportChartTypeTooltips();
        applyOptionalCommentHints();
        updateReportFileExtension();
        const reportFileNameInput = document.getElementById('aiReportFileName');
        if (reportFileNameInput) {
          reportFileNameInput.addEventListener('input', function() {
            updateReportFileExtension();
          });
        }
        const rangeInput = document.getElementById('rangeInput');
        if (rangeInput) {
          rangeInput.dataset.manual = 'false';
          rangeInput.addEventListener('input', function() {
            this.dataset.manual = this.value.trim() ? 'true' : 'false';
            if (this.dataset.manual === 'true') {
              rangeInfo = null;
              markCreateFormatDirty();
              resetPendingFormatState();
            } else {
              clearCreateFormatDirty();
            }
          });
        }
        const editRangeInput = document.getElementById('editRangeInput');
        if (editRangeInput) {
          editRangeInput.dataset.manual = 'false';
          editRangeInput.addEventListener('input', function() {
            this.dataset.manual = this.value.trim() ? 'true' : 'false';
            if (this.dataset.manual === 'true') {
              editRangeInfo = null;
            }
            if (editingId) {
              markEditFormatDirty();
            }
          });
        }
        const editStyleInputs = [
          { id: 'editColorHeader', event: 'input' },
          { id: 'editColorAlt1', event: 'input' },
          { id: 'editColorAlt2', event: 'input' },
          { id: 'editToggleBorder', event: 'change' },
          { id: 'editToggleBold', event: 'change' },
          { id: 'editUpdateFormulaRefs', event: 'change' }
        ];
        editStyleInputs.forEach(function(cfg) {
          const el = document.getElementById(cfg.id);
          if (!el) {
            return;
          }
          el.addEventListener(cfg.event || 'change', function() {
            if (cfg.id === 'editUpdateFormulaRefs') {
              applyEditFormulaPreference(this.checked);
            }
            if (editingId) {
              markEditFormatDirty();
            }
          });
        });
        resetEditTabView();
        restoreSavedTablesCache();
        applySavedTablesFromCache(['editSavedTables', 'aiSavedTables']);
        refreshSavedTables(['editSavedTables', 'aiSavedTables']);
        setActiveTab('aiTab', { force: true });
      });
    
</script>
