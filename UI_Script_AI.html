function createAiMultiItem(entry, selected, options) {
        const config = options || {};
        const hasOverride = Object.prototype.hasOwnProperty.call(config, 'valueOverride');
        const value = hasOverride
          ? String(config.valueOverride || '')
          : entry && entry.id
          ? String(entry.id)
          : '';
        if (!value) {
          return null;
        }
        const labelText = config.labelOverride
          ? String(config.labelOverride)
          : entry && entry.name
          ? entry.name
          : value;
        const item = document.createElement('div');
        item.className = 'ai-multi-item';
        if (config.allOption) {
          item.classList.add('all-option');
        }
        item.dataset.value = value;
        item.setAttribute('role', 'option');
        item.tabIndex = 0;
        if (selected) {
          item.classList.add('selected');
        }
        item.setAttribute('aria-selected', selected ? 'true' : 'false');

        if (entry) {
          styleEditListItem(item, entry);
        } else {
          item.style.removeProperty('--header-color');
          item.style.removeProperty('--header-text-color');
          item.dataset.headerColor = '';
        }

        const label = document.createElement('span');
        label.className = 'ai-label';
        label.textContent = labelText;
        item.appendChild(label);

        const check = document.createElement('span');
        check.className = 'ai-check';
        item.appendChild(check);

        return item;
      }

function renderAiSavedTablesList(entries, config) {
        const listEl = document.getElementById('aiSavedTablesList');
        const selectEl = document.getElementById('aiSavedTables');
        if (!listEl || !selectEl) {
          return;
        }
        const data = Array.isArray(entries) ? entries : [];
        const options = config || {};
        const includeAll = !!options.includeAll;
        const allValue = options.allValue || '';
        const allLabel = options.allLabel || 'Todas las tablas';
        const groupBySheet = !!options.groupBySheet;
        const disabled = !!options.disabled;
        const selectedValues = Array.isArray(options.selectedValues) ? options.selectedValues : [];
        const selectedSet = Object.create(null);
        selectedValues.forEach(function(value) {
          selectedSet[String(value)] = true;
        });

        listEl.innerHTML = '';
        listEl.setAttribute('role', 'listbox');
        listEl.setAttribute('aria-multiselectable', 'true');
        listEl.dataset.allValue = includeAll ? allValue : '';
        listEl.classList.toggle('disabled', disabled);
        listEl.setAttribute('aria-disabled', disabled ? 'true' : 'false');

        if (disabled || data.length === 0) {
          const empty = document.createElement('div');
          empty.className = 'ai-multi-empty';
          empty.textContent = 'No hay tablas guardadas';
          listEl.appendChild(empty);
          return;
        }

        if (includeAll && allValue) {
          const allItem = createAiMultiItem(null, !!selectedSet[allValue], {
            valueOverride: allValue,
            labelOverride: allLabel,
            allOption: true
          });
          if (allItem) {
            listEl.appendChild(allItem);
          }
        }

        if (groupBySheet) {
          const grouped = Object.create(null);
          const order = [];
          data.forEach(function(entry) {
            if (!entry || !entry.id) {
              return;
            }
            const sheetLabel = entry.sheetName ? entry.sheetName : 'Sin hoja';
            if (!grouped[sheetLabel]) {
              grouped[sheetLabel] = [];
              order.push(sheetLabel);
            }
            grouped[sheetLabel].push(entry);
          });
          order.forEach(function(sheetLabel) {
            const wrapper = document.createElement('div');
            wrapper.className = 'ai-multi-group';
            const labelEl = document.createElement('div');
            labelEl.className = 'ai-multi-group-label';
            labelEl.textContent = sheetLabel;
            wrapper.appendChild(labelEl);
            grouped[sheetLabel].forEach(function(entry) {
              const item = createAiMultiItem(entry, !!selectedSet[entry.id]);
              if (item) {
                wrapper.appendChild(item);
              }
            });
            listEl.appendChild(wrapper);
          });
        } else {
          data.forEach(function(entry) {
            if (!entry || !entry.id) {
              return;
            }
            const item = createAiMultiItem(entry, !!selectedSet[entry.id]);
            if (item) {
              listEl.appendChild(item);
            }
          });
        }
        updateAiListSelectionUI(selectEl);
      }

function updateAiListSelectionUI(select) {
        const listEl = document.getElementById('aiSavedTablesList');
        if (!listEl || !select) {
          return;
        }
        const selectedSet = Object.create(null);
        if (select.options) {
          Array.prototype.forEach.call(select.options, function(option) {
            if (option && option.value && option.selected && !option.disabled) {
              selectedSet[option.value] = true;
            }
          });
        }
        const items = listEl.querySelectorAll('.ai-multi-item');
        Array.prototype.forEach.call(items, function(item) {
          const value = item && item.dataset ? item.dataset.value : '';
          if (!value) {
            item.classList.remove('selected');
            item.setAttribute('aria-selected', 'false');
            return;
          }
          if (selectedSet[value]) {
            item.classList.add('selected');
            item.setAttribute('aria-selected', 'true');
          } else {
            item.classList.remove('selected');
            item.setAttribute('aria-selected', 'false');
          }
        });
        refreshAllReportFeatureOptions();
      }

function toggleAiListValue(value) {
        const selectEl = document.getElementById('aiSavedTables');
        const listEl = document.getElementById('aiSavedTablesList');
        if (!selectEl || !listEl || selectEl.disabled) {
          return;
        }
        const options = selectEl.options ? Array.prototype.slice.call(selectEl.options) : [];
        if (!options.length) {
          return;
        }
        const allValue = listEl.dataset.allValue || selectEl.dataset.allValue || '';
        const targetValue = String(value || '');
        if (!targetValue) {
          return;
        }
        if (allValue && targetValue === allValue) {
          let currentlySelected = false;
          options.forEach(function(option) {
            if (option && option.value === allValue && option.selected) {
              currentlySelected = true;
            }
          });
          const newState = !currentlySelected;
          options.forEach(function(option) {
            if (!option || option.disabled || !option.value) {
              return;
            }
            if (option.value === allValue) {
              option.selected = newState;
            } else {
              option.selected = false;
            }
          });
        } else {
          let targetOption = null;
          options.forEach(function(option) {
            if (option && option.value === targetValue) {
              targetOption = option;
            }
          });
          if (!targetOption) {
            return;
          }
          const newState = !targetOption.selected;
          targetOption.selected = newState;
          if (newState && allValue) {
            options.forEach(function(option) {
              if (option && option.value === allValue) {
                option.selected = false;
              }
            });
          }
        }
        selectEl.dispatchEvent(new Event('change', { bubbles: true }));
        updateAiListSelectionUI(selectEl);
      }

function normalizeReportEmailEntry(entry) {
        if (!entry) {
          return null;
        }
        if (typeof entry === 'string') {
          const address = entry.trim();
          return address ? { address: address, label: '' } : null;
        }
        if (typeof entry === 'object') {
          const address = typeof entry.address === 'string'
            ? entry.address.trim()
            : typeof entry.email === 'string'
            ? entry.email.trim()
            : typeof entry.value === 'string'
            ? entry.value.trim()
            : '';
          if (!address) {
            return null;
          }
          const label = typeof entry.label === 'string'
            ? entry.label.trim()
            : typeof entry.name === 'string'
            ? entry.name.trim()
            : '';
          return { address: address, label: label };
        }
        return null;
      }

function sanitizeContactSelection(values, allValue) {
        if (!Array.isArray(values) || values.length === 0) {
          return [];
        }
        if (values.indexOf(allValue) !== -1) {
          return [allValue];
        }
        const seen = {};
        const result = [];
        values.forEach(function(value) {
          if (value && !seen[value]) {
            seen[value] = true;
            result.push(value);
          }
        });
        return result;
      }

function ensureContactListHandler(listId, allValue) {
        const list = document.getElementById(listId);
        if (!list) {
          return;
        }
        if (list.dataset && list.dataset.handlerAttached === 'true') {
          return;
        }
        list.addEventListener('change', function(event) {
          const target = event.target;
          if (!target || target.type !== 'checkbox') {
            return;
          }
          if (target.value === allValue) {
            if (target.checked) {
              Array.prototype.slice
                .call(list.querySelectorAll('input[type="checkbox"]'))
                .forEach(function(cb) {
                  if (cb !== target) {
                    cb.checked = false;
                  }
                });
            }
          } else if (target.checked) {
            const allOption = list.querySelector('input[type="checkbox"][value="' + allValue + '"]');
            if (allOption) {
              allOption.checked = false;
            }
          }
        });
        if (list.dataset) {
          list.dataset.handlerAttached = 'true';
        }
      }

function normalizeReportPhoneEntry(entry) {
        if (!entry) {
          return null;
        }
        if (typeof entry === 'string') {
          const number = entry.trim();
          return number ? { number: number, label: '' } : null;
        }
        if (typeof entry === 'object') {
          const number = typeof entry.number === 'string'
            ? entry.number.trim()
            : typeof entry.phone === 'string'
            ? entry.phone.trim()
            : typeof entry.value === 'string'
            ? entry.value.trim()
            : '';
          if (!number) {
            return null;
          }
          const label = typeof entry.label === 'string'
            ? entry.label.trim()
            : typeof entry.name === 'string'
            ? entry.name.trim()
            : '';
          return { number: number, label: label };
        }
        return null;
      }

function loadReportContactList(key) {
        const storage = getLocalStorage();
        if (!storage) {
          return [];
        }
        try {
          const raw = storage.getItem(REPORT_STORAGE_KEYS[key]);
          if (!raw) {
            return [];
          }
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed)) {
            if (key === 'phones') {
              const seenNumbers = {};
              return parsed
                .map(normalizeReportPhoneEntry)
                .filter(function(entry) {
                  if (!entry || !entry.number || seenNumbers[entry.number]) {
                    return false;
                  }
                  seenNumbers[entry.number] = true;
                  return true;
                });
            }
            if (key === 'emails') {
              const seenEmails = {};
              return parsed
                .map(normalizeReportEmailEntry)
                .filter(function(entry) {
                  if (!entry || !entry.address || seenEmails[entry.address]) {
                    return false;
                  }
                  seenEmails[entry.address] = true;
                  return true;
                });
            }
          }
        } catch (err) {
          console.log('No se pudieron cargar los contactos guardados para reportes.', err);
        }
        return [];
      }

function persistReportContactList(key, list) {
        const storage = getLocalStorage();
        if (!storage) {
          return;
        }
        try {
          storage.setItem(REPORT_STORAGE_KEYS[key], JSON.stringify(list || []));
        } catch (err) {
          console.log('No se pudieron guardar los contactos de reportes.', err);
        }
      }

function renderReportEmailList(selectedValues) {
        const list = document.getElementById('aiReportEmailList');
        if (!list) {
          return;
        }
        const sanitizedSelection = sanitizeContactSelection(selectedValues, REPORT_ALL_EMAILS_VALUE);
        const selectedMap = {};
        sanitizedSelection.forEach(function(value) {
          if (value) {
            selectedMap[value] = true;
          }
        });
        const allSelected = !!selectedMap[REPORT_ALL_EMAILS_VALUE];
        list.innerHTML = '';

        const allItem = document.createElement('label');
        allItem.className = 'ai-contact-item ai-contact-all';
        const allCheckbox = document.createElement('input');
        allCheckbox.type = 'checkbox';
        allCheckbox.className = 'ai-contact-checkbox';
        allCheckbox.value = REPORT_ALL_EMAILS_VALUE;
        allCheckbox.checked = allSelected;
        const allDetails = document.createElement('span');
        allDetails.className = 'ai-contact-details';
        const allValueEl = document.createElement('span');
        allValueEl.className = 'ai-contact-value';
        allValueEl.textContent = 'Todos los contactos';
        allDetails.appendChild(allValueEl);
        allItem.appendChild(allCheckbox);
        allItem.appendChild(allDetails);
        list.appendChild(allItem);

        let hasContacts = false;
        const seen = {};
        if (Array.isArray(savedReportEmails)) {
          savedReportEmails.forEach(function(entry) {
            const normalized = normalizeReportEmailEntry(entry);
            if (!normalized || !normalized.address) {
              return;
            }
            if (seen[normalized.address]) {
              return;
            }
            seen[normalized.address] = true;
            hasContacts = true;
            const item = document.createElement('label');
            item.className = 'ai-contact-item';
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.className = 'ai-contact-checkbox';
            checkbox.value = normalized.address;
            checkbox.checked = !allSelected && !!selectedMap[normalized.address];
            const details = document.createElement('span');
            details.className = 'ai-contact-details';
            if (normalized.label) {
              const nameEl = document.createElement('span');
              nameEl.className = 'ai-contact-name';
              nameEl.textContent = normalized.label;
              details.appendChild(nameEl);
            }

            return entry !== email;
          }),
          REPORT_ALL_EMAILS_VALUE
        );
        const nextEmails = [];
        savedReportEmails.forEach(function(entry) {
          const normalized = normalizeReportEmailEntry(entry);
          if (!normalized || !normalized.address || normalized.address === email) {
            return;
          }
          nextEmails.push(normalized);
        });
        if (nextEmails.length === savedReportEmails.length) {
          return;

        savedReportEmails = nextEmails;

        renderReportEmailList(previouslySelected);

function getReportDateSuffix() {

function sanitizeReportFileName(value) {
        if (value === null || value === undefined) {
          return '';
        }
        let text = String(value).trim();
        if (!text) {
          return '';
        }
        if (typeof text.normalize === 'function') {
          text = text.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
        }
        text = text.replace(/\s+/g, '');
        text = text.replace(/[^A-Za-z0-9_-]/g, '');
        return text;
      }

        let finalName = '';
        if (sanitizedBase) {

function getReportFeatureFixedQuantity(feature) {
        if (!feature) {
          return 0;
        }
        const fixed = REPORT_FEATURE_FIXED_QUANTITY[feature];
        if (!fixed) {
          return 0;
        }
        if (fixed < 1) {
          return 1;
        }
        if (fixed > REPORT_FEATURE_MAX_QUANTITY) {
          return REPORT_FEATURE_MAX_QUANTITY;
        }
        return fixed;
      }

function getReportFeatureDefaultQuantity(feature) {
        const fixed = getReportFeatureFixedQuantity(feature);
        if (fixed > 0) {
          return fixed;
        }
        return 1;
      }

function reportFeatureAllowsQuantity(feature) {
        if (!feature) {
          return true;
        }
        return !REPORT_FEATURES_WITHOUT_QUANTITY[feature];
      }

function clampReportFeatureQuantity(value, feature) {
        if (!reportFeatureAllowsQuantity(feature)) {
          return getReportFeatureDefaultQuantity(feature);
        }
        const parsed = parseInt(value, 10);
        if (isNaN(parsed) || parsed < 1) {
          return 1;
        }
        if (parsed > REPORT_FEATURE_MAX_QUANTITY) {
          return REPORT_FEATURE_MAX_QUANTITY;
        }
        return parsed;
      }

function createEmptyFeatureInstanceArray() {
        return Array(REPORT_FEATURE_MAX_QUANTITY).fill('');
      }

function createEmptyFeatureTitleArray() {
        return Array(REPORT_FEATURE_MAX_QUANTITY).fill('');
      }

function createEmptyFeatureChartTypeArray() {
        return Array(REPORT_FEATURE_MAX_QUANTITY).fill(REPORT_CHART_TYPE_DEFAULT);
      }

function createEmptyFeatureListOrderArray() {
        return Array(REPORT_FEATURE_MAX_QUANTITY).fill(REPORT_LIST_ORDER_DEFAULT);
      }

function createEmptyFeatureListEnumerateArray() {
        return Array(REPORT_FEATURE_MAX_QUANTITY).fill(REPORT_LIST_ENUMERATE_DEFAULT);
      }

function createEmptyFeatureListEnumStyleArray() {
        return Array(REPORT_FEATURE_MAX_QUANTITY).fill(REPORT_LIST_ENUM_STYLE_DEFAULT);
      }

function createEmptyFeatureTableToggleArray() {
        return Array(REPORT_FEATURE_MAX_QUANTITY).fill(false);
      }

function createEmptyFeatureTableSelectionArray() {
        return Array.from({ length: REPORT_FEATURE_MAX_QUANTITY }, function() {
          return [];
        });
      }

function cloneFeatureTableSelectionArray(source) {
        const base = createEmptyFeatureTableSelectionArray();
        if (!Array.isArray(source)) {
          return base;
        }
        source.slice(0, REPORT_FEATURE_MAX_QUANTITY).forEach(function(entry, index) {
          if (!Array.isArray(entry)) {
            base[index] = [];
            return;
          }
          const seen = Object.create(null);
          const values = [];
          entry.forEach(function(value) {
            if (value === null || value === undefined) {
              return;
            }
            const text = String(value).trim();
            if (!text || seen[text]) {
              return;
            }
            seen[text] = true;
            values.push(text);
          });
          base[index] = values;
        });
        return base;
      }

function normalizeFeatureTableToggleArray(source) {
        const base = createEmptyFeatureTableToggleArray();
        if (Array.isArray(source)) {
          source.slice(0, REPORT_FEATURE_MAX_QUANTITY).forEach(function(value, index) {
            base[index] = !!value;
          });
        }
        return base;
      }

function normalizeFeatureTableSelectionArray(source, allowedSet) {
        const base = createEmptyFeatureTableSelectionArray();
        if (!Array.isArray(source)) {
          return base;
        }
        const hasAllowedSet = allowedSet && typeof allowedSet === 'object';
        source.slice(0, REPORT_FEATURE_MAX_QUANTITY).forEach(function(entry, index) {
          if (!Array.isArray(entry)) {
            base[index] = [];
            return;
          }
          const seen = Object.create(null);
          const values = [];
          entry.forEach(function(value) {
            if (value === null || value === undefined) {
              return;
            }
            const text = String(value).trim();
            if (!text || text === ALL_TABLES_OPTION_VALUE || seen[text]) {
              return;
            }
            if (hasAllowedSet && !allowedSet[text]) {
              return;
            }
            seen[text] = true;
            values.push(text);
          });
          base[index] = values;
        });
        return base;
      }

function createFeatureInstanceKey(feature, index) {
        const normalizedFeature = normalizeFeatureId(feature);
        if (!normalizedFeature) {
          return '';
        }
        const parsedIndex = parseInt(index, 10);
        const safeIndex = isNaN(parsedIndex)
          ? 0
          : Math.max(0, Math.min(REPORT_FEATURE_MAX_QUANTITY - 1, parsedIndex));
        return normalizedFeature + ':' + safeIndex;
      }

function parseFeatureInstanceKey(key) {
        if (key === null || key === undefined) {
          return null;
        }
        const parts = String(key).split(':');
        if (parts.length !== 2) {
          return null;
        }
        const feature = normalizeFeatureId(parts[0]);
        const index = parseInt(parts[1], 10);
        if (!feature || isNaN(index) || index < 0 || index >= REPORT_FEATURE_MAX_QUANTITY) {
          return null;
        }
        return { feature: feature, index: index };
      }

function normalizeReportOrderEntries(entries) {
        if (!Array.isArray(entries)) {
          return [];
        }
        const result = [];
        entries.forEach(function(entry) {
          if (entry === null || entry === undefined) {
            return;
          }
          if (typeof entry === 'string') {
            const parsed = parseFeatureInstanceKey(entry);
            if (parsed) {
              const key = createFeatureInstanceKey(parsed.feature, parsed.index);
              if (key) {
                result.push(key);
              }
            }
            return;
          }
          const feature = normalizeFeatureId(entry.feature);
          const index = parseInt(entry.index, 10);
          if (!feature || isNaN(index) || index < 0 || index >= REPORT_FEATURE_MAX_QUANTITY) {
            return;
          }
          const key = createFeatureInstanceKey(feature, index);
          if (key) {
            result.push(key);
          }
        });
        return result;
      }

function getActiveReportFeatureInstanceKeys() {
        const keys = [];
        REPORT_FEATURE_OPTIONS.forEach(function(option) {
          if (!option || !option.value) {
            return;
          }
          const feature = option.value;
          const state = ensureReportFeatureState(feature);
          if (!state || !state.selected) {
            return;
          }
          const quantity = clampReportFeatureQuantity(state.quantity, feature);
          for (let idx = 0; idx < quantity; idx++) {
            const key = createFeatureInstanceKey(feature, idx);
            if (key) {
              keys.push(key);
            }
          }
        });
        return keys;
      }

function sanitizeReportOrder(orderList, activeKeys) {
        const baseEntries = normalizeReportOrderEntries(orderList);
        const active = Array.isArray(activeKeys) ? activeKeys.slice() : getActiveReportFeatureInstanceKeys();
        const activeSet = active.reduce(function(map, key) {
          if (key) {
            map[key] = true;
          }
          return map;
        }, Object.create(null));
        const sanitized = [];
        baseEntries.forEach(function(key) {
          if (key && activeSet[key] && sanitized.indexOf(key) === -1) {
            sanitized.push(key);
          }
        });
        active.forEach(function(key) {
          if (key && sanitized.indexOf(key) === -1) {
            sanitized.push(key);
          }
        });
        return sanitized;
      }

function findOptionLabel(options, value) {

function formatReportTableLabelList(ids) {

        ids.forEach(function(id) {
          if (!id || id === ALL_TABLES_OPTION_VALUE) {

function getReportOrderTablesMeta(feature, index) {
        const state = ensureReportFeatureState(feature);
        if (!state || !state.selected) {
          return '';
        }
        const toggles = normalizeFeatureTableToggleArray(state.instanceTablesEnabled);
        const selections = normalizeFeatureTableSelectionArray(state.instanceTables);
        if (toggles[index] && Array.isArray(selections[index]) && selections[index].length > 0) {
          const count = selections[index].length;
          return count === 1 ? 'Tablas: 1 específica' : 'Tablas: ' + count + ' específicas';
        }
        const selectedIds = getSelectedAiTableIds();
        if (!Array.isArray(selectedIds) || selectedIds.length === 0) {
          return 'Tablas: sin seleccionar';
        }
        if (selectedIds.indexOf(ALL_TABLES_OPTION_VALUE) !== -1) {
          return 'Tablas: todas las seleccionadas';
        }
        return 'Tablas: ' + selectedIds.length + (selectedIds.length === 1 ? ' seleccionada' : ' seleccionadas');
      }

function getReportOrderTablesDetail(feature, index) {
        const state = ensureReportFeatureState(feature);
        if (!state || !state.selected) {
          return 'Tablas generales: sin seleccionar';
        }
        const toggles = normalizeFeatureTableToggleArray(state.instanceTablesEnabled);
        const selections = normalizeFeatureTableSelectionArray(state.instanceTables);
        if (toggles[index] && Array.isArray(selections[index]) && selections[index].length > 0) {
          const detail = formatReportTableLabelList(selections[index]);
          if (detail) {
            return 'Tablas específicas: ' + detail;
          }
          const count = selections[index].length;
          return 'Tablas específicas: ' + (count === 1 ? '1 tabla' : count + ' tablas');
        }
        const selectedIds = getSelectedAiTableIds();
        if (!Array.isArray(selectedIds) || selectedIds.length === 0) {
          return 'Tablas generales: sin seleccionar';
        }
        if (selectedIds.indexOf(ALL_TABLES_OPTION_VALUE) !== -1) {
          return 'Tablas generales: todas las tablas seleccionadas';
        }
        const detail = formatReportTableLabelList(selectedIds);
        if (detail) {
          return 'Tablas generales: ' + detail;
        }
        const count = selectedIds.length;
        return 'Tablas generales: ' + (count === 1 ? '1 tabla' : count + ' tablas');
      }

function getReportOrderItemMeta(feature, index) {
        const state = ensureReportFeatureState(feature);
        if (!state || !state.selected) {
          return '';
        }
        const parts = [];
        if (feature === 'chart') {
          const chartTypes = normalizeFeatureChartTypeArray(state.instanceChartTypes);
          parts.push('Tipo: ' + getReportChartTypeLabel(chartTypes[index]));
        } else if (feature === 'list') {
          const enumerate = normalizeFeatureListEnumerateArray(state.instanceListEnumerate);
          if (enumerate[index] === 'yes') {
            const styles = normalizeFeatureListEnumStyleArray(state.instanceListEnumStyles);
            const styleLabel = getReportListEnumStyleLabel(styles[index]);
            parts.push(styleLabel ? 'Enumeración: ' + styleLabel : 'Enumeración: activada');
          } else {
            const orders = normalizeFeatureListOrderArray(state.instanceListOrders);
            const orderLabel = getReportListOrderLabel(orders[index]);
            if (orderLabel) {
              parts.push('Orden: ' + orderLabel);
            }
          }
        } else if (feature === 'summary') {
          const lengthLabel = getReportSummaryLengthLabel(state.summaryLength);
          if (lengthLabel) {
            parts.push('Longitud: ' + lengthLabel);
          }
        }
        const tablesMeta = getReportOrderTablesMeta(feature, index);
        if (tablesMeta) {
          parts.push(tablesMeta);
        }
        return parts.join(' · ');
      }

function getReportOrderItemTooltip(feature, index) {
        const state = ensureReportFeatureState(feature);
        if (!state || !state.selected) {
          return '';
        }
        const quantity = clampReportFeatureQuantity(state.quantity, feature);
        if (index < 0 || index >= quantity) {
          return '';
        }
        const titles = normalizeFeatureTitleArray(state.instanceTitles);
        const descriptions = normalizeFeatureInstanceArray(state.instanceDescriptions);
        const lines = [];
        const titleText = titles[index] ? String(titles[index]).trim() : '';
        const descriptionText = descriptions[index] ? String(descriptions[index]).trim() : '';
        if (titleText) {
          lines.push('Nombre: ' + titleText);
        }
        if (descriptionText) {
          lines.push('Descripción: ' + descriptionText);
        }
        if (feature === 'chart') {
          const chartTypes = normalizeFeatureChartTypeArray(state.instanceChartTypes);
          lines.push('Tipo: ' + getReportChartTypeLabel(chartTypes[index]));
        } else if (feature === 'list') {
          const enumerate = normalizeFeatureListEnumerateArray(state.instanceListEnumerate);
          if (enumerate[index] === 'yes') {
            const styles = normalizeFeatureListEnumStyleArray(state.instanceListEnumStyles);
            const styleLabel = getReportListEnumStyleLabel(styles[index]);
            lines.push(styleLabel ? 'Enumeración: ' + styleLabel : 'Enumeración: activada');
          } else {
            const orders = normalizeFeatureListOrderArray(state.instanceListOrders);
            const orderLabel = getReportListOrderLabel(orders[index]);
            if (orderLabel) {
              lines.push('Orden: ' + orderLabel);
            }
          }
        } else if (feature === 'summary') {
          const lengthLabel = getReportSummaryLengthLabel(state.summaryLength);
          if (lengthLabel) {

          }
          const toneLabel = getReportSummaryToneLabel(state.summaryTone);

function bindReportOrderDragEvents() {
        const items = document.querySelectorAll('.ai-report-order-item[draggable="true"]');
        items.forEach(function(item) {
          item.addEventListener('dragstart', handleReportOrderDragStart);
          item.addEventListener('dragend', handleReportOrderDragEnd);

          item.addEventListener('dragleave', handleReportOrderDragLeave);
          item.addEventListener('drop', handleReportOrderDrop);

function handleReportOrderDragStart(event) {
        const target = event.currentTarget;
        if (!target || target.getAttribute('draggable') === 'false') {
          return;
        }
        const key = target.dataset ? target.dataset.orderItem : '';
        if (!key) {
          return;
        }
        reportOrderDragKey = key;
        target.classList.add('dragging');
        if (event.dataTransfer) {
          event.dataTransfer.effectAllowed = 'move';
          event.dataTransfer.setData('text/plain', key);
        }
      }

function handleReportOrderDragEnd(event) {
        const target = event.currentTarget;
        if (target) {
          target.classList.remove('dragging');
          target.classList.remove('drag-over');
        }
        reportOrderDragKey = '';
      }

function handleReportOrderDragOver(event) {
        if (event.preventDefault) {
          event.preventDefault();
        }
        const target = event.currentTarget;
        if (!target || target.getAttribute('draggable') === 'false') {
          return;
        }
        if (event.dataTransfer) {
          event.dataTransfer.dropEffect = 'move';
        }
        target.classList.add('drag-over');
      }

function handleReportOrderDragLeave(event) {
        const target = event.currentTarget;
        if (target) {
          target.classList.remove('drag-over');
        }
      }

function handleReportOrderDrop(event) {
        if (event.preventDefault) {
          event.preventDefault();
        }
        const target = event.currentTarget;
        if (!target || target.getAttribute('draggable') === 'false') {
          return;
        }
        target.classList.remove('drag-over');
        const targetKey = target.dataset ? target.dataset.orderItem : '';
        const sourceKey = reportOrderDragKey || (event.dataTransfer ? event.dataTransfer.getData('text/plain') : '');
        if (!targetKey || !sourceKey || targetKey === sourceKey) {
          return;
        }
        const current = sanitizeReportOrder(reportOrderDraft);
        const fromIndex = current.indexOf(sourceKey);
        const toIndex = current.indexOf(targetKey);
        if (fromIndex === -1 || toIndex === -1) {
          return;
        }
        current.splice(fromIndex, 1);
        const newIndex = toIndex + (fromIndex < toIndex ? 1 : 0);
        current.splice(newIndex, 0, sourceKey);
        reportOrderDraft = current;
        renderReportOrderList();
        updateReportOrderActions();
      }

function updateReportOrderActions() {
        const applyBtn = document.getElementById('aiReportOrderApplyBtn');
        if (applyBtn) {
          applyBtn.disabled = sanitizeReportOrder(reportOrderDraft).length === 0;

function ensureReportFeatureState(feature) {
        const key = feature || '';
        if (!key) {
          return null;
        }
        if (!reportFeatureState[key]) {
          reportFeatureState[key] = {
            selected: false,
            quantity: getReportFeatureDefaultQuantity(key),
            instanceDescriptions: createEmptyFeatureInstanceArray(),
            instanceTitles: createEmptyFeatureTitleArray(),
            instanceChartTypes: createEmptyFeatureChartTypeArray(),
            instanceListOrders: createEmptyFeatureListOrderArray(),
            instanceListEnumerate: createEmptyFeatureListEnumerateArray(),
            instanceListEnumStyles: createEmptyFeatureListEnumStyleArray(),
            summaryLength: REPORT_SUMMARY_LENGTH_DEFAULT,
            summaryTone: REPORT_SUMMARY_TONE_DEFAULT,
            instanceTablesEnabled: createEmptyFeatureTableToggleArray(),
            instanceTables: createEmptyFeatureTableSelectionArray()
          };
          return reportFeatureState[key];
        }
        const state = reportFeatureState[key];
        if (typeof state.quantity !== 'number') {
          state.quantity = getReportFeatureDefaultQuantity(key);
        }
        if (!Array.isArray(state.instanceDescriptions)) {
          state.instanceDescriptions = createEmptyFeatureInstanceArray();
        }
        if (!Array.isArray(state.instanceTitles)) {
          state.instanceTitles = createEmptyFeatureTitleArray();
        }
        if (!Array.isArray(state.instanceChartTypes)) {
          state.instanceChartTypes = createEmptyFeatureChartTypeArray();
        }
        if (!Array.isArray(state.instanceListOrders)) {
          state.instanceListOrders = createEmptyFeatureListOrderArray();
        }
        if (!Array.isArray(state.instanceListEnumerate)) {
          state.instanceListEnumerate = createEmptyFeatureListEnumerateArray();
        }
        if (!Array.isArray(state.instanceListEnumStyles)) {
          state.instanceListEnumStyles = createEmptyFeatureListEnumStyleArray();
        }
        if (!state.summaryLength || !REPORT_SUMMARY_LENGTH_SET[state.summaryLength]) {
          state.summaryLength = REPORT_SUMMARY_LENGTH_DEFAULT;
        }
        if (!state.summaryTone || !REPORT_SUMMARY_TONE_SET[state.summaryTone]) {
          state.summaryTone = REPORT_SUMMARY_TONE_DEFAULT;
        }
        if (!Array.isArray(state.instanceTablesEnabled)) {
          state.instanceTablesEnabled = createEmptyFeatureTableToggleArray();
        }
        if (!Array.isArray(state.instanceTables)) {
          state.instanceTables = createEmptyFeatureTableSelectionArray();
        }
        return state;
      }

function getReportFeatureAssociationOptions() {
        const selectedIds = getSelectedAiTableIds();
        const normalizedIds = Array.isArray(selectedIds) ? selectedIds.slice() : [];
        const hasAllOption = normalizedIds.indexOf(ALL_TABLES_OPTION_VALUE) !== -1;
        const allowedSet = Object.create(null);
        const entries = [];
        const cache = Array.isArray(savedTablesCache) ? savedTablesCache : [];
        const tableMap = cache.reduce(function(map, entry) {
          if (entry && entry.id) {
            map[String(entry.id)] = entry;
          }
          return map;
        }, Object.create(null));
        if (!hasAllOption) {
          normalizedIds.forEach(function(id) {
            if (!id || id === ALL_TABLES_OPTION_VALUE) {
              return;
            }
            const entry = tableMap[id];
            if (!entry) {
              return;
            }
            const label = entry.name || entry.fullRangeA1 || entry.id;
            allowedSet[entry.id] = true;
            entries.push({ id: entry.id, name: label });
          });
        }
        let message = '';
        if (normalizedIds.length === 0) {
          message = 'Selecciona tablas en la parte superior para asociarlas a cada característica.';
        } else if (hasAllOption) {
          message = 'Para asociar tablas específicas, elige tablas individuales en la parte superior.';
        } else if (entries.length === 0) {
          message = 'Las tablas seleccionadas ya no están disponibles. Actualiza la lista e inténtalo nuevamente.';
        }
        return {
          entries: entries,
          allowedSet: allowedSet,
          hasAllOption: hasAllOption,
          message: message
        };
      }

function populateFeatureTableSelect(select, options, selectedValues) {
        if (!select) {
          return;
        }
        const previousScroll = select.scrollTop;
        const previousFocus = document.activeElement === select;
        select.innerHTML = '';
        options.forEach(function(option) {
          if (!option || !option.id) {
            return;
          }
          const opt = document.createElement('option');
          opt.value = option.id;
          opt.textContent = option.name || option.id;
          select.appendChild(opt);
        });
        const selectedSet = Object.create(null);
        if (Array.isArray(selectedValues)) {
          selectedValues.forEach(function(value) {
            selectedSet[String(value)] = true;
          });
        }
        Array.prototype.forEach.call(select.options, function(option) {
          if (!option || !option.value) {
            return;
          }
          option.selected = !!selectedSet[option.value];
        });
        if (previousFocus) {
          select.focus();
        }
        select.scrollTop = previousScroll;
      }

          let normalizedTableSelections = normalizeFeatureTableSelectionArray(

          if (!state.selected) {

function createDefaultCustomizationState() {
        return {
          outputLanguage: { enabled: false, value: REPORT_OUTPUT_LANGUAGE_DEFAULT },
          tone: { enabled: false, value: REPORT_TONE_DEFAULT },
          persona: { enabled: false, value: REPORT_PERSONA_DEFAULT, customNote: '' }
        };
      }

function normalizeReportCustomizationInput(source) {
        const base = createDefaultCustomizationState();
        if (!source || typeof source !== 'object') {
          return base;
        }
        if (source.outputLanguage && typeof source.outputLanguage === 'object') {
          base.outputLanguage.enabled = !!source.outputLanguage.enabled;
          base.outputLanguage.value = normalizeOutputLanguageValue(source.outputLanguage.value);
        }
        if (source.tone && typeof source.tone === 'object') {
          base.tone.enabled = !!source.tone.enabled;
          base.tone.value = normalizeToneValue(source.tone.value);
        }
        if (source.persona && typeof source.persona === 'object') {
          base.persona.enabled = !!source.persona.enabled;
          base.persona.value = normalizePersonaValue(source.persona.value);
          base.persona.customNote = normalizePersonaCustomNote(source.persona.customNote);
        }
        if (!base.outputLanguage.enabled) {
          base.outputLanguage.value = REPORT_OUTPUT_LANGUAGE_DEFAULT;
        }
        if (!base.tone.enabled) {
          base.tone.value = REPORT_TONE_DEFAULT;
        }
        if (!base.persona.enabled) {
          base.persona.value = REPORT_PERSONA_DEFAULT;
          base.persona.customNote = '';
        }
        if (base.persona.value !== 'custom') {
          base.persona.customNote = '';
        }
        return {
          outputLanguage: {
            enabled: base.outputLanguage.enabled,
            value: base.outputLanguage.value
          },
          tone: {
            enabled: base.tone.enabled,
            value: base.tone.value
          },
          persona: {
            enabled: base.persona.enabled,
            value: base.persona.value,
            customNote: base.persona.customNote
          }
        };
      }

function ensureReportCustomizationOption(option) {
        if (!reportCustomizationState || typeof reportCustomizationState !== 'object') {
          reportCustomizationState = createDefaultCustomizationState();
        }
        if (!reportCustomizationState[option]) {
          const defaults = createDefaultCustomizationState();
          reportCustomizationState[option] = Object.assign({}, defaults[option]);
        }
        return reportCustomizationState[option];
      }

function getReportCustomizationOptionElement(option) {
        return document.querySelector(
          '#aiReportCustomizationList .ai-custom-option[data-option="' + option + '"]'
        );
      }

function setReportCustomizationOptionOpen(option, open) {
        const element = getReportCustomizationOptionElement(option);
        if (!element) {
          return;
        }
        element.dataset.open = open ? 'true' : 'false';
        const toggle = element.querySelector('[data-option-toggle="' + option + '"]');
        if (toggle) {
          toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
          const text = toggle.querySelector('.ai-custom-collapse-text');
          if (text) {
            text.textContent = open ? 'Replegar opciones' : 'Desplegar opciones';
          }
          const icon = toggle.querySelector('.ai-custom-collapse-icon');
          if (icon) {
            icon.textContent = open ? '▴' : '▾';
          }
        }
      }

function refreshReportCustomizationOption(option) {
        const element = getReportCustomizationOptionElement(option);
        if (!element) {
          return;
        }
        const state = ensureReportCustomizationOption(option);
        const isEnabled = !!state.enabled;
        const checkbox = element.querySelector('input[data-custom-option="' + option + '"]');
        if (checkbox) {
          checkbox.checked = isEnabled;
        }
        const chip = element.querySelector('.ai-custom-header-label');
        if (chip) {
          chip.classList.toggle('is-selected', isEnabled);
        }
        const toggle = element.querySelector('[data-option-toggle="' + option + '"]');
        if (toggle) {
          toggle.disabled = !isEnabled;
        }
        if (!isEnabled) {
          setReportCustomizationOptionOpen(option, false);
        }
        const isOpen = element.dataset.open !== 'false';
        const extra = element.querySelector('[data-option-extra="' + option + '"]');
        if (extra) {
          const shouldShow = isEnabled && isOpen;
          extra.classList.toggle('ai-hidden', !shouldShow);
          extra.querySelectorAll('select, textarea').forEach(function(input) {
            input.disabled = !isEnabled;
          });
        }
        if (option === 'outputLanguage') {
          const select = element.querySelector('[data-custom-select="outputLanguage"]');
          if (select) {
            const value = isEnabled
              ? normalizeOutputLanguageValue(state.value)
              : REPORT_OUTPUT_LANGUAGE_DEFAULT;
            select.value = value;
            bindSelectTooltipWithMap(select, REPORT_OUTPUT_LANGUAGE_TOOLTIPS);
          }
        } else if (option === 'tone') {
          const select = element.querySelector('[data-custom-select="tone"]');
          if (select) {
            const value = isEnabled ? normalizeToneValue(state.value) : REPORT_TONE_DEFAULT;
            select.value = value;
            bindSelectTooltipWithMap(select, REPORT_TONE_TOOLTIPS);
          }
        } else if (option === 'persona') {
          const select = element.querySelector('[data-custom-select="persona"]');
          if (select) {
            const value = isEnabled ? normalizePersonaValue(state.value) : REPORT_PERSONA_DEFAULT;
            select.value = value;
            bindSelectTooltipWithMap(select, REPORT_PERSONA_TOOLTIPS);
          }
          const customNoteWrapper = element.querySelector('[data-custom-persona-note]');
          if (customNoteWrapper) {
            const shouldShowCustom = isEnabled && normalizePersonaValue(state.value) === 'custom';
            customNoteWrapper.classList.toggle('ai-hidden', !shouldShowCustom);
            const noteInput = customNoteWrapper.querySelector('[data-custom-persona-note-input]');
            if (noteInput) {
              noteInput.disabled = !shouldShowCustom;
              noteInput.value = shouldShowCustom ? normalizePersonaCustomNote(state.customNote) : '';
            }
          }
        }
      }

function refreshAllReportCustomizationOptions() {
        REPORT_CUSTOMIZATION_OPTIONS.forEach(function(option) {
          refreshReportCustomizationOption(option);
        });
      }

function updateReportCustomizationSummary() {
        const summary = document.getElementById('aiReportCustomizationSummary');
        if (!summary) {
          return;
        }
        const active = REPORT_CUSTOMIZATION_OPTIONS.filter(function(option) {
          const state = reportCustomizationState && reportCustomizationState[option];
          return state && state.enabled;
        }).map(function(option) {
          return REPORT_CUSTOMIZATION_LABELS[option] || option;
        });
        if (active.length === 0) {
          summary.textContent = '';
          summary.classList.add('ai-hidden');
        } else {
          summary.textContent = 'Activos: ' + active.join(', ');
          summary.classList.remove('ai-hidden');
        }
      }

function handleReportCustomizationSelection(option, checked) {
        const state = ensureReportCustomizationOption(option);
        state.enabled = !!checked;
        if (!state.enabled) {
          if (option === 'outputLanguage') {
            state.value = REPORT_OUTPUT_LANGUAGE_DEFAULT;
          } else if (option === 'tone') {
            state.value = REPORT_TONE_DEFAULT;
          } else if (option === 'persona') {
            state.value = REPORT_PERSONA_DEFAULT;
            state.customNote = '';
          }
        }
        setReportCustomizationOptionOpen(option, state.enabled);
        refreshReportCustomizationOption(option);
        updateReportCustomizationSummary();
      }

function handleReportCustomizationValueChange(option, value) {
        const state = ensureReportCustomizationOption(option);
        if (!state.enabled) {
          return;
        }
        if (option === 'outputLanguage') {
          state.value = normalizeOutputLanguageValue(value);
        } else if (option === 'tone') {
          state.value = normalizeToneValue(value);
        } else if (option === 'persona') {
          state.value = normalizePersonaValue(value);
          if (state.value !== 'custom') {
            state.customNote = '';
          }
        }
        refreshReportCustomizationOption(option);
        updateReportCustomizationSummary();
      }

function handleReportCustomizationPersonaNoteChange(value) {
        const state = ensureReportCustomizationOption('persona');
        if (!state.enabled || normalizePersonaValue(state.value) !== 'custom') {
          state.customNote = '';
          return;
        }
        state.customNote = value === null || value === undefined ? '' : String(value);
      }

function resetReportCustomizationState() {
        reportCustomizationState = createDefaultCustomizationState();
        REPORT_CUSTOMIZATION_OPTIONS.forEach(function(option) {
          setReportCustomizationOptionOpen(option, false);
        });
        refreshAllReportCustomizationOptions();
        updateReportCustomizationSummary();
      }

function initializeReportCustomizationControls() {
        const list = document.getElementById('aiReportCustomizationList');
        if (!list) {
          reportCustomizationState = createDefaultCustomizationState();
          return;
        }
        REPORT_CUSTOMIZATION_OPTIONS.forEach(function(option) {
          const wrapper = getReportCustomizationOptionElement(option);
          if (!wrapper) {
            return;
          }
          const checkbox = wrapper.querySelector('input[data-custom-option="' + option + '"]');
          if (checkbox && !checkbox.dataset.bound) {
            checkbox.addEventListener('change', function() {
              handleReportCustomizationSelection(option, checkbox.checked);
            });
            checkbox.dataset.bound = 'true';
          }
          const toggle = wrapper.querySelector('[data-option-toggle="' + option + '"]');
          if (toggle && !toggle.dataset.bound) {
            toggle.addEventListener('click', function() {
              const isOpen = wrapper.dataset.open !== 'false';
              setReportCustomizationOptionOpen(option, !isOpen);
              refreshReportCustomizationOption(option);
            });
            toggle.dataset.bound = 'true';
          }
          if (option === 'outputLanguage' || option === 'tone' || option === 'persona') {
            const select = wrapper.querySelector('[data-custom-select="' + option + '"]');
            if (select && !select.dataset.bound) {
              select.addEventListener('change', function() {
                handleReportCustomizationValueChange(option, select.value);
              });
              select.dataset.bound = 'true';
            }
            if (option === 'persona') {
              const noteInput = wrapper.querySelector('[data-custom-persona-note-input]');
              if (noteInput && !noteInput.dataset.bound) {
                noteInput.addEventListener('input', function() {
                  handleReportCustomizationPersonaNoteChange(noteInput.value);
                });
                noteInput.dataset.bound = 'true';
              }
            }
          }
        });
        resetReportCustomizationState();
      }

function applyReportCustomizationState(source) {
        const normalized = normalizeReportCustomizationInput(source);
        reportCustomizationState = {
          outputLanguage: Object.assign({}, normalized.outputLanguage),
          tone: Object.assign({}, normalized.tone),
          persona: Object.assign({}, normalized.persona)
        };
        REPORT_CUSTOMIZATION_OPTIONS.forEach(function(option) {
          setReportCustomizationOptionOpen(option, !!reportCustomizationState[option].enabled);
        });
        refreshAllReportCustomizationOptions();
        updateReportCustomizationSummary();
      }

function getReportCustomizationPayload() {
        const normalized = normalizeReportCustomizationInput(reportCustomizationState);
        return {
          outputLanguage: {
            enabled: normalized.outputLanguage.enabled,
            value: normalized.outputLanguage.value
          },
          tone: {
            enabled: normalized.tone.enabled,
            value: normalized.tone.value
          },
          persona: {
            enabled: normalized.persona.enabled,
            value: normalized.persona.value,
            customNote: normalized.persona.customNote
          }
        };
      }

function normalizeFeatureId(value) {
        if (value === null || value === undefined) {
          return '';
        }
        return String(value).trim();
      }

function applyReportFeatureSelections(features, featureDetails) {
        initializeReportFeatureControls();
        const selectedSet = Object.create(null);
        if (Array.isArray(features)) {
          features.forEach(function(value) {
            const id = normalizeFeatureId(value);
            if (id) {
              selectedSet[id] = true;
            }
          });
        }
        const detailMap = Object.create(null);
        if (Array.isArray(featureDetails)) {
          featureDetails.forEach(function(detail) {
            if (!detail) {
              return;
            }
            const featureId = normalizeFeatureId(detail.feature);
            if (!featureId) {
              return;
            }
            if (!selectedSet[featureId]) {
              return;
            }
            if (detailMap[featureId]) {
              return;
            }
            const quantityValue = clampReportFeatureQuantity(detail.quantity, featureId);
            const instanceDescriptions = normalizeFeatureInstanceArray(detail.instanceDescriptions);
            const instanceTitles = normalizeFeatureTitleArray(detail.instanceTitles);
            const instanceChartTypes = normalizeFeatureChartTypeArray(detail.instanceChartTypes);
            const instanceListOrders = normalizeFeatureListOrderArray(detail.instanceListOrders);
            const instanceListEnumerate = normalizeFeatureListEnumerateArray(
              detail.instanceListEnumerate
            );
            const instanceListEnumStyles = normalizeFeatureListEnumStyleArray(
              detail.instanceListEnumStyles
            );
            const summaryLengthValue = normalizeSummaryLengthValue(detail.summaryLength);
            const summaryToneValue = normalizeSummaryToneValue(detail.summaryTone);
            const instanceTableToggles = normalizeFeatureTableToggleArray(detail.instanceTablesEnabled);
            const instanceTableSelections = normalizeFeatureTableSelectionArray(detail.instanceTables);
            detailMap[featureId] = {
              quantity: quantityValue,
              instanceDescriptions: instanceDescriptions,
              instanceTitles: instanceTitles,
              instanceChartTypes: instanceChartTypes,
              instanceListOrders: instanceListOrders,
              instanceListEnumerate: instanceListEnumerate,
              instanceListEnumStyles: instanceListEnumStyles,
              summaryLength: summaryLengthValue,
              summaryTone: summaryToneValue,
              instanceTablesEnabled: instanceTableToggles,
              instanceTables: instanceTableSelections
            };
          });
        }
        Object.keys(reportFeatureState).forEach(function(feature) {
          const state = ensureReportFeatureState(feature);
          const isSelected = !!selectedSet[feature];
          state.selected = isSelected;
          if (isSelected) {
            const detail = detailMap[feature];
            state.quantity = detail
              ? clampReportFeatureQuantity(detail.quantity, feature)
              : getReportFeatureDefaultQuantity(feature);
            state.instanceDescriptions = detail
              ? normalizeFeatureInstanceArray(detail.instanceDescriptions)
              : createEmptyFeatureInstanceArray();
            state.instanceTitles = detail
              ? normalizeFeatureTitleArray(detail.instanceTitles)
              : createEmptyFeatureTitleArray();
            state.instanceChartTypes = detail
              ? normalizeFeatureChartTypeArray(detail.instanceChartTypes)
              : createEmptyFeatureChartTypeArray();
            state.instanceListOrders = detail
              ? normalizeFeatureListOrderArray(detail.instanceListOrders)
              : createEmptyFeatureListOrderArray();
            state.instanceListEnumerate = detail
              ? normalizeFeatureListEnumerateArray(detail.instanceListEnumerate)
              : createEmptyFeatureListEnumerateArray();
            state.instanceListEnumStyles = detail
              ? normalizeFeatureListEnumStyleArray(detail.instanceListEnumStyles)
              : createEmptyFeatureListEnumStyleArray();
            state.summaryLength = detail
              ? normalizeSummaryLengthValue(detail.summaryLength)
              : REPORT_SUMMARY_LENGTH_DEFAULT;
            state.summaryTone = detail
              ? normalizeSummaryToneValue(detail.summaryTone)
              : REPORT_SUMMARY_TONE_DEFAULT;
            state.instanceTablesEnabled = detail
              ? normalizeFeatureTableToggleArray(detail.instanceTablesEnabled)
              : createEmptyFeatureTableToggleArray();
            state.instanceTables = detail
              ? cloneFeatureTableSelectionArray(
                  normalizeFeatureTableSelectionArray(detail.instanceTables)
                )
              : createEmptyFeatureTableSelectionArray();
          } else {
            state.quantity = getReportFeatureDefaultQuantity(feature);
            state.instanceDescriptions = createEmptyFeatureInstanceArray();
            state.instanceTitles = createEmptyFeatureTitleArray();
            state.instanceChartTypes = createEmptyFeatureChartTypeArray();
            state.instanceListOrders = createEmptyFeatureListOrderArray();
            state.instanceListEnumerate = createEmptyFeatureListEnumerateArray();
            state.instanceListEnumStyles = createEmptyFeatureListEnumStyleArray();
            state.summaryLength = REPORT_SUMMARY_LENGTH_DEFAULT;
            state.summaryTone = REPORT_SUMMARY_TONE_DEFAULT;
            state.instanceTablesEnabled = createEmptyFeatureTableToggleArray();
            state.instanceTables = createEmptyFeatureTableSelectionArray();
          }
          refreshReportFeatureOption(feature);
        });
        updateSelectedReportFeatures();
      }

function setAiTablesSelection(values) {
        const select = document.getElementById('aiSavedTables');
        const list = document.getElementById('aiSavedTablesList');
        if (!select || !list) {
          return;
        }
        const normalizedValues = Array.isArray(values)
          ? values.map(function(value) {
              return String(value);
            })
          : [];
        const selectedMap = Object.create(null);
        normalizedValues.forEach(function(value) {
          selectedMap[value] = true;
        });
        Array.prototype.forEach.call(select.options, function(option) {
          if (!option || !option.value || option.disabled) {
            option.selected = false;
            return;
          }
          option.selected = !!selectedMap[option.value];
        });
        renderAiSavedTablesList(savedTablesCache, {
          includeAll: list.dataset && list.dataset.allValue === ALL_TABLES_OPTION_VALUE,
          allValue: list.dataset && list.dataset.allValue === ALL_TABLES_OPTION_VALUE ? ALL_TABLES_OPTION_VALUE : '',
          allLabel: 'Todas las tablas',
          groupBySheet: list.dataset && list.dataset.groupBySheet === 'true',
          disabled: select.disabled,
          selectedValues: getSelectedOptionValues(select)
        });
        refreshAllReportFeatureOptions();
      }

async function loadReportFavoriteIntoPanel(action) {
        if (!action) {
          return;
        }
        await attemptTabChange('aiTab', { force: true });
        const aiActionSelect = document.getElementById('aiActionSelect');
        if (aiActionSelect) {
          aiActionSelect.value = 'report';
        }
        updateAiActionState();
        if (Array.isArray(action.tables) && action.tables.length > 0) {
          try {
            await refreshSavedTables(['aiSavedTables'], {});
          } catch (err) {
            console.log('No se pudieron actualizar las tablas para el reporte favorito.', err);
          }
          setAiTablesSelection(action.tables);
        }
        if (action.format) {
          handleReportFormatSelection(action.format);
        } else {
          handleReportFormatSelection('');
        }
        applyReportFeatureSelections(action.features || [], action.featureDetails || []);
        applyReportFeatureOrder(action.featureOrder || []);
        applyReportCustomizationState(action.customization || {});
        const descToggle = document.getElementById('aiReportDescriptionToggle');
        if (descToggle) {
          descToggle.checked = !!action.descriptionEnabled;
        }
        toggleReportDescriptionField(action.descriptionEnabled);
        const descField = document.getElementById('aiReportDescription');
        if (descField) {
          descField.value = action.descriptionEnabled ? action.descriptionText || '' : '';
        }
        const fileNameInput = document.getElementById('aiReportFileName');
        if (fileNameInput) {
          fileNameInput.value = action.fileName || '';
        }
        const fileDateToggle = document.getElementById('aiReportFileDateToggle');
        reportFileDateEnabled = !!action.appendDateToFile;
        if (fileDateToggle) {
          fileDateToggle.checked = reportFileDateEnabled;
        }
        updateReportFileExtension();
        selectedReportChannels = Array.isArray(action.channels) ? action.channels.slice() : [];
        const channelSet = Object.create(null);
        selectedReportChannels.forEach(function(channel) {
          if (channel) {
            channelSet[channel] = true;
          }
        });
        const channelCheckboxes = getReportDeliveryCheckboxes();
        channelCheckboxes.forEach(function(cb) {
          if (cb && cb.value) {
            cb.checked = !!channelSet[cb.value];
          }
        });
        updateReportDeliverySummary();
        updateReportDeliverySections();
        const deliverySection = document.getElementById('aiReportDeliverySection');
        if (deliverySection) {
          deliverySection.classList.remove('ai-hidden');
        }
        renderReportEmailList(action.emails || []);
        renderReportPhoneList(action.phones || []);
        setReportHelperMessage('aiReportEmailMessage', '');
        setReportHelperMessage('aiReportPhoneMessage', '');
        closeReportFavoriteModal({ resetName: false });
        await showMessageModal('El reporte favorito se cargó en el Panel IA. Ajusta los valores y guarda los cambios si es necesario.', {
          title: 'Reporte cargado',
          variant: 'info',
          primaryText: 'Aceptar',
          secondaryText: ''
        });
      }

function getSelectedAiTableIds() {
        const select = document.getElementById('aiSavedTables');
        if (!select || !select.options) {
          return [];
        }
        const values = [];
        Array.prototype.forEach.call(select.options, function(option) {
          if (option && option.value && option.selected && !option.disabled) {
            values.push(option.value);
          }
        });
        return values;
      }

function openReportFavoriteModal() {
        if (savingReportFavorite) {
          return;
        }
        const overlay = document.getElementById('aiFavoriteModalOverlay');
        const trigger = document.getElementById('aiReportFavoriteBtn');
        reportFavoriteModalVisible = true;
        if (overlay) {
          overlay.classList.add('show');
          overlay.setAttribute('aria-hidden', 'false');
        }
        if (trigger) {
          trigger.setAttribute('aria-expanded', 'true');
        }
        const nameInput = document.getElementById('aiReportFavoriteName');
        if (nameInput) {
          window.setTimeout(function() {
            nameInput.focus();
            nameInput.select();
          }, 0);
        }
      }

function closeReportFavoriteModal(options) {
        options = options || {};
        const overlay = document.getElementById('aiFavoriteModalOverlay');
        const trigger = document.getElementById('aiReportFavoriteBtn');
        reportFavoriteModalVisible = false;
        if (overlay) {
          overlay.classList.remove('show');
          overlay.setAttribute('aria-hidden', 'true');
        }
        if (trigger) {
          trigger.setAttribute('aria-expanded', 'false');
        }
        if (options.resetName) {
          const nameInput = document.getElementById('aiReportFavoriteName');
          if (nameInput) {
            nameInput.value = '';
          }
        }
        if (options.focusTrigger && trigger) {
          trigger.focus();
        }
        savingReportFavorite = false;
        const saveBtn = document.getElementById('aiReportFavoriteSaveBtn');
        if (saveBtn) {
          saveBtn.disabled = false;
        }
      }

async function handleReportFavoriteSave() {
        if (savingReportFavorite) {
          return;
        }
        const nameInput = document.getElementById('aiReportFavoriteName');
        const favoriteName = nameInput ? nameInput.value.trim() : '';
        const fileNameInput = document.getElementById('aiReportFileName');
        const fileNameValue = fileNameInput ? fileNameInput.value.trim() : '';
        const sanitizedFileName = sanitizeReportFileName(fileNameValue);
        const selectedFeatures = Array.isArray(selectedReportFeatures)
          ? selectedReportFeatures.slice()
          : [];
        const selectedChannels = Array.isArray(selectedReportChannels)
          ? selectedReportChannels.slice()
          : [];
        const missingItems = [];
        const selectedTables = getSelectedAiTableIds();
        const hasAllTablesOption = Array.isArray(selectedTables)
          ? selectedTables.indexOf(ALL_TABLES_OPTION_VALUE) !== -1
          : false;
        const allowedTableSet = Object.create(null);
        if (Array.isArray(selectedTables) && !hasAllTablesOption) {
          selectedTables.forEach(function(value) {
            if (value && value !== ALL_TABLES_OPTION_VALUE) {
              allowedTableSet[value] = true;
            }
          });
        }

        if (!favoriteName) {
          missingItems.push('Nombre del reporte favorito');
        }
        if (!sanitizedFileName) {
          missingItems.push('Nombre del archivo');
        }
        if (!selectedReportFormat) {
          missingItems.push('Formato del reporte');
        }
        if (selectedFeatures.length === 0) {
          missingItems.push('Al menos una característica configurada');
        }
        const featureDetailMap = {};
        const featureDescriptionIssues = [];
        const featureAssociationIssues = [];

        selectedFeatures.forEach(function(feature) {
          const state = ensureReportFeatureState(feature);
          const label = REPORT_FEATURE_LABELS[feature] || feature;
          const quantityValue = state ? clampReportFeatureQuantity(state.quantity, feature) : 1;
          const baseDescriptions = normalizeFeatureInstanceArray(state ? state.instanceDescriptions : []);
          const baseTitles = normalizeFeatureTitleArray(state ? state.instanceTitles : []);
          const baseChartTypes = normalizeFeatureChartTypeArray(state ? state.instanceChartTypes : []);
          const baseListOrders = normalizeFeatureListOrderArray(state ? state.instanceListOrders : []);
          const baseListEnumerate = normalizeFeatureListEnumerateArray(
            state ? state.instanceListEnumerate : []
          );
          const baseListEnumStyles = normalizeFeatureListEnumStyleArray(
            state ? state.instanceListEnumStyles : []
          );
          const summaryLengthValue = state
            ? normalizeSummaryLengthValue(state.summaryLength)
            : REPORT_SUMMARY_LENGTH_DEFAULT;
          const summaryToneValue = state
            ? normalizeSummaryToneValue(state.summaryTone)
            : REPORT_SUMMARY_TONE_DEFAULT;
          let baseTableToggles = normalizeFeatureTableToggleArray(
            state ? state.instanceTablesEnabled : []
          );
          let baseTableSelections = normalizeFeatureTableSelectionArray(
            state ? state.instanceTables : [],
            hasAllTablesOption ? null : allowedTableSet
          );
          if (hasAllTablesOption) {
            baseTableToggles = createEmptyFeatureTableToggleArray();
            baseTableSelections = createEmptyFeatureTableSelectionArray();
          }
          const trimmedDescriptions = baseDescriptions.map(function(text) {
            return text ? String(text).trim() : '';
          });
          for (var idx = 0; idx < quantityValue; idx++) {
            if (!trimmedDescriptions[idx]) {
              featureDescriptionIssues.push({ feature: label, index: idx });
            }
            if (!hasAllTablesOption && baseTableToggles[idx] && baseTableSelections[idx].length === 0) {
              featureAssociationIssues.push({ feature: label, index: idx });
            }
          }
          if (state) {
            state.quantity = quantityValue;
            state.instanceDescriptions = trimmedDescriptions.slice();
            state.instanceTitles = baseTitles.slice();
            state.instanceChartTypes = baseChartTypes.slice();
            state.instanceListOrders = baseListOrders.slice();
            state.instanceListEnumerate = baseListEnumerate.slice();
            state.instanceListEnumStyles = baseListEnumStyles.slice();
            state.summaryLength = summaryLengthValue;
            state.summaryTone = summaryToneValue;
            state.instanceTablesEnabled = baseTableToggles.slice();
            state.instanceTables = cloneFeatureTableSelectionArray(baseTableSelections);
          }
          featureDetailMap[feature] = {
            quantity: quantityValue,
            instanceDescriptions: trimmedDescriptions.slice(),
            instanceTitles: baseTitles.slice(),
            instanceChartTypes: baseChartTypes.slice(),
            instanceListOrders: baseListOrders.slice(),
            instanceListEnumerate: baseListEnumerate.slice(),
            instanceListEnumStyles: baseListEnumStyles.slice(),
            summaryLength: summaryLengthValue,
            summaryTone: summaryToneValue,
            instanceTablesEnabled: baseTableToggles.slice(),
            instanceTables: cloneFeatureTableSelectionArray(baseTableSelections)
          };
        });

        if (featureDescriptionIssues.length > 0) {
          featureDescriptionIssues.forEach(function(issue) {
            missingItems.push('Descripción ' + (issue.index + 1) + ' para ' + issue.feature);
          });
        }

        if (featureAssociationIssues.length > 0) {
          featureAssociationIssues.forEach(function(issue) {
            missingItems.push('Tablas asociadas para ' + issue.feature + ' #' + (issue.index + 1));
          });
        }

        if (selectedChannels.length === 0) {
          missingItems.push('Al menos un canal para compartir');
        }

        if (missingItems.length > 0) {
          await showMessageModal('Faltan datos para guardar en favoritos:\n• ' + missingItems.join('\n• '), {
            title: 'Completa los datos requeridos',
            variant: 'warning'
          });
          return;
        }

        try {
          await ensureSavedActionsCache();
        } catch (err) {
          await showMessageModal(
            'No se pudieron validar los favoritos existentes: ' + (err && err.message ? err.message : err),
            {
              title: 'Validación pendiente',
              variant: 'error'
            }
          );
          return;
        }
        const normalizedFavoriteName = favoriteName.toLowerCase();
        const actionsSnapshot =
          typeof getSavedActionsSnapshot === 'function' ? getSavedActionsSnapshot() : [];
        const duplicateFavorite = actionsSnapshot.some(function(entry) {
          if (!entry || !entry.name) {
            return false;
          }
          const type = (entry.type || '').toLowerCase();
          if (type !== 'reportfavorite') {
            return false;
          }
          return entry.name.trim().toLowerCase() === normalizedFavoriteName;
        });
        if (duplicateFavorite) {
          await showMessageModal('Ya existe un favorito con ese nombre. Elige otro nombre para guardarlo.', {
            title: 'Nombre duplicado',
            variant: 'warning'
          });
          return;
        }

        selectedFeatures.forEach(function(feature) {
          const state = ensureReportFeatureState(feature);
          if (!state) {
            return;
          }
          const detail = featureDetailMap[feature];
          if (detail) {
            state.quantity = clampReportFeatureQuantity(detail.quantity, feature);
            state.instanceDescriptions = normalizeFeatureInstanceArray(detail.instanceDescriptions);
            refreshReportFeatureOption(feature);
          }
        });

        if (!selectedTables || selectedTables.length === 0) {
          await showMessageModal('Selecciona al menos una tabla para asociar el reporte.', {
            title: 'Tablas requeridas',
            variant: 'warning'
          });
          return;
        }

        const descriptionToggle = document.getElementById('aiReportDescriptionToggle');
        const descriptionField = document.getElementById('aiReportDescription');
        const descriptionEnabled = descriptionToggle ? !!descriptionToggle.checked : false;
        const descriptionText =
          descriptionEnabled && descriptionField ? descriptionField.value || '' : '';
        const featureDetails = selectedFeatures.map(function(feature) {
          const detail = featureDetailMap[feature] || {
            quantity: getReportFeatureDefaultQuantity(feature),
            instanceDescriptions: createEmptyFeatureInstanceArray(),
            instanceTitles: createEmptyFeatureTitleArray(),
            instanceChartTypes: createEmptyFeatureChartTypeArray(),
            instanceListOrders: createEmptyFeatureListOrderArray(),
            instanceListEnumerate: createEmptyFeatureListEnumerateArray(),
            instanceListEnumStyles: createEmptyFeatureListEnumStyleArray(),
            summaryLength: REPORT_SUMMARY_LENGTH_DEFAULT,
            summaryTone: REPORT_SUMMARY_TONE_DEFAULT,
            instanceTablesEnabled: createEmptyFeatureTableToggleArray(),
            instanceTables: createEmptyFeatureTableSelectionArray()
          };
          return {
            feature: feature,
            quantity: clampReportFeatureQuantity(detail.quantity, feature),
            instanceDescriptions: normalizeFeatureInstanceArray(detail.instanceDescriptions),
            instanceTitles: normalizeFeatureTitleArray(detail.instanceTitles),
            instanceChartTypes: normalizeFeatureChartTypeArray(detail.instanceChartTypes),
            instanceListOrders: normalizeFeatureListOrderArray(detail.instanceListOrders),
            instanceListEnumerate: normalizeFeatureListEnumerateArray(detail.instanceListEnumerate),
            instanceListEnumStyles: normalizeFeatureListEnumStyleArray(detail.instanceListEnumStyles),
            summaryLength: normalizeSummaryLengthValue(detail.summaryLength),
            summaryTone: normalizeSummaryToneValue(detail.summaryTone),
            instanceTablesEnabled: normalizeFeatureTableToggleArray(detail.instanceTablesEnabled),
            instanceTables: cloneFeatureTableSelectionArray(
              normalizeFeatureTableSelectionArray(
                detail.instanceTables,
                hasAllTablesOption ? null : allowedTableSet
              )
            )
          };
        });
        const customizationPayload = getReportCustomizationPayload();
        const payload = {
          name: favoriteName,
          format: selectedReportFormat,
          fileName: sanitizedFileName,
          fileExtension: getCurrentReportExtension(),
          appendDateToFile: !!reportFileDateEnabled,
          tables: selectedTables,
          channels: selectedChannels,
          descriptionEnabled: descriptionEnabled,
          description: descriptionText,
          features: selectedFeatures,
          featureDetails: featureDetails,
          featureOrder: buildReportOrderPayload(),
          customization: customizationPayload,
          emails: sanitizeContactSelection(
            getCheckedValuesFromList('aiReportEmailList'),
            REPORT_ALL_EMAILS_VALUE
          ),
          phones: sanitizeContactSelection(
            getCheckedValuesFromList('aiReportPhoneList'),
            REPORT_ALL_PHONES_VALUE
          )
        };
        const saveBtn = document.getElementById('aiReportFavoriteSaveBtn');
        try {
          savingReportFavorite = true;
          if (saveBtn) {
            saveBtn.disabled = true;
          }
          const result = await callServerFunction('saveReportFavorite', payload);
          if (result && result.error) {
            throw new Error(result.error);
          }
          closeReportFavoriteModal({ resetName: true });
          await showMessageModal('Reporte guardado en favoritos.', {
            title: 'Favorito guardado',
            variant: 'success'
          });
          if (typeof refreshSavedActions === 'function') {
            await refreshSavedActions({
              selectId:
                result && result.id
                  ? result.id
                  : typeof getCurrentSavedActionId === 'function'
                  ? getCurrentSavedActionId()
                  : ''
            });
          }
        } catch (err) {
          await showMessageModal(
            'No se pudo guardar el reporte favorito: ' + (err && err.message ? err.message : err),
            {
              title: 'No se pudo guardar',
              variant: 'error'
            }
          );
        } finally {
          savingReportFavorite = false;
          if (saveBtn) {
            saveBtn.disabled = false;
          }
        }
      }
