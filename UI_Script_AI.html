function createAiMultiItem(entry, selected, options) {
        const config = options || {};
        const hasOverride = Object.prototype.hasOwnProperty.call(config, 'valueOverride');
        const value = hasOverride
          ? String(config.valueOverride || '')
          : entry && entry.id
          ? String(entry.id)
          : '';
        if (!value) {
          return null;
        }
        const labelText = config.labelOverride
          ? String(config.labelOverride)
          : entry && entry.name
          ? entry.name
          : value;
        const item = document.createElement('div');
        item.className = 'ai-multi-item';
        if (config.allOption) {
          item.classList.add('all-option');
        }
        item.dataset.value = value;
        item.setAttribute('role', 'option');
        item.tabIndex = 0;
        if (selected) {
          item.classList.add('selected');
        }
        item.setAttribute('aria-selected', selected ? 'true' : 'false');

        if (entry) {
          styleEditListItem(item, entry);
        } else {
          item.style.removeProperty('--header-color');
          item.style.removeProperty('--header-text-color');
          item.dataset.headerColor = '';
        }

        const label = document.createElement('span');
        label.className = 'ai-label';
        label.textContent = labelText;
        item.appendChild(label);

        const check = document.createElement('span');
        check.className = 'ai-check';
        item.appendChild(check);

        return item;
      }

function renderAiSavedTablesList(entries, config) {
        const listEl = document.getElementById('aiSavedTablesList');
        const selectEl = document.getElementById('aiSavedTables');
        if (!listEl || !selectEl) {
          return;
        }
        const data = Array.isArray(entries) ? entries : [];
        const options = config || {};
        const includeAll = !!options.includeAll;
        const allValue = options.allValue || '';
        const allLabel = options.allLabel || 'Todas las tablas';
        const groupBySheet = !!options.groupBySheet;
        const disabled = !!options.disabled;
        const selectedValues = Array.isArray(options.selectedValues) ? options.selectedValues : [];
        const selectedSet = Object.create(null);
        selectedValues.forEach(function(value) {
          selectedSet[String(value)] = true;
        });

        listEl.innerHTML = '';
        listEl.setAttribute('role', 'listbox');
        listEl.setAttribute('aria-multiselectable', 'true');
        listEl.dataset.allValue = includeAll ? allValue : '';
        listEl.classList.toggle('disabled', disabled);
        listEl.setAttribute('aria-disabled', disabled ? 'true' : 'false');

        if (disabled || data.length === 0) {
          const empty = document.createElement('div');
          empty.className = 'ai-multi-empty';
          empty.textContent = 'No hay tablas guardadas';
          listEl.appendChild(empty);
          return;
        }

        if (includeAll && allValue) {
          const allItem = createAiMultiItem(null, !!selectedSet[allValue], {
            valueOverride: allValue,
            labelOverride: allLabel,
            allOption: true
          });
          if (allItem) {
            listEl.appendChild(allItem);
          }
        }

        if (groupBySheet) {
          const grouped = Object.create(null);
          const order = [];
          data.forEach(function(entry) {
            if (!entry || !entry.id) {
              return;
            }
            const sheetLabel = entry.sheetName ? entry.sheetName : 'Sin hoja';
            if (!grouped[sheetLabel]) {
              grouped[sheetLabel] = [];
              order.push(sheetLabel);
            }
            grouped[sheetLabel].push(entry);
          });
          order.forEach(function(sheetLabel) {
            const wrapper = document.createElement('div');
            wrapper.className = 'ai-multi-group';
            const labelEl = document.createElement('div');
            labelEl.className = 'ai-multi-group-label';
            labelEl.textContent = sheetLabel;
            wrapper.appendChild(labelEl);
            grouped[sheetLabel].forEach(function(entry) {
              const item = createAiMultiItem(entry, !!selectedSet[entry.id]);
              if (item) {
                wrapper.appendChild(item);
              }
            });
            listEl.appendChild(wrapper);
          });
        } else {
          data.forEach(function(entry) {
            if (!entry || !entry.id) {
              return;
            }
            const item = createAiMultiItem(entry, !!selectedSet[entry.id]);
            if (item) {
              listEl.appendChild(item);
            }
          });
        }
        updateAiListSelectionUI(selectEl);
      }

function updateAiListSelectionUI(select) {
        const listEl = document.getElementById('aiSavedTablesList');
        if (!listEl || !select) {
          return;
        }
        const selectedSet = Object.create(null);
        if (select.options) {
          Array.prototype.forEach.call(select.options, function(option) {
            if (option && option.value && option.selected && !option.disabled) {
              selectedSet[option.value] = true;
            }
          });
        }
        const items = listEl.querySelectorAll('.ai-multi-item');
        Array.prototype.forEach.call(items, function(item) {
          const value = item && item.dataset ? item.dataset.value : '';
          if (!value) {
            item.classList.remove('selected');
            item.setAttribute('aria-selected', 'false');
            return;
          }
          if (selectedSet[value]) {
            item.classList.add('selected');
            item.setAttribute('aria-selected', 'true');
          } else {
            item.classList.remove('selected');
            item.setAttribute('aria-selected', 'false');
          }
        });
      }

function toggleAiListValue(value) {
        const selectEl = document.getElementById('aiSavedTables');
        const listEl = document.getElementById('aiSavedTablesList');
        if (!selectEl || !listEl || selectEl.disabled) {
          return;
        }
        const options = selectEl.options ? Array.prototype.slice.call(selectEl.options) : [];
        if (!options.length) {
          return;
        }
        const allValue = listEl.dataset.allValue || selectEl.dataset.allValue || '';
        const targetValue = String(value || '');
        if (!targetValue) {
          return;
        }
        if (allValue && targetValue === allValue) {
          let currentlySelected = false;
          options.forEach(function(option) {
            if (option && option.value === allValue && option.selected) {
              currentlySelected = true;
            }
          });
          const newState = !currentlySelected;
          options.forEach(function(option) {
            if (!option || option.disabled || !option.value) {
              return;
            }
            if (option.value === allValue) {
              option.selected = newState;
            } else {
              option.selected = false;
            }
          });
        } else {
          let targetOption = null;
          options.forEach(function(option) {
            if (option && option.value === targetValue) {
              targetOption = option;
            }
          });
          if (!targetOption) {
            return;
          }
          const newState = !targetOption.selected;
          targetOption.selected = newState;
          if (newState && allValue) {
            options.forEach(function(option) {
              if (option && option.value === allValue) {
                option.selected = false;
              }
            });
          }
        }
        selectEl.dispatchEvent(new Event('change', { bubbles: true }));
        updateAiListSelectionUI(selectEl);
      }

function normalizeReportEmailEntry(entry) {
        if (!entry) {
          return null;
        }
        if (typeof entry === 'string') {
          const address = entry.trim();
          return address ? { address: address, label: '' } : null;
        }
        if (typeof entry === 'object') {
          const address = typeof entry.address === 'string'
            ? entry.address.trim()
            : typeof entry.email === 'string'
            ? entry.email.trim()
            : typeof entry.value === 'string'
            ? entry.value.trim()
            : '';
          if (!address) {
            return null;
          }
          const label = typeof entry.label === 'string'
            ? entry.label.trim()
            : typeof entry.name === 'string'
            ? entry.name.trim()
            : '';
          return { address: address, label: label };
        }
        return null;
      }

function sanitizeContactSelection(values, allValue) {
        if (!Array.isArray(values) || values.length === 0) {
          return [];
        }
        if (values.indexOf(allValue) !== -1) {
          return [allValue];
        }
        const seen = {};
        const result = [];
        values.forEach(function(value) {
          if (value && !seen[value]) {
            seen[value] = true;
            result.push(value);
          }
        });
        return result;
      }

function ensureContactListHandler(listId, allValue) {
        const list = document.getElementById(listId);
        if (!list) {
          return;
        }
        if (list.dataset && list.dataset.handlerAttached === 'true') {
          return;
        }
        list.addEventListener('change', function(event) {
          const target = event.target;
          if (!target || target.type !== 'checkbox') {
            return;
          }
          if (target.value === allValue) {
            if (target.checked) {
              Array.prototype.slice
                .call(list.querySelectorAll('input[type="checkbox"]'))
                .forEach(function(cb) {
                  if (cb !== target) {
                    cb.checked = false;
                  }
                });
            }
          } else if (target.checked) {
            const allOption = list.querySelector('input[type="checkbox"][value="' + allValue + '"]');
            if (allOption) {
              allOption.checked = false;
            }
          }
        });
        if (list.dataset) {
          list.dataset.handlerAttached = 'true';
        }
      }

function normalizeReportPhoneEntry(entry) {
        if (!entry) {
          return null;
        }
        if (typeof entry === 'string') {
          const number = entry.trim();
          return number ? { number: number, label: '' } : null;
        }
        if (typeof entry === 'object') {
          const number = typeof entry.number === 'string'
            ? entry.number.trim()
            : typeof entry.phone === 'string'
            ? entry.phone.trim()
            : typeof entry.value === 'string'
            ? entry.value.trim()
            : '';
          if (!number) {
            return null;
          }
          const label = typeof entry.label === 'string'
            ? entry.label.trim()
            : typeof entry.name === 'string'
            ? entry.name.trim()
            : '';
          return { number: number, label: label };
        }
        return null;
      }

function loadReportContactList(key) {
        const storage = getLocalStorage();
        if (!storage) {
          return [];
        }
        try {
          const raw = storage.getItem(REPORT_STORAGE_KEYS[key]);
          if (!raw) {
            return [];
          }
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed)) {
            if (key === 'phones') {
              const seenNumbers = {};
              return parsed
                .map(normalizeReportPhoneEntry)
                .filter(function(entry) {
                  if (!entry || !entry.number || seenNumbers[entry.number]) {
                    return false;
                  }
                  seenNumbers[entry.number] = true;
                  return true;
                });
            }
            if (key === 'emails') {
              const seenEmails = {};
              return parsed
                .map(normalizeReportEmailEntry)
                .filter(function(entry) {
                  if (!entry || !entry.address || seenEmails[entry.address]) {
                    return false;
                  }
                  seenEmails[entry.address] = true;
                  return true;
                });
            }
          }
        } catch (err) {
          console.log('No se pudieron cargar los contactos guardados para reportes.', err);
        }
        return [];
      }

function persistReportContactList(key, list) {
        const storage = getLocalStorage();
        if (!storage) {
          return;
        }
        try {
          storage.setItem(REPORT_STORAGE_KEYS[key], JSON.stringify(list || []));
        } catch (err) {
          console.log('No se pudieron guardar los contactos de reportes.', err);
        }
      }

function getReportDateSuffix() {
        const now = new Date();
        const day = String(now.getDate()).padStart(2, '0');
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const year = String(now.getFullYear()).slice(-2);
        return '_' + day + '_' + month + '_' + year;
      }

function sanitizeReportFileName(value) {
        if (value === null || value === undefined) {
          return '';
        }
        let text = String(value).trim();
        if (!text) {
          return '';
        }
        if (typeof text.normalize === 'function') {
          text = text.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
        }
        text = text.replace(/\s+/g, '');
        text = text.replace(/[^A-Za-z0-9_-]/g, '');
        return text;
      }

function updateReportFileExtension() {
        const preview = document.getElementById('aiReportFilePreview');
        if (!preview) {

        const sanitizedBase = sanitizeReportFileName(rawValue);
        const ext = getCurrentReportExtension();
        const suffix = reportFileDateEnabled ? getReportDateSuffix() : '';
        let finalName = '';
        if (sanitizedBase) {
          finalName = sanitizedBase + suffix;
          if (ext) {
            finalName += '.' + ext;
          }
        }
        preview.textContent = finalName || '—';
        preview.dataset.empty = finalName ? 'false' : 'true';

function getReportFeatureFixedQuantity(feature) {
        if (!feature) {
          return 0;
        }
        const fixed = REPORT_FEATURE_FIXED_QUANTITY[feature];
        if (!fixed) {
          return 0;
        }
        if (fixed < 1) {
          return 1;
        }
        if (fixed > REPORT_FEATURE_MAX_QUANTITY) {
          return REPORT_FEATURE_MAX_QUANTITY;
        }
        return fixed;
      }

function getReportFeatureDefaultQuantity(feature) {
        const fixed = getReportFeatureFixedQuantity(feature);
        if (fixed > 0) {
          return fixed;
        }
        return 1;
      }

function reportFeatureAllowsQuantity(feature) {
        if (!feature) {
          return true;
        }
        return !REPORT_FEATURES_WITHOUT_QUANTITY[feature];
      }

function clampReportFeatureQuantity(value, feature) {
        if (!reportFeatureAllowsQuantity(feature)) {
          return getReportFeatureDefaultQuantity(feature);
        }
        const parsed = parseInt(value, 10);
        if (isNaN(parsed) || parsed < 1) {
          return 1;
        }
        if (parsed > REPORT_FEATURE_MAX_QUANTITY) {
          return REPORT_FEATURE_MAX_QUANTITY;
        }
        return parsed;
      }

function createEmptyFeatureTitleArray() {

function createEmptyFeatureChartTypeArray() {

function createEmptyFeatureListOrderArray() {

function createEmptyFeatureListEnumerateArray() {

function normalizeFeatureInstanceArray(source) {

function normalizeFeatureTitleArray(source) {

function normalizeChartTypeValue(value) {

function ensureReportFeatureState(feature) {
        const key = feature || '';
        if (!key) {
          return null;
        }
        if (!reportFeatureState[key]) {
          reportFeatureState[key] = {
            selected: false,
            quantity: getReportFeatureDefaultQuantity(key),
            instanceDescriptions: createEmptyFeatureInstanceArray(),
            instanceTitles: createEmptyFeatureTitleArray(),
            instanceChartTypes: createEmptyFeatureChartTypeArray(),
            instanceListOrders: createEmptyFeatureListOrderArray(),
            instanceListEnumerate: createEmptyFeatureListEnumerateArray(),
            instanceListEnumStyles: createEmptyFeatureListEnumStyleArray(),
            instanceCommentFocus: createEmptyFeatureCommentFocusArray()
          };
          return reportFeatureState[key];
        }
        const state = reportFeatureState[key];
        if (typeof state.quantity !== 'number') {
          state.quantity = getReportFeatureDefaultQuantity(key);
        }
        if (!Array.isArray(state.instanceDescriptions)) {
          state.instanceDescriptions = createEmptyFeatureInstanceArray();
        }
        if (!Array.isArray(state.instanceTitles)) {
          state.instanceTitles = createEmptyFeatureTitleArray();
        }
        if (!Array.isArray(state.instanceChartTypes)) {
          state.instanceChartTypes = createEmptyFeatureChartTypeArray();
        }
        if (!Array.isArray(state.instanceListOrders)) {
          state.instanceListOrders = createEmptyFeatureListOrderArray();
        }
        if (!Array.isArray(state.instanceListEnumerate)) {
          state.instanceListEnumerate = createEmptyFeatureListEnumerateArray();
        }
        if (!Array.isArray(state.instanceListEnumStyles)) {
          state.instanceListEnumStyles = createEmptyFeatureListEnumStyleArray();
        }
        if (!Array.isArray(state.instanceCommentFocus)) {
          state.instanceCommentFocus = createEmptyFeatureCommentFocusArray();
        }
        return state;
      }

function refreshReportFeatureOption(feature) {
        if (!feature) {
          return;
        }
        const state = ensureReportFeatureState(feature);
        const option = document.querySelector(
          '#aiReportFeatureList .ai-feature-option[data-feature="' + feature + '"]'
        );
        if (!option || !state) {
          return;
        }
        const chip = option.querySelector('.ai-feature-chip');
        if (chip) {
          chip.classList.toggle('is-selected', !!state.selected);
        }
        const checkbox = option.querySelector('input[name="aiReportFeatures"][value="' + feature + '"]');
        if (checkbox) {
          checkbox.checked = !!state.selected;
        }
        const extra = option.querySelector('[data-feature-extra="' + feature + '"]');
        if (extra) {
          extra.classList.toggle('ai-hidden', !state.selected);
        }
        const quantityWrapper = option.querySelector('[data-feature-quantity="' + feature + '"]');
        if (quantityWrapper) {
          const allowsQuantity = reportFeatureAllowsQuantity(feature);
          if (!allowsQuantity) {
            state.quantity = getReportFeatureDefaultQuantity(feature);
          }
          const shouldShowQuantity = allowsQuantity && !!state.selected;
          const quantityInput = quantityWrapper.querySelector(
            '[data-feature-quantity-input="' + feature + '"]'
          );
          quantityWrapper.classList.toggle('ai-hidden', !shouldShowQuantity);
          if (quantityInput) {
            const clampedQuantity = clampReportFeatureQuantity(state.quantity, feature);
            state.quantity = clampedQuantity;
            quantityInput.value = clampedQuantity;
            quantityInput.disabled = !shouldShowQuantity;
          }
        }
        const instancesWrapper = option.querySelector('[data-feature-instances="' + feature + '"]');
        if (instancesWrapper) {
          const shouldShowInstances = !!state.selected;
          const normalizedDescriptions = normalizeFeatureInstanceArray(state.instanceDescriptions);
          state.instanceDescriptions = normalizedDescriptions.slice();
          const normalizedTitles = normalizeFeatureTitleArray(state.instanceTitles);
          state.instanceTitles = normalizedTitles.slice();
          const normalizedChartTypes = normalizeFeatureChartTypeArray(state.instanceChartTypes);
          state.instanceChartTypes = normalizedChartTypes.slice();
          let normalizedListOrders = createEmptyFeatureListOrderArray();
          let normalizedListEnumerate = createEmptyFeatureListEnumerateArray();
          let normalizedListEnumStyles = createEmptyFeatureListEnumStyleArray();
          let normalizedCommentFocus = createEmptyFeatureCommentFocusArray();
          if (feature === 'list') {
            normalizedListOrders = normalizeFeatureListOrderArray(state.instanceListOrders);
            normalizedListEnumerate = normalizeFeatureListEnumerateArray(state.instanceListEnumerate);
            normalizedListEnumStyles = normalizeFeatureListEnumStyleArray(state.instanceListEnumStyles);
            state.instanceListOrders = normalizedListOrders.slice();
            state.instanceListEnumerate = normalizedListEnumerate.slice();
            state.instanceListEnumStyles = normalizedListEnumStyles.slice();
          }
          const normalizedCommentFocusArray = normalizeFeatureCommentFocusArray(state.instanceCommentFocus);
          state.instanceCommentFocus = normalizedCommentFocusArray.slice();
          const quantityValue = clampReportFeatureQuantity(state.quantity, feature);
          state.quantity = quantityValue;
          instancesWrapper.classList.toggle('ai-hidden', !shouldShowInstances);
          const instanceItems = instancesWrapper.querySelectorAll(
            '[data-feature-instance="' + feature + '"]'
          );
          instanceItems.forEach(function(item) {
            if (!item || !item.dataset) {
              return;
            }
            const index = parseInt(item.dataset.instanceIndex, 10);
            const textarea = item.querySelector(
              '[data-feature-instance-input="' + feature + '"]'
            );
            const titleInput = item.querySelector(
              '[data-feature-instance-title="' + feature + '"]'
            );
            const typeSelect = item.querySelector(
              '[data-feature-instance-type="' + feature + '"]'
            );
            const orderSelect = item.querySelector(
              '[data-feature-instance-list-order="' + feature + '"]'
            );
            const enumerateSelect = item.querySelector(
              '[data-feature-instance-list-enumerate="' + feature + '"]'
            );
            const enumStyleSelect = item.querySelector(
              '[data-feature-instance-list-style="' + feature + '"]'
            );
            const commentFocusSelect = item.querySelector(
              '[data-feature-instance-comment-focus="' + feature + '"]'
            );
            const withinRange = shouldShowInstances && index >= 0 && index < quantityValue;
            item.classList.toggle('ai-hidden', !withinRange);
            if (textarea) {
              textarea.disabled = !withinRange;
              textarea.required = withinRange;
              if (withinRange) {
                textarea.value = normalizedDescriptions[index] || '';
              } else {
                textarea.value = normalizedDescriptions[index] || '';
              }
            }
            if (titleInput) {
              titleInput.disabled = !withinRange;
              titleInput.value = normalizedTitles[index] || '';
            }
            if (typeSelect) {
              const chartValue = normalizedChartTypes[index] || REPORT_CHART_TYPE_DEFAULT;
              typeSelect.value = chartValue;
              typeSelect.disabled = !withinRange;
              bindChartTypeTooltip(typeSelect);
            }
            if (orderSelect) {
              const orderValue = normalizedListOrders[index] || REPORT_LIST_ORDER_DEFAULT;
              orderSelect.value = orderValue;
              orderSelect.disabled = !withinRange;
            }
            if (enumerateSelect) {
              const enumerateValue = normalizedListEnumerate[index] || REPORT_LIST_ENUMERATE_DEFAULT;
              enumerateSelect.value = enumerateValue;
              enumerateSelect.disabled = !withinRange;
            }
            if (enumStyleSelect) {
              const styleValue = normalizedListEnumStyles[index] || REPORT_LIST_ENUM_STYLE_DEFAULT;
              const enumerateValue = normalizedListEnumerate[index] || REPORT_LIST_ENUMERATE_DEFAULT;
              enumStyleSelect.value = styleValue;

function normalizeOutputLanguageValue(value) {
        if (value === null || value === undefined) {
          return REPORT_OUTPUT_LANGUAGE_DEFAULT;
        }
        const normalized = String(value).trim().toLowerCase();
        if (!normalized) {
          return REPORT_OUTPUT_LANGUAGE_DEFAULT;
        }
        return REPORT_OUTPUT_LANGUAGE_SET[normalized]
          ? normalized
          : REPORT_OUTPUT_LANGUAGE_DEFAULT;
      }

function normalizeToneValue(value) {
        if (value === null || value === undefined) {
          return REPORT_TONE_DEFAULT;
        }
        const normalized = String(value).trim().toLowerCase();
        if (!normalized) {
          return REPORT_TONE_DEFAULT;
        }
        return REPORT_TONE_SET[normalized] ? normalized : REPORT_TONE_DEFAULT;
      }

function createDefaultCustomizationState() {
        return {
          outputLanguage: { enabled: false, value: REPORT_OUTPUT_LANGUAGE_DEFAULT },
          tone: { enabled: false, value: REPORT_TONE_DEFAULT },
          overview: { enabled: false, text: REPORT_OVERVIEW_DEFAULT }
        };
      }

function normalizeReportCustomizationInput(source) {
        const base = createDefaultCustomizationState();
        if (!source || typeof source !== 'object') {
          return base;
        }
        if (source.outputLanguage && typeof source.outputLanguage === 'object') {
          base.outputLanguage.enabled = !!source.outputLanguage.enabled;
          base.outputLanguage.value = normalizeOutputLanguageValue(source.outputLanguage.value);
        }
        if (source.tone && typeof source.tone === 'object') {
          base.tone.enabled = !!source.tone.enabled;
          base.tone.value = normalizeToneValue(source.tone.value);
        }
        if (source.overview && typeof source.overview === 'object') {
          base.overview.enabled = !!source.overview.enabled;
          base.overview.text = source.overview.text ? String(source.overview.text).trim() : REPORT_OVERVIEW_DEFAULT;
        }
        if (!base.outputLanguage.enabled) {
          base.outputLanguage.value = REPORT_OUTPUT_LANGUAGE_DEFAULT;
        }
        if (!base.tone.enabled) {
          base.tone.value = REPORT_TONE_DEFAULT;
        }
        if (!base.overview.enabled) {
          base.overview.text = REPORT_OVERVIEW_DEFAULT;
        }
        return {
          outputLanguage: {
            enabled: base.outputLanguage.enabled,
            value: base.outputLanguage.value
          },
          tone: {
            enabled: base.tone.enabled,
            value: base.tone.value
          },
          overview: {
            enabled: base.overview.enabled,
            text: base.overview.enabled ? base.overview.text : REPORT_OVERVIEW_DEFAULT
          }
        };
      }

function ensureReportCustomizationOption(option) {
        if (!reportCustomizationState || typeof reportCustomizationState !== 'object') {
          reportCustomizationState = createDefaultCustomizationState();
        }
        if (!reportCustomizationState[option]) {
          const defaults = createDefaultCustomizationState();
          reportCustomizationState[option] = Object.assign({}, defaults[option]);
        }
        return reportCustomizationState[option];
      }

function getReportCustomizationOptionElement(option) {
        return document.querySelector(
          '#aiReportCustomizationList .ai-custom-option[data-option="' + option + '"]'
        );
      }

function setReportCustomizationOptionOpen(option, open) {
        const element = getReportCustomizationOptionElement(option);
        if (!element) {
          return;
        }
        element.dataset.open = open ? 'true' : 'false';
        const toggle = element.querySelector('[data-option-toggle="' + option + '"]');
        if (toggle) {
          toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
          const text = toggle.querySelector('.ai-custom-collapse-text');
          if (text) {
            text.textContent = open ? 'Replegar opciones' : 'Desplegar opciones';
          }
          const icon = toggle.querySelector('.ai-custom-collapse-icon');
          if (icon) {
            icon.textContent = open ? '▴' : '▾';
          }
        }
      }

function refreshReportCustomizationOption(option) {
        const element = getReportCustomizationOptionElement(option);
        if (!element) {
          return;
        }
        const state = ensureReportCustomizationOption(option);
        const isEnabled = !!state.enabled;
        const checkbox = element.querySelector('input[data-custom-option="' + option + '"]');
        if (checkbox) {
          checkbox.checked = isEnabled;
        }
        const toggle = element.querySelector('[data-option-toggle="' + option + '"]');
        if (toggle) {
          toggle.disabled = !isEnabled;
        }
        if (!isEnabled) {
          setReportCustomizationOptionOpen(option, false);
        }
        const isOpen = element.dataset.open !== 'false';
        const extra = element.querySelector('[data-option-extra="' + option + '"]');
        if (extra) {
          const shouldShow = isEnabled && isOpen;
          extra.classList.toggle('ai-hidden', !shouldShow);
          extra.querySelectorAll('select, textarea').forEach(function(input) {
            input.disabled = !isEnabled;
          });
        }
        if (option === 'outputLanguage') {
          const select = element.querySelector('[data-custom-select="outputLanguage"]');
          if (select) {
            const value = isEnabled
              ? normalizeOutputLanguageValue(state.value)
              : REPORT_OUTPUT_LANGUAGE_DEFAULT;
            select.value = value;
          }
        } else if (option === 'tone') {
          const select = element.querySelector('[data-custom-select="tone"]');
          if (select) {
            const value = isEnabled ? normalizeToneValue(state.value) : REPORT_TONE_DEFAULT;
            select.value = value;
          }
        } else if (option === 'overview') {
          const textarea = element.querySelector('[data-custom-text="overview"]');
          if (textarea) {
            textarea.disabled = !isEnabled;
            textarea.value = isEnabled ? state.text || '' : '';
          }
        }
      }

function refreshAllReportCustomizationOptions() {
        REPORT_CUSTOMIZATION_OPTIONS.forEach(function(option) {

function updateReportCustomizationSummary() {

        if (!summary) {
          return;
        }
        const active = REPORT_CUSTOMIZATION_OPTIONS.filter(function(option) {
          const state = reportCustomizationState && reportCustomizationState[option];
          return state && state.enabled;
        }).map(function(option) {
          return REPORT_CUSTOMIZATION_LABELS[option] || option;
        });
        if (active.length === 0) {
          summary.textContent = '';
          summary.classList.add('ai-hidden');
        } else {
          summary.textContent = 'Activos: ' + active.join(', ');
          summary.classList.remove('ai-hidden');

          } else if (option === 'overview') {
            state.text = REPORT_OVERVIEW_DEFAULT;

        setReportCustomizationOptionOpen(option, state.enabled);
        refreshReportCustomizationOption(option);
        updateReportCustomizationSummary();

function handleReportCustomizationValueChange(option, value) {

          state.value = normalizeOutputLanguageValue(value);

        updateReportCustomizationSummary();

function normalizeFeatureId(value) {
        if (value === null || value === undefined) {
          return '';
        }
        return String(value).trim();
      }

function applyReportFeatureSelections(features, featureDetails) {
        initializeReportFeatureControls();
        const selectedSet = Object.create(null);
        if (Array.isArray(features)) {
          features.forEach(function(value) {
            const id = normalizeFeatureId(value);
            if (id) {
              selectedSet[id] = true;
            }
          });
        }
        const detailMap = Object.create(null);
        if (Array.isArray(featureDetails)) {
          featureDetails.forEach(function(detail) {
            if (!detail) {
              return;
            }
            const featureId = normalizeFeatureId(detail.feature);
            if (!featureId) {
              return;
            }
            if (!selectedSet[featureId]) {
              return;
            }
            if (detailMap[featureId]) {
              return;
            }
            const quantityValue = clampReportFeatureQuantity(detail.quantity, featureId);
            const instanceDescriptions = normalizeFeatureInstanceArray(detail.instanceDescriptions);
            const instanceTitles = normalizeFeatureTitleArray(detail.instanceTitles);
            const instanceChartTypes = normalizeFeatureChartTypeArray(detail.instanceChartTypes);
            const instanceListOrders = normalizeFeatureListOrderArray(detail.instanceListOrders);
            const instanceListEnumerate = normalizeFeatureListEnumerateArray(
              detail.instanceListEnumerate
            );
            const instanceListEnumStyles = normalizeFeatureListEnumStyleArray(
              detail.instanceListEnumStyles
            );
            const instanceCommentFocus = normalizeFeatureCommentFocusArray(detail.instanceCommentFocus);
            detailMap[featureId] = {
              quantity: quantityValue,
              instanceDescriptions: instanceDescriptions,
              instanceTitles: instanceTitles,
              instanceChartTypes: instanceChartTypes,
              instanceListOrders: instanceListOrders,
              instanceListEnumerate: instanceListEnumerate,
              instanceListEnumStyles: instanceListEnumStyles,
              instanceCommentFocus: instanceCommentFocus
            };
          });
        }
        Object.keys(reportFeatureState).forEach(function(feature) {
          const state = ensureReportFeatureState(feature);
          const isSelected = !!selectedSet[feature];
          state.selected = isSelected;
          if (isSelected) {
            const detail = detailMap[feature];
            state.quantity = detail
              ? clampReportFeatureQuantity(detail.quantity, feature)
              : getReportFeatureDefaultQuantity(feature);
            state.instanceDescriptions = detail
              ? normalizeFeatureInstanceArray(detail.instanceDescriptions)
              : createEmptyFeatureInstanceArray();
            state.instanceTitles = detail
              ? normalizeFeatureTitleArray(detail.instanceTitles)
              : createEmptyFeatureTitleArray();
            state.instanceChartTypes = detail
              ? normalizeFeatureChartTypeArray(detail.instanceChartTypes)
              : createEmptyFeatureChartTypeArray();
            state.instanceListOrders = detail
              ? normalizeFeatureListOrderArray(detail.instanceListOrders)
              : createEmptyFeatureListOrderArray();
            state.instanceListEnumerate = detail
              ? normalizeFeatureListEnumerateArray(detail.instanceListEnumerate)
              : createEmptyFeatureListEnumerateArray();
            state.instanceListEnumStyles = detail
              ? normalizeFeatureListEnumStyleArray(detail.instanceListEnumStyles)
              : createEmptyFeatureListEnumStyleArray();
            state.instanceCommentFocus = detail
              ? normalizeFeatureCommentFocusArray(detail.instanceCommentFocus)
              : createEmptyFeatureCommentFocusArray();
          } else {
            state.quantity = getReportFeatureDefaultQuantity(feature);
            state.instanceDescriptions = createEmptyFeatureInstanceArray();
            state.instanceTitles = createEmptyFeatureTitleArray();
            state.instanceChartTypes = createEmptyFeatureChartTypeArray();
            state.instanceListOrders = createEmptyFeatureListOrderArray();
            state.instanceListEnumerate = createEmptyFeatureListEnumerateArray();
            state.instanceListEnumStyles = createEmptyFeatureListEnumStyleArray();
            state.instanceCommentFocus = createEmptyFeatureCommentFocusArray();
          }
          refreshReportFeatureOption(feature);
        });
        updateSelectedReportFeatures();
      }

function renderSavedActionsSelect(actions, selectedId) {
        const select = document.getElementById('aiSavedActions');
        const emptyMessage = document.getElementById('aiActionsEmptyMessage');
        if (!select) {
          return;
        }
        const list = Array.isArray(actions) ? actions.slice() : [];
        select.innerHTML = '';
        const defaultOption = document.createElement('option');
        defaultOption.value = '';
        defaultOption.textContent = 'Seleccionar...';
        select.appendChild(defaultOption);
        if (list.length === 0) {
          select.disabled = true;
          if (emptyMessage) {
            emptyMessage.textContent = 'No hay acciones guardadas todavía.';
            emptyMessage.classList.remove('ai-hidden');
          }
          clearSavedActionDetails();
          return;
        }
        list.sort(function(a, b) {
          const nameA = (a && a.name ? a.name : '').toLowerCase();
          const nameB = (b && b.name ? b.name : '').toLowerCase();
          if (nameA < nameB) {
            return -1;
          }
          if (nameA > nameB) {
            return 1;
          }
          return 0;
        });
        list.forEach(function(action) {
          if (!action || !action.id) {
            return;
          }
          const option = document.createElement('option');
          option.value = action.id;
          const label = action.name ? action.name : 'Acción sin nombre';
          option.textContent = label + ' • ' + getActionTypeLabel(action.type);
          select.appendChild(option);
        });
        select.disabled = false;
        if (emptyMessage) {
          emptyMessage.classList.add('ai-hidden');
        }
        if (selectedId) {
          const normalized = String(selectedId);
          const option = Array.prototype.find.call(select.options, function(item) {
            return item && item.value === normalized;
          });
          if (option) {
            select.value = normalized;
          } else {
            select.value = '';
            currentSavedActionId = '';
          }
        } else {
          select.value = '';
        }
      }

function clearSavedActionDetails() {

function buildReportFavoriteSummary(action) {
        if (!action) {
          return '';
        }
        const parts = [];
        if (action.format) {
          const formatLabel = REPORT_FORMAT_LABELS[action.format] || action.format;
          parts.push('Formato: ' + formatLabel);
        }
        if (Array.isArray(action.features) && action.features.length > 0) {
          const labels = action.features
            .map(function(feature) {
              return REPORT_FEATURE_LABELS[feature] || feature;
            })
            .filter(function(label) {
              return !!label;
            });
          if (labels.length) {
            parts.push('Características: ' + labels.join(', '));
          }
        }
        if (Array.isArray(action.channels) && action.channels.length > 0) {
          parts.push('Canales: ' + action.channels.join(', '));
        }
        if (action.fileName) {
          parts.push('Archivo: ' + action.fileName + (action.fileExtension ? '.' + action.fileExtension : ''));
        }
        if (action.descriptionEnabled && action.descriptionText) {
          parts.push('Descripción del reporte incluida.');
        }
        return parts.join('\n');
      }

          if (action.rows) {
            rangeInfo.push('Filas: ' + action.rows);
          }
          if (action.cols) {
            rangeInfo.push('Columnas: ' + action.cols);
          }
          extra.textContent = rangeInfo.join(' • ');

async function ensureSavedActionsCache(options) {
        const opts = options || {};
        if (!opts.force && savedActionsLoaded) {
          return savedActionsCache;
        }
        let result;
        try {
          result = await callServerFunction('listSavedActions');
        } catch (err) {
          savedActionsLoaded = false;
          throw err;
        }
        savedActionsCache = Array.isArray(result) ? result.slice() : [];
        savedActionsLoaded = true;
        return savedActionsCache;
      }

async function refreshSavedActions(options) {
        const opts = options || {};
        if (loadingSavedActions) {
          return;
        }
        loadingSavedActions = true;
        try {
          const result = await callServerFunction('listSavedActions');
          savedActionsCache = Array.isArray(result) ? result.slice() : [];
          savedActionsLoaded = true;
          renderSavedActionsSelect(savedActionsCache, opts.selectId || currentSavedActionId);
          const targetId = opts.selectId || currentSavedActionId;
          if (targetId) {
            const exists = savedActionsCache.some(function(entry) {
              return entry && entry.id === targetId;
            });
            if (exists) {
              await loadSavedActionDetails(targetId);
            } else {
              clearSavedActionDetails();
              currentSavedActionId = '';
            }
          } else {
            clearSavedActionDetails();
          }
        } catch (err) {
          savedActionsCache = [];
          savedActionsLoaded = false;
          renderSavedActionsSelect([], '');
          await showMessageModal('No se pudieron obtener las acciones guardadas: ' + (err && err.message ? err.message : err), {
            title: 'Error al listar acciones',
            variant: 'error'
          });
        } finally {
          loadingSavedActions = false;
        }
      }

async function handleReportFavoriteSave() {
        if (savingReportFavorite) {
          return;
        }
        const nameInput = document.getElementById('aiReportFavoriteName');
        const favoriteName = nameInput ? nameInput.value.trim() : '';
        const fileNameInput = document.getElementById('aiReportFileName');
        const fileNameValue = fileNameInput ? fileNameInput.value.trim() : '';
        const sanitizedFileName = sanitizeReportFileName(fileNameValue);
        const selectedFeatures = Array.isArray(selectedReportFeatures)
          ? selectedReportFeatures.slice()
          : [];
        const selectedChannels = Array.isArray(selectedReportChannels)
          ? selectedReportChannels.slice()
          : [];
        const missingItems = [];

        if (!favoriteName) {
          missingItems.push('Nombre del reporte favorito');
        }
        if (!sanitizedFileName) {
          missingItems.push('Nombre del archivo');
        }
        if (!selectedReportFormat) {
          missingItems.push('Formato del reporte');
        }
        if (selectedFeatures.length === 0) {
          missingItems.push('Al menos una característica configurada');
        }
        const featureDetailMap = {};
        const featureDescriptionIssues = [];

        selectedFeatures.forEach(function(feature) {
          const state = ensureReportFeatureState(feature);
          const label = REPORT_FEATURE_LABELS[feature] || feature;
          const quantityValue = state ? clampReportFeatureQuantity(state.quantity, feature) : 1;
          const baseDescriptions = normalizeFeatureInstanceArray(state ? state.instanceDescriptions : []);
          const baseTitles = normalizeFeatureTitleArray(state ? state.instanceTitles : []);
          const baseChartTypes = normalizeFeatureChartTypeArray(state ? state.instanceChartTypes : []);
          const baseListOrders = normalizeFeatureListOrderArray(state ? state.instanceListOrders : []);
          const baseListEnumerate = normalizeFeatureListEnumerateArray(
            state ? state.instanceListEnumerate : []
          );
          const baseListEnumStyles = normalizeFeatureListEnumStyleArray(
            state ? state.instanceListEnumStyles : []
          );
          const baseCommentFocus = normalizeFeatureCommentFocusArray(
            state ? state.instanceCommentFocus : []
          );
          const trimmedDescriptions = baseDescriptions.map(function(text) {
            return text ? String(text).trim() : '';
          });
          for (var idx = 0; idx < quantityValue; idx++) {
            if (!trimmedDescriptions[idx]) {
              featureDescriptionIssues.push({ feature: label, index: idx });
            }
          }
          if (state) {
            state.quantity = quantityValue;
            state.instanceDescriptions = trimmedDescriptions.slice();
            state.instanceTitles = baseTitles.slice();
            state.instanceChartTypes = baseChartTypes.slice();
            state.instanceListOrders = baseListOrders.slice();
            state.instanceListEnumerate = baseListEnumerate.slice();
            state.instanceListEnumStyles = baseListEnumStyles.slice();
            state.instanceCommentFocus = baseCommentFocus.slice();
          }
          featureDetailMap[feature] = {
            quantity: quantityValue,
            instanceDescriptions: trimmedDescriptions.slice(),
            instanceTitles: baseTitles.slice(),
            instanceChartTypes: baseChartTypes.slice(),
            instanceListOrders: baseListOrders.slice(),
            instanceListEnumerate: baseListEnumerate.slice(),
            instanceListEnumStyles: baseListEnumStyles.slice(),
            instanceCommentFocus: baseCommentFocus.slice()
          };
        });

        if (featureDescriptionIssues.length > 0) {
          featureDescriptionIssues.forEach(function(issue) {
            missingItems.push('Descripción ' + (issue.index + 1) + ' para ' + issue.feature);
          });
        }

        if (selectedChannels.length === 0) {
          missingItems.push('Al menos un canal para compartir');
        }

        if (missingItems.length > 0) {
          await showMessageModal('Faltan datos para guardar en favoritos:\n• ' + missingItems.join('\n• '), {
            title: 'Completa los datos requeridos',
            variant: 'warning'
          });
          return;
        }

        try {
          await ensureSavedActionsCache();
        } catch (err) {
          await showMessageModal(
            'No se pudieron validar los favoritos existentes: ' + (err && err.message ? err.message : err),
            {
              title: 'Validación pendiente',
              variant: 'error'
            }
          );
          return;
        }
        const normalizedFavoriteName = favoriteName.toLowerCase();
        const duplicateFavorite = savedActionsCache.some(function(entry) {
          if (!entry || !entry.name) {
            return false;
          }
          const type = (entry.type || '').toLowerCase();
          if (type !== 'reportfavorite') {
            return false;
          }
          return entry.name.trim().toLowerCase() === normalizedFavoriteName;
        });
        if (duplicateFavorite) {
          await showMessageModal('Ya existe un favorito con ese nombre. Elige otro nombre para guardarlo.', {
            title: 'Nombre duplicado',
            variant: 'warning'
          });
          return;
        }

        selectedFeatures.forEach(function(feature) {
          const state = ensureReportFeatureState(feature);
          if (!state) {
            return;
          }
          const detail = featureDetailMap[feature];
          if (detail) {
            state.quantity = clampReportFeatureQuantity(detail.quantity, feature);
            state.instanceDescriptions = normalizeFeatureInstanceArray(detail.instanceDescriptions);
            refreshReportFeatureOption(feature);
          }
        });

        const selectedTables = getSelectedAiTableIds();
        if (!selectedTables || selectedTables.length === 0) {
          await showMessageModal('Selecciona al menos una tabla para asociar el reporte.', {
            title: 'Tablas requeridas',
            variant: 'warning'
          });
          return;
        }

        const descriptionToggle = document.getElementById('aiReportDescriptionToggle');
        const descriptionField = document.getElementById('aiReportDescription');
        const descriptionEnabled = descriptionToggle ? !!descriptionToggle.checked : false;
        const descriptionText =
          descriptionEnabled && descriptionField ? descriptionField.value || '' : '';
        const featureDetails = selectedFeatures.map(function(feature) {
          const detail = featureDetailMap[feature] || {
            quantity: getReportFeatureDefaultQuantity(feature),
            instanceDescriptions: createEmptyFeatureInstanceArray(),
            instanceTitles: createEmptyFeatureTitleArray(),
            instanceChartTypes: createEmptyFeatureChartTypeArray(),
            instanceListOrders: createEmptyFeatureListOrderArray(),
            instanceListEnumerate: createEmptyFeatureListEnumerateArray(),
            instanceListEnumStyles: createEmptyFeatureListEnumStyleArray(),
            instanceCommentFocus: createEmptyFeatureCommentFocusArray()
          };
          return {
            feature: feature,
            quantity: clampReportFeatureQuantity(detail.quantity, feature),
            instanceDescriptions: normalizeFeatureInstanceArray(detail.instanceDescriptions),
            instanceTitles: normalizeFeatureTitleArray(detail.instanceTitles),
            instanceChartTypes: normalizeFeatureChartTypeArray(detail.instanceChartTypes),
            instanceListOrders: normalizeFeatureListOrderArray(detail.instanceListOrders),
            instanceListEnumerate: normalizeFeatureListEnumerateArray(detail.instanceListEnumerate),
            instanceListEnumStyles: normalizeFeatureListEnumStyleArray(detail.instanceListEnumStyles),
            instanceCommentFocus: normalizeFeatureCommentFocusArray(detail.instanceCommentFocus)
          };
        });
        const customizationPayload = getReportCustomizationPayload();
        const payload = {
          name: favoriteName,
          format: selectedReportFormat,
          fileName: sanitizedFileName,
          fileExtension: getCurrentReportExtension(),
          appendDateToFile: !!reportFileDateEnabled,
          tables: selectedTables,
          channels: selectedChannels,
          descriptionEnabled: descriptionEnabled,
          description: descriptionText,
          features: selectedFeatures,
          featureDetails: featureDetails,
          customization: customizationPayload,
          emails: sanitizeContactSelection(
            getCheckedValuesFromList('aiReportEmailList'),
            REPORT_ALL_EMAILS_VALUE
          ),
          phones: sanitizeContactSelection(
            getCheckedValuesFromList('aiReportPhoneList'),
            REPORT_ALL_PHONES_VALUE
          )
        };
        const saveBtn = document.getElementById('aiReportFavoriteSaveBtn');
        try {
          savingReportFavorite = true;
          if (saveBtn) {
            saveBtn.disabled = true;
          }
          const result = await callServerFunction('saveReportFavorite', payload);
          if (result && result.error) {
            throw new Error(result.error);
          }
          closeReportFavoriteModal({ resetName: true });
          await showMessageModal('Reporte guardado en favoritos.', {
            title: 'Favorito guardado',
            variant: 'success'
          });
          await refreshSavedActions({ selectId: result && result.id ? result.id : currentSavedActionId });
        } catch (err) {
          await showMessageModal(
            'No se pudo guardar el reporte favorito: ' + (err && err.message ? err.message : err),
            {
              title: 'No se pudo guardar',
              variant: 'error'
            }
          );
        } finally {
          savingReportFavorite = false;
          if (saveBtn) {
            saveBtn.disabled = false;
          }
        }
      }

function toggleReportDescriptionField(visible) {
        const descriptionField = document.getElementById('aiReportDescription');
        const wrapper = descriptionField ? descriptionField.closest('.ai-optional-comment') : null;
        if (!descriptionField) {
          return;
        }
        if (visible) {
          descriptionField.classList.remove('ai-hidden');
          if (wrapper) {
            wrapper.classList.remove('ai-hidden');
          }
        } else {
          descriptionField.classList.add('ai-hidden');
          descriptionField.value = '';
          if (wrapper) {
            wrapper.classList.add('ai-hidden');
          }
        }
      }

function updateReportDeliverySections() {
        const values = Array.isArray(selectedReportChannels) ? selectedReportChannels : [];
        document.querySelectorAll('.ai-delivery-config').forEach(function(section) {
          const channel = section.dataset ? section.dataset.channel : '';
          if (channel && values.indexOf(channel) !== -1) {
            section.style.display = 'block';
            if (section.classList && section.classList.contains('ai-collapsible')) {
              if (!section.dataset.open) {
                section.dataset.open = 'true';
              }
              updateCollapsibleToggle(section);
            }
          } else {
            section.style.display = 'none';
          }
        });
      }

function saveReportEmail() {
        const input = document.getElementById('aiReportEmailInput');
        const nameInput = document.getElementById('aiReportEmailNameInput');
        const list = document.getElementById('aiReportEmailList');
        if (!input || !list) {
          return;
        }
        const value = (input.value || '').trim();
        const label = nameInput ? (nameInput.value || '').trim() : '';
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!value) {
          setReportHelperMessage('aiReportEmailMessage', 'Ingrese un correo electrónico válido para guardarlo.', 'error');
          return;
        }
        if (!emailRegex.test(value)) {
          setReportHelperMessage('aiReportEmailMessage', 'El formato del correo no es válido.', 'error');
          return;
        }
        const trimmedValue = value.trim();
        const previouslySelected = sanitizeContactSelection(
          getCheckedValuesFromList('aiReportEmailList'),
          REPORT_ALL_EMAILS_VALUE
        );
        const existingIndex = savedReportEmails.findIndex(function(entry) {
          const normalized = normalizeReportEmailEntry(entry);
          return normalized && normalized.address === trimmedValue;
        });
        const baseSelection = previouslySelected.indexOf(REPORT_ALL_EMAILS_VALUE) !== -1
          ? [REPORT_ALL_EMAILS_VALUE]
          : previouslySelected.slice();
        if (existingIndex === -1) {
          savedReportEmails.push({ address: trimmedValue, label: label });
          persistReportContactList('emails', savedReportEmails);
          if (baseSelection.indexOf(REPORT_ALL_EMAILS_VALUE) === -1) {
            baseSelection.push(trimmedValue);
          }
          renderReportEmailList(baseSelection);
          setReportHelperMessage('aiReportEmailMessage', 'Correo guardado correctamente.', 'success');
        } else {
          const existingEntry = normalizeReportEmailEntry(savedReportEmails[existingIndex]);
          let message = 'El correo ya estaba guardado. Se seleccionó automáticamente.';
          if (existingEntry && existingEntry.address) {
            if ((existingEntry.label || '') !== label) {
              savedReportEmails[existingIndex] = { address: existingEntry.address, label: label };
              persistReportContactList('emails', savedReportEmails);
              message = 'Se actualizó la información del correo guardado.';
            }
          }
          if (baseSelection.indexOf(trimmedValue) === -1 && baseSelection.indexOf(REPORT_ALL_EMAILS_VALUE) === -1) {
            baseSelection.push(trimmedValue);
          }
          renderReportEmailList(baseSelection);
          setReportHelperMessage('aiReportEmailMessage', message, 'success');
        }
        input.value = '';
        if (nameInput) {
          nameInput.value = '';
        }
      }

function saveReportPhone() {

        if (!input || !list) {

        const label = nameInput ? (nameInput.value || '').trim() : '';
        const phoneRegex = /^[+]?[-()\d\s]{6,}$/;
        if (!value) {
          setReportHelperMessage('aiReportPhoneMessage', 'Ingrese un número de contacto para guardarlo.', 'error');
          return;
        }
        if (!phoneRegex.test(value)) {
          setReportHelperMessage('aiReportPhoneMessage', 'El número ingresado no parece válido.', 'error');
          return;
        }
        const trimmedValue = value.trim();
        const previouslySelected = sanitizeContactSelection(
          getCheckedValuesFromList('aiReportPhoneList'),
          REPORT_ALL_PHONES_VALUE
        );
        const existingIndex = savedReportPhones.findIndex(function(entry) {
          const normalized = normalizeReportPhoneEntry(entry);
          return normalized && normalized.number === trimmedValue;
        });
        const baseSelection = previouslySelected.indexOf(REPORT_ALL_PHONES_VALUE) !== -1
          ? [REPORT_ALL_PHONES_VALUE]
          : previouslySelected.slice();
        if (existingIndex === -1) {
          savedReportPhones.push({ number: trimmedValue, label: label });
          persistReportContactList('phones', savedReportPhones);
          if (baseSelection.indexOf(REPORT_ALL_PHONES_VALUE) === -1) {
            baseSelection.push(trimmedValue);
          }
          renderReportPhoneList(baseSelection);
          setReportHelperMessage('aiReportPhoneMessage', 'Número guardado correctamente.', 'success');
        } else {
          const existingEntry = normalizeReportPhoneEntry(savedReportPhones[existingIndex]);
          let message = 'El número ya estaba guardado. Se seleccionó automáticamente.';
          if (existingEntry && existingEntry.number) {
            if ((existingEntry.label || '') !== label) {
              savedReportPhones[existingIndex] = { number: existingEntry.number, label: label };
              persistReportContactList('phones', savedReportPhones);
              message = 'Se actualizó la información del número guardado.';
            }
          }
          if (baseSelection.indexOf(trimmedValue) === -1 && baseSelection.indexOf(REPORT_ALL_PHONES_VALUE) === -1) {
            baseSelection.push(trimmedValue);
          }
          renderReportPhoneList(baseSelection);
          setReportHelperMessage('aiReportPhoneMessage', message, 'success');
        }
        input.value = '';
        if (nameInput) {
          nameInput.value = '';
        }
      }

function initializeReportSection() {
        if (reportSectionInitialized) {
          return;
        }
        savedReportEmails = loadReportContactList('emails');
        savedReportPhones = loadReportContactList('phones');
        renderReportEmailList([]);
        renderReportPhoneList([]);
        setupCollapsibleControls(document.getElementById('aiReportSection'));
        updateReportFormatSummary();
        updateReportFileExtension();
        updateReportFeaturesSummary();
        const formatButtons = document.querySelectorAll('#aiReportSection .ai-report-btn');
        formatButtons.forEach(function(btn) {
          btn.addEventListener('click', function() {
            if (!btn.dataset || !btn.dataset.format) {
              return;
            }
            handleReportFormatSelection(btn.dataset.format);
          });
        });
        const descToggle = document.getElementById('aiReportDescriptionToggle');
        if (descToggle) {
          descToggle.addEventListener('change', function() {
            toggleReportDescriptionField(descToggle.checked);
          });
          toggleReportDescriptionField(descToggle.checked);
        }
        const fileDateToggle = document.getElementById('aiReportFileDateToggle');
        if (fileDateToggle) {
          fileDateToggle.addEventListener('change', function() {
            handleReportFileDateToggle(fileDateToggle.checked);
          });
          handleReportFileDateToggle(fileDateToggle.checked);
        } else {
          reportFileDateEnabled = false;
          updateReportFileExtension();
        }
        initializeReportFeatureControls();
        initializeReportCustomizationControls();
        const deliverySelector = document.getElementById('aiReportDeliverySelector');
        if (deliverySelector) {
          const toggle = document.getElementById('aiReportDeliveryToggle');
          if (toggle) {
            toggle.addEventListener('click', handleReportDeliveryToggle);
          }
          const menu = document.getElementById('aiReportDeliveryMenu');
          if (menu) {
            menu.addEventListener('change', function(event) {
              const target = event.target;
              if (!target || target.type !== 'checkbox') {
                return;
              }
              updateSelectedReportChannels();
            });
          }
          setReportDeliveryOpen(false);
          updateReportDeliverySummary();
          if (!reportDeliveryOutsideListenerAttached) {
            document.addEventListener('click', handleReportDeliveryOutsideClick);
            reportDeliveryOutsideListenerAttached = true;
          }
        }
        const emailSaveBtn = document.getElementById('aiReportEmailSaveBtn');
        if (emailSaveBtn) {
          emailSaveBtn.addEventListener('click', saveReportEmail);
        }
        const phoneSaveBtn = document.getElementById('aiReportPhoneSaveBtn');
        if (phoneSaveBtn) {
          phoneSaveBtn.addEventListener('click', saveReportPhone);
        }
        const favoriteBtn = document.getElementById('aiReportFavoriteBtn');
        if (favoriteBtn) {
          favoriteBtn.addEventListener('click', function() {
            openReportFavoriteModal();
          });
        }
        const favoriteCancelBtn = document.getElementById('aiReportFavoriteCancelBtn');
        if (favoriteCancelBtn) {
          favoriteCancelBtn.addEventListener('click', function() {
            closeReportFavoriteModal({ resetName: true, focusTrigger: true });
          });
        }
        const favoriteSaveBtn = document.getElementById('aiReportFavoriteSaveBtn');
        if (favoriteSaveBtn) {
          favoriteSaveBtn.addEventListener('click', function() {
            handleReportFavoriteSave();
          });
        }
        const generateBtn = document.getElementById('aiReportGenerateBtn');
        if (generateBtn && !generateBtn.dataset.bound) {
          generateBtn.addEventListener('click', function() {
            handleReportGenerate();
          });
          generateBtn.dataset.bound = 'true';
        }
        const favoriteOverlay = document.getElementById('aiFavoriteModalOverlay');
        if (favoriteOverlay && !favoriteOverlay.dataset.bound) {
          favoriteOverlay.addEventListener('click', function(event) {
            if (event.target === favoriteOverlay) {
              closeReportFavoriteModal({ resetName: false, focusTrigger: true });
            }
          });
          favoriteOverlay.dataset.bound = 'true';
        }
        if (!favoriteModalEscapeListenerAttached) {
          document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape' && reportFavoriteModalVisible) {
              closeReportFavoriteModal({ resetName: false, focusTrigger: true });
            }
          });
          favoriteModalEscapeListenerAttached = true;
        }
        closeReportFavoriteModal({ resetName: true });
        updateSelectedReportChannels();
        reportSectionInitialized = true;
      }

function updateAiActionState() {
        const select = document.getElementById('aiActionSelect');
        const askSection = document.getElementById('aiAskSection');
        const reportSection = document.getElementById('aiReportSection');
        const questionInput = document.getElementById('questionInput');
        const askBtn = document.getElementById('askBtn');
        const answerBox = document.getElementById('answerBox');
        if (!select || !askSection) {
          return;
        }
        const action = select.value;
        if (action === 'ask') {
          askSection.style.display = 'block';
          if (reportSection) {
            reportSection.style.display = 'none';
          }
          if (questionInput) {
            questionInput.disabled = false;
          }
          if (askBtn) {
            askBtn.disabled = false;
          }
        } else if (action === 'report') {
          initializeReportSection();
          askSection.style.display = 'none';
          if (reportSection) {
            reportSection.style.display = 'block';
          }
          if (questionInput) {
            questionInput.value = '';
            questionInput.disabled = true;
          }
          if (askBtn) {
            askBtn.disabled = true;
          }
          if (answerBox) {
            answerBox.value = '';
          }
        } else {
          askSection.style.display = 'none';
          if (reportSection) {
            reportSection.style.display = 'none';
          }
          resetReportSection();
          if (questionInput) {
            questionInput.value = '';
            questionInput.disabled = true;
          }
          if (askBtn) {
            askBtn.disabled = true;
          }
          if (answerBox) {
            answerBox.value = '';
          }
        }
      }



      document.getElementById('editSavedTables').addEventListener('change', function() {
        syncEditSavedTablesHighlight();
        const val = this.value;
        if (!val) {
          setEditSavedListCollapsed(false);
          resetEditTabView();
          return;
        }
        setEditSavedListCollapsed(true);
        resetEditTabView({ preserveSelection: true, clearEditingId: false });
        editingId = val;
        const cachedMeta = getSavedTableFromCache(val);
        if (cachedMeta) {
          populateEditForm(cachedMeta);
        }
        google.script.run
          .withSuccessHandler(function(meta) {
            if (!meta) {
              if (!cachedMeta) {
                populateEditForm(meta);
              }
              return;
            }
            populateEditForm(meta);
          })
          .withFailureHandler(function(err) {
            const message = err && err.message ? err.message : err;
            showMessageModal('No se pudo obtener la tabla seleccionada: ' + message, {
              title: 'Error al cargar tabla',
              variant: 'error'
            });
          })
          .getTableMeta(val);
      });

      const editSavedList = document.getElementById('editSavedTablesList');
      if (editSavedList) {
        editSavedList.addEventListener('click', function(event) {
          if (editSavedList.classList.contains('disabled')) {
            return;
          }
          const locateBtn = event.target.closest('.edit-saved-locate');
          if (locateBtn) {
            event.preventDefault();
            event.stopPropagation();
            const tableId = locateBtn.dataset ? locateBtn.dataset.value : '';
            if (tableId) {
              locateSavedTable(tableId);
            }
            return;
          }
          const item = event.target.closest('.edit-saved-item');
          if (item && item.dataset && item.dataset.value) {
            if (editSavedList.classList.contains('collapsed')) {
              event.preventDefault();
              setEditSavedListCollapsed(false);
              return;
            }
            event.preventDefault();
            selectEditSavedTable(item.dataset.value);
          }
        });
        editSavedList.addEventListener('keydown', function(event) {
          if (editSavedList.classList.contains('disabled')) {
            return;
          }
          if (event.key === 'Enter' || event.key === ' ') {
            const item = event.target.closest('.edit-saved-item');
            if (item && item.dataset && item.dataset.value) {
              if (editSavedList.classList.contains('collapsed')) {
                event.preventDefault();
                setEditSavedListCollapsed(false);
                return;
              }
              event.preventDefault();
              selectEditSavedTable(item.dataset.value);
            }
          }
        });
      }

      document.getElementById('editDeleteTableBtn').addEventListener('click', async function() {
        if (!editingId) {
          await showMessageModal('Seleccione una tabla guardada antes de borrarla.', {
            title: 'Seleccione una tabla',
            variant: 'error'
          });
          return;
        }
        const targetId = editingId;
        const cached = getSavedTableFromCache(targetId);
        const nameSuffix = cached && cached.name ? ' "' + cached.name + '"' : '';
        const confirmed = await showConfirmModal(
          'Se eliminará la tabla' +
            nameSuffix +
            '. Se borrarán el contenido y formato del rango asociado y sus metadatos guardados. ¿Desea continuar?',
          {
            title: 'Confirmar borrado',
            variant: 'warning',
            confirmText: 'Borrar tabla',
            cancelText: 'Cancelar'
          }
        );
        if (!confirmed) {
          return;
        }
        google.script.run
          .withSuccessHandler(async function(res) {
            if (res && res.error) {
              await showMessageModal(res.error, {
                title: 'No se pudo borrar',
                variant: 'error'
              });
              return;
            }
            const removedOnly = res && res.removed && !(res && res.warning);
            editingId = '';
            lastSavedTableId = '';
            removeSavedTableFromCache(targetId);
            applySavedTablesFromCache(['editSavedTables', 'aiSavedTables']);
            await refreshSavedTables(['editSavedTables', 'aiSavedTables']);
            resetEditTabView();
            const hasWarning = res && res.warning;
            let message;
            let title;
            let variant;
            if (removedOnly) {
              message = (res && res.message) || 'Se ha retirado de la lista.';
              title = 'Tabla no encontrada';
              variant = 'info';
            } else if (hasWarning) {
              message = 'Tabla borrada. ' + res.warning;
              title = 'Tabla borrada con advertencias';
              variant = 'warning';
            } else {
              message = 'Tabla borrada correctamente.';
              title = 'Tabla borrada';
              variant = 'success';
            }
            await showMessageModal(message, {
              title: title,
              variant: variant
            });
          })
          .withFailureHandler(async function(err) {
            const message = err && err.message ? err.message : err;
            await showMessageModal('No se pudo borrar la tabla: ' + message, {
              title: 'No se pudo borrar',
              variant: 'error'
            });
          })
          .deleteSavedTable(targetId);
      });

      document.getElementById('askBtn').addEventListener('click', function() {
        const actionSelect = document.getElementById('aiActionSelect');
        if (actionSelect && actionSelect.value !== 'ask') {
          return;
        }
        const select = document.getElementById('aiSavedTables');
        const selectedValues = Array.prototype.slice
          .call(select && select.options ? select.options : [])
          .filter(function(option) {
            return option.selected && option.value;
          })
          .map(function(option) {
            return option.value;
          });
        const questionInput = document.getElementById('questionInput');
        const question = questionInput ? questionInput.value.trim() : '';
        if (selectedValues.length === 0) {
          showMessageModal('Seleccione al menos una tabla para realizar la consulta.', {
            title: 'Seleccione una tabla',
            variant: 'error'
          });
          return;
        }
        if (!question) {
          showMessageModal('Escriba una pregunta.', {
            title: 'Pregunta requerida',
            variant: 'error'
          });
          return;
        }
        const payload = selectedValues.indexOf(ALL_TABLES_OPTION_VALUE) !== -1 ? ALL_TABLES_OPTION_VALUE : selectedValues;
        const answerField = document.getElementById('answerBox');
        if (answerField) {
          answerField.value = '';
        }
        google.script.run.withSuccessHandler(function(res) {
          if (res && res.error) {
            showMessageModal(res.error, {
              title: 'Consulta no disponible',
              variant: 'error'
            });
          } else {
            if (answerField) {
              answerField.value = res.answer || '';
            }
          }
        }).askQuestion(payload, question);
      });

      document.addEventListener('DOMContentLoaded', function() {
        window.addEventListener('beforeunload', handleSidebarBeforeUnload);
        setDefaultStyles();
        setEditDefaultStyles();
        const aiSelect = document.getElementById('aiSavedTables');
        const aiList = document.getElementById('aiSavedTablesList');
        if (aiSelect) {
          aiSelect.addEventListener('change', function() {
            updateAiListSelectionUI(aiSelect);
          });
        }
        if (aiList) {
          aiList.addEventListener('click', function(event) {
            const target = event.target;
            if (!target) {
              return;
            }
            const item = typeof target.closest === 'function' ? target.closest('.ai-multi-item') : null;
            if (!item || !item.dataset || !item.dataset.value || aiList.classList.contains('disabled')) {
              return;
            }
            toggleAiListValue(item.dataset.value);
          });
          aiList.addEventListener('keydown', function(event) {
            if (event.key !== 'Enter' && event.key !== ' ' && event.key !== 'Spacebar') {
              return;
            }
            const target = event.target;
            if (!target) {
              return;
            }
            const item = typeof target.closest === 'function' ? target.closest('.ai-multi-item') : null;
            if (!item || !item.dataset || !item.dataset.value || aiList.classList.contains('disabled')) {
              return;
            }
            event.preventDefault();
            toggleAiListValue(item.dataset.value);
          });
        }
        const aiActionSelect = document.getElementById('aiActionSelect');
        if (aiActionSelect) {
          aiActionSelect.addEventListener('change', updateAiActionState);
          updateAiActionState();
        }
        applyReportFeatureTooltips();
        applyReportChartTypeTooltips();
        applyOptionalCommentHints();
        updateReportFileExtension();
        const reportFileNameInput = document.getElementById('aiReportFileName');
        if (reportFileNameInput) {
          reportFileNameInput.addEventListener('input', function() {
            updateReportFileExtension();
          });
        }
        const savedActionsSelect = document.getElementById('aiSavedActions');
        if (savedActionsSelect) {
          savedActionsSelect.addEventListener('change', function() {
            loadSavedActionDetails(savedActionsSelect.value);
          });
        }
        const savedActionsRefreshBtn = document.getElementById('aiSavedActionsRefreshBtn');
        if (savedActionsRefreshBtn) {
          savedActionsRefreshBtn.addEventListener('click', function() {
            refreshSavedActions({ selectId: currentSavedActionId });
          });
        }
        const rangeInput = document.getElementById('rangeInput');
        if (rangeInput) {
          rangeInput.dataset.manual = 'false';
          rangeInput.addEventListener('input', function() {
            this.dataset.manual = this.value.trim() ? 'true' : 'false';
            if (this.dataset.manual === 'true') {
              rangeInfo = null;
              markCreateFormatDirty();
              resetPendingFormatState();
            } else {
              clearCreateFormatDirty();
            }
          });
        }
        const editRangeInput = document.getElementById('editRangeInput');
        if (editRangeInput) {
          editRangeInput.dataset.manual = 'false';
          editRangeInput.addEventListener('input', function() {
            this.dataset.manual = this.value.trim() ? 'true' : 'false';
            if (this.dataset.manual === 'true') {
              editRangeInfo = null;
            }
            if (editingId) {
              markEditFormatDirty();
            }
          });
        }
        const editStyleInputs = [
          { id: 'editColorHeader', event: 'input' },
          { id: 'editColorAlt1', event: 'input' },
          { id: 'editColorAlt2', event: 'input' },
          { id: 'editToggleBorder', event: 'change' },
          { id: 'editToggleBold', event: 'change' },
          { id: 'editUpdateFormulaRefs', event: 'change' }
        ];
        editStyleInputs.forEach(function(cfg) {
          const el = document.getElementById(cfg.id);
          if (!el) {
            return;
          }
          el.addEventListener(cfg.event || 'change', function() {
            if (cfg.id === 'editUpdateFormulaRefs') {
              applyEditFormulaPreference(this.checked);
            }
            if (editingId) {
              markEditFormatDirty();
            }
          });
        });
        resetEditTabView();
        restoreSavedTablesCache();
        applySavedTablesFromCache(['editSavedTables', 'aiSavedTables']);
        refreshSavedTables(['editSavedTables', 'aiSavedTables']);
        setActiveTab('aiTab', { force: true });
      });
    
</script>
